      - name: Register watcher autostart (ONLOGON) [F99 B2 hardened]
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command pwsh.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch { }
          $argLine = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-watcher.ps1"'
          # [F99 B2/B4] resolve ACTIVE desktop user (runneradmin) vs generated rdp user
          $watchUser = $user
          try {
            $q = & quser.exe 2>$null; $LASTEXITCODE=0
            foreach ($line in @($q)) { if ($line -match '^\s*>?\s*(\S+)\s+\S+\s+\d+\s+Active') { $watchUser = $Matches[1]; break } }
          } catch { }
          if (-not $watchUser) { try { $watchUser = (Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue).UserName.Split('\')[-1] } catch { } }
          if (-not $watchUser) { $watchUser = 'runneradmin' }
          Write-Host ('[F99] watcher target user: generated=' + $user + ' active=' + $watchUser)
          $registered = $false
          # (a) Hardened XML import — guarantees Principal/UserId, LogonType InteractiveToken, RunLevel Highest,
          # AllowStartOnDemand true, Exec path C:\ghrdp\ghrdp-watcher.ps1
          # [F100] Default task XML (here-string at body column 0, pattern matches direct-hunter).
          $xmlTemplateDefault = @'
          <?xml version="1.0" encoding="UTF-16"?>
          <Task version="1.4" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
            <RegistrationInfo><Author>GH-RDP</Author><Description>GHRDP watcher (F99 inline)</Description><URI>\GhrdpWatcher</URI></RegistrationInfo>
            <Triggers><LogonTrigger><Enabled>true</Enabled><UserId>runneradmin</UserId></LogonTrigger></Triggers>
            <Principals><Principal id="Author"><UserId>runneradmin</UserId><LogonType>InteractiveToken</LogonType><RunLevel>HighestAvailable</RunLevel></Principal></Principals>
            <Settings><MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy><DisallowStartIfOnBatteries>false</DisallowStartIfGoingOnBatteries><StopIfGoingOnBatteries>false</DisallowStartIfGoingOnBatteries><AllowHardTerminate>true</AllowHardTerminate><StartWhenAvailable>true</StartWhenAvailable><RunOnlyIfNetworkAvailable>false</RunOnlyIfNetworkAvailable><IdleSettings><StopOnIdleEnd>false</StopOnIdleEnd><RestartOnIdle>false</RestartOnIdle></IdleSettings><AllowStartOnDemand>true</AllowStartOnDemand><Enabled>true</Enabled><Hidden>false</Hidden><RunOnlyIfIdle>false</RunOnlyIfIdle><WakeToRun>false</WakeToRun><ExecutionTimeLimit>PT6H</ExecutionTimeLimit><Priority>7</Priority></Settings>
            <Actions Context="Author"><Exec><Command>powershell.exe</Command><Arguments>-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-watcher.ps1"</Arguments><WorkingDirectory>C:\ghrdp</WorkingDirectory></Exec></Actions>
          </Task>
          '@
          $xmlTemplateDefault = ($xmlTemplateDefault -split "`r?`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`r`n"
          try {
              $xmlTemplate = $null
              $candidates = @(
                  (Join-Path $env:GITHUB_WORKSPACE 'docs/f99-watcher-task.xml'),
                  (Join-Path $env:RUNNER_TEMP 'ghrdp-stage/docs/f99-watcher-task.xml'),
                  'C:\ghrdp\docs-f99-watcher-task.xml'
              )
              foreach ($cand in $candidates) { if (Test-Path -LiteralPath $cand) { $xmlTemplate = Get-Content -LiteralPath $cand -Raw -ErrorAction Stop; break } }
              if (-not $xmlTemplate) { $xmlTemplate = $xmlTemplateDefault }
            $xmlPatched = $xmlTemplate.Replace('runneradmin', $watchUser).Replace('powershell.exe', $pwshPath)
            Register-ScheduledTask -TaskName 'GhrdpWatcher' -Xml $xmlPatched -Force -ErrorAction Stop | Out-Null
            $registered = $true
            Write-Host ('[F99] GhrdpWatcher ONLOGON registered via -Xml for ' + $watchUser + ' (AllowStartOnDemand=true, InteractiveToken/Highest)')
            try {
              $back = Get-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction Stop
              Write-Host ('[F99] verify: Principal=' + $back.Principal.UserId + ' LogonType=' + $back.Principal.LogonType + ' RunLevel=' + $back.Principal.RunLevel)
            } catch { Write-Host '[F99] verify read-back failed' }
          } catch {
            Write-Host ('[F99] Register-ScheduledTask -Xml failed: ' + $_.Exception.Message)
          }
          if (-not $registered) {
            try {
              $action = New-ScheduledTaskAction -Execute $pwshPath -Argument $argLine
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $watchUser
              $principal = New-ScheduledTaskPrincipal -UserId $watchUser -LogonType Interactive -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -AllowStartOnDemand -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              try { $settings.AllowStartOnDemand = $true } catch { }
              $settings.StartWhenAvailable = $true
              Register-ScheduledTask -TaskName 'GhrdpWatcher' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              $registered = $true
              Write-Host ('[F99] GhrdpWatcher ONLOGON registered via New-ScheduledTask* fallback for ' + $watchUser)
            } catch {
              Write-Host ('[watcher] Register-ScheduledTask failed: ' + $_.Exception.Message)
            }
          }
          if (-not $registered) {
              try {
                  & schtasks.exe /Create /F /SC ONLOGON /TN GhrdpWatcher /TR ('"{0}" {1}' -f $pwshPath, $argLine) 2>$null
                  $LASTEXITCODE = 0
                  $registered = $true
                  Write-Host '[watcher] schtasks ONLOGON fallback registered'
              } catch {
                  Write-Host ('[watcher] schtasks fallback failed: ' + $_.Exception.Message)
              }
          }
          # ------------------------------------------------------------------
          # [F95 §3.2 / R2] START IT NOW, AND MAKE THE SHORTCUT OURS.
          #
          # ROOT CAUSE of "watcher: IDLE" on a desktop the operator could see
          # through noVNC: this step REGISTERED GhrdpWatcher and then stopped.
          # An ONLOGON task only fires on the NEXT logon, so until somebody
          # signed in the watcher was never running - and the one thing that
          # starts it unconditionally was the desktop shortcut
          # "GHRDP Start (watcher + dashboard).lnk", i.e. a human click. The
          # old log line even claimed a "startup-folder shortcut" as mechanism
          # (a), but that shortcut is written BY THE WATCHER ITSELF
          # (payloads/ghrdp-watcher.ps1, first-run setup) - circular.
          #
          # Fixes, in the order the operator will feel them:
          #   (1) start the task immediately, so THIS dispatch already has a
          #       live watcher instead of one that waits for a logon;
          #   (2) write the Startup-folder shortcut HERE, so it exists even on
          #       a watcher that has never run once;
          #   (3) if both fail, say so loudly instead of printing a coverage
          #       claim that is not true.
          # The single-instance mutex in ghrdp-watcher.ps1 makes the extra
          # start harmless: a second invocation exits immediately.
          # ------------------------------------------------------------------
          $started = $false
          if ($registered) {
              try {
                  Start-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction Stop
                  $started = $true
                  Write-Host '[watcher] GhrdpWatcher STARTED now (not waiting for a logon)'
              } catch {
                  Write-Host ('[watcher] Start-ScheduledTask failed: ' + $_.Exception.Message)
              }
          }
          if (-not $started) {
              try {
                  & schtasks.exe /Run /TN GhrdpWatcher 2>$null
                  $LASTEXITCODE = 0
                  $started = $true
                  Write-Host '[watcher] schtasks /Run fallback started the watcher'
              } catch {
                  Write-Host ('[watcher] schtasks /Run fallback failed: ' + $_.Exception.Message)
              }
          }
          if (-not $started) {
              Write-Host ('::warning::[watcher] GhrdpWatcher could not be started at bootstrap - ' +
                'the watcher will only come up on the next interactive logon or via the dashboard Start-watcher button')
          }

          # (2) Startup-folder shortcut, written by the WORKFLOW for the RDP
          # user's real profile. Redundant with the ONLOGON task by design: the
          # task is the primary, this survives a task that fails to register.
          try {
              $profRoot = 'C:\Users'
              $targetProf = ''
              if ($user) {
                  $leaf = ([string]$user -split '\\')[-1]
                  $cand = Join-Path $profRoot $leaf
                  if (Test-Path -LiteralPath $cand) { $targetProf = $cand }
              }
              if (-not $targetProf) {
                  try { $targetProf = [string]((Get-CimInstance -ClassName Win32_UserProfile -Filter 'Special=False' -ErrorAction Stop | Select-Object -First 1).LocalPath) } catch { }
              }
              if ($targetProf) {
                  $suDir = Join-Path $targetProf 'AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
                  New-Item -ItemType Directory -Path $suDir -Force -ErrorAction SilentlyContinue | Out-Null
                  $suLnk = Join-Path $suDir 'GHRDP Watcher.lnk'
                  if (-not (Test-Path -LiteralPath $suLnk)) {
                      $ws = New-Object -ComObject WScript.Shell
                      $sc = $ws.CreateShortcut($suLnk)
                      $sc.TargetPath = $pwshPath
                      $sc.Arguments = $argLine
                      $sc.WorkingDirectory = 'C:\ghrdp'
                      $sc.WindowStyle = 7
                      $sc.Save()
                      Write-Host ('[watcher] Startup-folder shortcut written at ' + $suLnk)
                  } else {
                      Write-Host '[watcher] Startup-folder shortcut already present'
                  }
              } else {
                  Write-Host '[watcher] no user profile resolved - Startup shortcut skipped (the ONLOGON task above still covers it)'
              }
          } catch {
              Write-Host ('[watcher] Startup shortcut failed: ' + $_.Exception.Message)
          }

          Write-Host '[watcher] autostart coverage (3 mechanisms):'
          Write-Host ('  (a) startup-folder shortcut - written HERE by the workflow (F95; it used to be written by the watcher itself, which is circular)')
          Write-Host ('  (b) ONLOGON scheduled task running as the RDP user - registered AND started above (started=' + $started + ')')
          Write-Host '  (c) dashboard Start-watcher button + the F95 server-side watcher supervisor'

          # ------------------------------------------------------------------
          # [F98 §2.3 / P3] SYSTEM-LEVEL FALLBACK: break the circular dep.
          #
          # ROOT CAUSE of "watcher: IDLE" persisting after F95: the ONLOGON
          # task requires an interactive user session, but on GitHub-hosted
          # runners the AutoAdminLogon only takes effect on the NEXT boot
          # (which would end the job), and `Start-ScheduledTask` for an
          # ONLOGON task fails silently without an active session.
          #
          # FIX: register a SYSTEM-level AT-STARTUP task that starts the
          # watcher regardless of user logon. The watcher's own mutex makes
          # duplicate starts harmless. This breaks the circular dependency:
          #   server needs logon -> logon needs watcher -> watcher needs server
          # by providing a fourth path that needs none of them.
          # ------------------------------------------------------------------
          if (-not $started) {
              $sysRegistered = $false
              try {
                  $sysAction = New-ScheduledTaskAction -Execute $pwshPath -Argument $argLine
                  $sysTrigger = New-ScheduledTaskTrigger -AtStartup
                  $sysPrincipal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
                  $sysSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
                  Register-ScheduledTask -TaskName 'GhrdpWatcherSystem' -Action $sysAction -Trigger $sysTrigger -Principal $sysPrincipal -Settings $sysSettings -Force -ErrorAction Stop | Out-Null
                  $sysRegistered = $true
                  Write-Host '[watcher] F98 SYSTEM-level fallback task GhrdpWatcherSystem registered'
              } catch {
                  Write-Host ('[watcher] F98 SYSTEM-level fallback failed: ' + $_.Exception.Message)
              }
              if ($sysRegistered) {
                  try {
                      Start-ScheduledTask -TaskName 'GhrdpWatcherSystem' -ErrorAction Stop
                      Write-Host '[watcher] F98 GhrdpWatcherSystem STARTED (SYSTEM context, no user logon required)'
                  } catch {
                      Write-Host ('[watcher] F98 GhrdpWatcherSystem start failed: ' + $_.Exception.Message)
                  }
              }
          }

          # [F98 §2.3] write dashboard-url.txt for the first-login script (§2.4)
          try {
              $dashUrl = ''
              if ($env:TS_TAILNET_IP) { $dashUrl = 'http://' + $env:TS_TAILNET_IP + ':7333/' }
              elseif ($ip) { $dashUrl = 'http://' + $ip + ':7333/' }
              if ($dashUrl) {
                  New-Item -ItemType Directory -Path 'C:\ProgramData\ghrdp' -Force -ErrorAction SilentlyContinue | Out-Null
                  Set-Content -Path 'C:\ProgramData\ghrdp\dashboard-url.txt' -Value $dashUrl -Force
                  Write-Host ('[F98] dashboard-url.txt written: ' + $dashUrl)
              }
          } catch {
              Write-Host ('[F98] dashboard-url.txt write failed: ' + $_.Exception.Message)
          }

          # ------------------------------------------------------------------
          # [F98 §2.4 / P4] FIRST-LOGIN RDP UX CLEANUP SCRIPT.
          #
          # Deploys ghrdp-rdp-first-login.ps1 to C:\ghrdp and registers it in
          # the user's Startup folder (AND as an ONLOGON task for redundancy).
          # On first interactive logon, the script:
          #   1. Minimizes PowerShell windows (no more full-screen admin prompt)
          #   2. Dismisses Tailscale welcome dialog
          #   3. Auto-opens the dashboard in Edge app/kiosk mode
          # The script writes an "already-ran.flag" so it only runs once.
          # ------------------------------------------------------------------
          try {
              $firstLoginScript = 'C:\ghrdp\ghrdp-rdp-first-login.ps1'
              $stageScript = Join-Path $env:RUNNER_TEMP 'ghrdp-stage\ghrdp-rdp-first-login.ps1'
              if (Test-Path -LiteralPath $stageScript) {
                  Copy-Item -LiteralPath $stageScript -Destination $firstLoginScript -Force -ErrorAction Stop
                  Write-Host ('[F98] first-login script deployed to ' + $firstLoginScript)
              } else {
                  Write-Host '[F98] first-login script not found in stage - skipped deployment'
              }

              # Register as ONLOGON task (redundant with Startup folder).
              $flArgLine = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-rdp-first-login.ps1"'
              try {
                  $flAction = New-ScheduledTaskAction -Execute $pwshPath -Argument $flArgLine
                  $flTrigger = New-ScheduledTaskTrigger -AtLogOn -User $user
                  $flPrincipal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
                  $flSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
                  Register-ScheduledTask -TaskName 'GhrdpFirstLogin' -Action $flAction -Trigger $flTrigger -Principal $flPrincipal -Settings $flSettings -Force -ErrorAction Stop | Out-Null
                  Write-Host '[F98] GhrdpFirstLogin ONLOGON task registered'
              } catch {
                  Write-Host ('[F98] GhrdpFirstLogin task registration failed: ' + $_.Exception.Message)
              }

              # Also write to the Startup folder for redundancy.
              if ($targetProf) {
                  $suDir2 = Join-Path $targetProf 'AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
                  New-Item -ItemType Directory -Path $suDir2 -Force -ErrorAction SilentlyContinue | Out-Null
                  $flLnk = Join-Path $suDir2 'GHRDP First Login.lnk'
                  if (-not (Test-Path -LiteralPath $flLnk)) {
                      $ws2 = New-Object -ComObject WScript.Shell
                      $sc2 = $ws2.CreateShortcut($flLnk)
                      $sc2.TargetPath = $pwshPath
                      $sc2.Arguments = $flArgLine
                      $sc2.WorkingDirectory = 'C:\ghrdp'
                      $sc2.WindowStyle = 7
                      $sc2.Save()
                      Write-Host ('[F98] first-login Startup shortcut written at ' + $flLnk)
                  }
              }
          } catch {
              Write-Host ('[F98] first-login setup failed: ' + $_.Exception.Message)
          }

          exit 0

      # [F91 §A.2] Persistent launcher SERVICE for MIRROR MODE. The script lives
      # at C:\ProgramData\ghrdp\ (NOT C:\ghrdp) because the queue + heartbeat +
      # log under ProgramData must be writable by BOTH the SYSTEM-run server and
      # the Interactive-task runner user without ACL gymnastics. Registered
      # ONLOGON with a hidden window (F11-5.3: every host-helper launch in this
      # workflow stays -WindowStyle Hidden) and started once right here so the
      # dashboard's first /api/launcher/queue of THIS dispatch already drains.
      # Verification below reads the task's LAST TASK RESULT/STATE back; a task
      # that never registered prints a loud ::warning:: - the dashboard's
      # mirror toast degrades to "RDP launcher: offline", never a hard error.
      # ------------------------------------------------------------------
      # [F94 §3.4] WINDOWS AUTO-LOGON ARMING + LOGON PROOF.
      #
      # ROOT CAUSE of "LAST LOGON none yet": the F91 launcher is an ONLOGON
      # task, and on a GitHub-hosted Windows runner NOTHING EVER LOGS ON. The
      # workflow runs under the runner service; AutoAdminLogon was never
      # configured; Start-F93LauncherLogonWatch (ghrdp-server.ps1) only WATCHES
      # for a type-10 4624, it cannot create one. So the launcher never starts
      # and every mirror-mode queue write lands in a directory nobody drains.
      #
      # HONEST SCOPE: AutoAdminLogon only takes effect on the NEXT logon or
      # reboot, and a reboot would end this job. This step therefore does the
      # three things that ARE true and verifiable now, and FAILS LOUDLY when
      # the logon cannot be proven:
      #   1. arms AutoAdminLogon in the registry (write + READ-BACK proof);
      #   2. waits up to 60s for a type-10 4624 in the Security log;
      #   3. emits ::error:: with the exact reason when it does not arrive, so
      #      the dashboard's yellow logon banner (which is driven by that same
      #      evidence, never by a guess) has a real cause behind it.
      # No security control is weakened: NLA/CredSSP/TLS are untouched, the
      # password is written only to the Winlogon registry values designed to
      # hold it and is NEVER echoed to the log, and the account is the runner's
      # own local user that the RDP listener already authenticates.
      # ------------------------------------------------------------------
      - name: Arm Windows Auto-Logon and prove a type-10 4624 (F94)
        shell: pwsh
        env:
          RDP_USER: ${{ env.RDP_USER }}
          RDP_PASS: ${{ env.RDP_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'

          if (-not $user -or -not $pass) {
            Write-Host '::error::[f94] RDP_USER/RDP_PASS missing - cannot arm AutoAdminLogon. The launcher (an ONLOGON task) will not start; log in via WEB DESKTOP.'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '[f94] Auto-Logon: NOT ARMED (no credentials in scope). Log in via WEB DESKTOP.'
            exit 0
          }

          # [F99 §2.4 / B4] Autologon user mismatch: $user is the per-run generated rdp account
          # (rdpb2e2fa) but the interactive desktop on a hosted runner belongs to
          # runneradmin — so the ONLOGON tasks never fire for the user that is
          # actually signed in. Resolve the ACTIVE session user via quser and arm
          # AutoAdminLogon for THAT user, syncing its password so the credential
          # is valid. If no active user is found, fall back to runneradmin.
          $activeUser = ''
          try {
            $q = & quser.exe 2>$null; $LASTEXITCODE=0
            foreach ($line in @($q)) { if ($line -match '^\s*>?\s*(\S+)\s+\S+\s+\d+\s+Active') { $activeUser = $Matches[1]; break } }
          } catch { $activeUser='' }
          if (-not $activeUser) {
            try { $activeUser = (Get-CimInstance Win32_ComputerSystem -ErrorAction SilentlyContinue).UserName.Split('\')[-1] } catch { }
          }
          if (-not $activeUser) { $activeUser = 'runneradmin' }
          # Sync the active user's password to $pass so DefaultPassword is valid
          try {
            $sec = ConvertTo-SecureString $pass -AsPlainText -Force
            Set-LocalUser -Name $activeUser -Password $sec -ErrorAction Stop | Out-Null
            Write-Host ("[F99] synced password for autologon user " + $activeUser)
          } catch {
            try { & net.exe user $activeUser $pass 2>$null | Out-Null; $LASTEXITCODE=0; Write-Host ("[F99] synced password via net user for " + $activeUser) } catch { Write-Host ("[F99] password sync for " + $activeUser + " failed: " + $_.Exception.Message) }
          }
          # For diagnostics, also expose the mapping
          Write-Host ("[F99] autologon target: generated=" + $user + " active=" + $activeUser)

          # 1. Arm AutoAdminLogon, then READ IT BACK - a write nobody verifies
          #    is the same class of silent failure as the launcher itself.
          $armed = $false
          $armReason = ''
          $autologonUser = $activeUser
          try {
            Set-ItemProperty -Path $winlogon -Name 'AutoAdminLogon'    -Value '1'          -Type String -Force -ErrorAction Stop
            Set-ItemProperty -Path $winlogon -Name 'DefaultUserName'   -Value $autologonUser -Type String -Force -ErrorAction Stop
            Set-ItemProperty -Path $winlogon -Name 'DefaultPassword'   -Value $pass        -Type String -Force -ErrorAction Stop
            Set-ItemProperty -Path $winlogon -Name 'DefaultDomainName' -Value $env:COMPUTERNAME -Type String -Force -ErrorAction Stop
            $rb = Get-ItemProperty -Path $winlogon -ErrorAction Stop
            # The password is deliberately NOT compared or printed here; only
            # the three non-secret values are verified and reported.
            $armed = ([string]$rb.AutoAdminLogon -eq '1' -and [string]$rb.DefaultUserName -eq $autologonUser)
            if (-not $armed) { $armReason = 'registry read-back did not match the values written' }
          } catch {
            $armReason = $_.Exception.Message
          }

          if ($armed) { Write-Host ('[F99] AutoAdminLogon ARMED (verified by read-back) for ' + $autologonUser + ' (generated ' + $user + ' mapped to active)') }
          else { Write-Host ('::warning::[f94] AutoAdminLogon NOT armed: ' + $armReason) }

          # 2. Look for an INTERACTIVE (type 2/10/11) 4624 - [F99 §2.3] was type-10 only,
          #    so an AutoAdminLogon (type 2) desktop read as no session.
          $type10 = $null
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            try {
              $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = 4624 } -MaxEvents 60 -ErrorAction SilentlyContinue
              foreach ($e in @($ev)) {
                $xml = [xml]$e.ToXml()
                $nodes = $xml.Event.EventData.Data
                $lt = $null
                foreach ($n in $nodes) { if ($n.Name -eq 'LogonType') { $lt = [string]$n.'#text' } }
                if ($lt -eq '2' -or $lt -eq '10' -or $lt -eq '11') { $type10 = $e; break }
              }
            } catch { }
            if ($type10) { break }
            Start-Sleep -Seconds 5
          }

          if ($type10) {
            Write-Host ('[f94] type-10 4624 present at ' + $type10.TimeCreated.ToString('o') + ' - an interactive session exists, the ONLOGON launcher can run.')
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('[f94] Auto-Logon: interactive logon CONFIRMED (' + $type10.TimeCreated.ToString('o') + ').')
            exit 0
          }

          # 3. Say exactly what happened. This is NOT a job failure - the
          #    dashboard must still come up so the operator can log in through
          #    WEB DESKTOP - but it must never be silent.
          $q = ''
          try { $q = (@(& quser.exe 2>$null) -join ' | ') } catch { $q = '(quser unavailable)' }
          Write-Host ('::error::[f94] NO interactive logon within 60s - launcher offline. AutoAdminLogon armed=' + $armed + '; quser: ' + $q + '. AutoAdminLogon only applies to the NEXT logon/reboot, and a reboot would end this job, so log in via the WEB DESKTOP button on the dashboard (the F94 fix makes that button report a blocked popup instead of doing nothing).')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('[f94] Auto-Logon: NOT CONFIRMED within 60s (armed=' + $armed + '). Log in via WEB DESKTOP; the launcher starts on that logon.')
          exit 0

      - name: Register GHRDP-Launcher service (F91 mirror mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER
          $pdDir = 'C:\ProgramData\ghrdp'
          New-Item -ItemType Directory -Path $pdDir -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $pdDir 'launcher-queue') -Force | Out-Null
          $src = Join-Path $pdDir 'ghrdp-rdp-launcher.ps1'
          $staged = 'C:\ghrdp\ghrdp-rdp-launcher.ps1'
          if (Test-Path -LiteralPath $staged) {
              Copy-Item -LiteralPath $staged -Destination $src -Force
              Write-Host '[f91] launcher script staged to' $src
          } else {
              Write-Host '::warning::[f91] ghrdp-rdp-launcher.ps1 missing at C:\ghrdp - launcher service cannot start (mirror mode degrades to local-open only)'
          }
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command pwsh.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch { }
          $tr = ('powershell.exe -NoProfile -WindowStyle Hidden -File "{0}"' -f $src)
          $registered = $false
          try {
              $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -WindowStyle Hidden -File "{0}"' -f $src)
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
              $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartInterval (New-TimeSpan -Minutes 1) -RestartCount 999
              Register-ScheduledTask -TaskName 'GHRDP-Launcher' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              $registered = $true
              Write-Host '[f91] GHRDP-Launcher ONLOGON task registered (no time limit, auto-restart 1m)'
          } catch {
              Write-Host ('[f91] Register-ScheduledTask failed: ' + $_.Exception.Message)
          }
          if (-not $registered) {
              try {
                  & schtasks.exe /Create /F /SC ONLOGON /TN GHRDP-Launcher /RL HIGHEST /TR ('"{0}"' -f ($tr -replace '"','\"')) 2>$null
                  if ($LASTEXITCODE -eq 0) { $registered = $true; Write-Host '[f91] schtasks ONLOGON fallback registered' }
              } catch { Write-Host ('[f91] schtasks fallback failed: ' + $_.Exception.Message) }
              $LASTEXITCODE = 0
          }
          if ($registered) {
              try { & schtasks.exe /Run /TN GHRDP-Launcher 2>$null; $LASTEXITCODE = 0 } catch { }
              Start-Sleep -Seconds 6
              $info = $null
              try { $info = Get-ScheduledTaskInfo -TaskName 'GHRDP-Launcher' -ErrorAction Stop } catch { }
              if ($info) {
                  Write-Host ('[f91] task health: State=' + [string]$info.State + ' LastRun=' + [string]$info.LastRunTime + ' LastResult=' + [string]$info.LastTaskResult)
                  if ($info.State -eq 'Running') { Write-Host '[f91] launcher service RUNNING (heartbeat will be <30s old)' }
              }
              $hb = Join-Path $pdDir 'launcher-heartbeat.txt'
              if (Test-Path -LiteralPath $hb) { Write-Host ('[f91] heartbeat file present: ' + [string](Get-Content -LiteralPath $hb -Raw)) }
          } else {
              Write-Host '::warning::[f91] GHRDP-Launcher task NOT registered - /api/launcher/health will report taskExists=false'
          }
          exit 0

      - name: Register GhrdpWebDesk task (active-user Interactive principal)
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $activeUser = $env:RDP_USER
          try {
            $qu = & quser.exe 2>$null; $LASTEXITCODE = 0
            foreach ($line in @($qu)) {
              if ($line -match '^\s*(>?)\s*(\S+)\s+\S+\s+(\d+)\s+Active') { $activeUser = $Matches[2] }
            }
          } catch { }
          if (-not $activeUser) { $activeUser = $env:RDP_USER }
          Write-Host ('[webdesk] principal = ' + $activeUser)
          try { Unregister-ScheduledTask -TaskName 'GhrdpWebDesk' -Confirm:$false -ErrorAction SilentlyContinue } catch { }
          try {
            $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-pub2.ps1"'
            $trigger = New-ScheduledTaskTrigger -AtLogOn -User $activeUser
            $principal = New-ScheduledTaskPrincipal -UserId $activeUser -LogonType Interactive -RunLevel Highest
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
            Register-ScheduledTask -TaskName 'GhrdpWebDesk' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
            Start-ScheduledTask -TaskName 'GhrdpWebDesk' -ErrorAction SilentlyContinue
            Write-Host '[webdesk] GhrdpWebDesk task registered + started'
          } catch { Write-Host ('[webdesk] task registration failed: ' + $_.Exception.Message) }

      - name: Register display normalizer tasks (boot + logon)
        shell: pwsh
        run: |
          Copy-Item -Path (Join-Path 'payloads' 'disp-norm.ps1') -Destination 'C:\ghrdp\disp-norm.ps1' -Force
          foreach ($spec in @(@{n='GhrdpDispNormBoot'; t='startup'; u='SYSTEM'; lt='ServiceAccount'}, @{n='GhrdpDispNorm'; t='logon'; u=$env:RDP_USER; lt='Interactive'})) {
            try { Unregister-ScheduledTask -TaskName $spec.n -Confirm:$false -ErrorAction SilentlyContinue } catch { }
            $a = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\disp-norm.ps1"'
            if ($spec.t -eq 'startup') { $tg = New-ScheduledTaskTrigger -AtStartup; $pr = New-ScheduledTaskPrincipal -UserId $spec.u -LogonType ServiceAccount -RunLevel Highest }
            else { $tg = New-ScheduledTaskTrigger -AtLogOn -User $spec.u; $pr = New-ScheduledTaskPrincipal -UserId $spec.u -LogonType Interactive -RunLevel Highest }
            Register-ScheduledTask -TaskName $spec.n -Action $a -Trigger $tg -Principal $pr -Force | Out-Null
          }
          Start-ScheduledTask -TaskName 'GhrdpDispNormBoot' -ErrorAction SilentlyContinue
          Write-Host '[disp] normalizer tasks registered (AtStartup SYSTEM + AtLogOn user)'

      - name: Register web desktop capture (ONLOGON, runneradmin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $user = 'runneradmin'
          $pwshPath = 'powershell.exe'
          try { $c = Get-Command powershell.exe -ErrorAction Stop; if ($c) { $pwshPath = $c.Source } } catch {
            try { $c2 = Get-Command pwsh.exe -ErrorAction Stop; if ($c2) { $pwshPath = $c2.Source } } catch { }
          }
          try {
              $action = New-ScheduledTaskAction -Execute $pwshPath -Argument '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-pub2.ps1"'
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $user
              $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpWebDeskAdmin' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              Write-Host '[webdesk] GhrdpWebDeskAdmin ONLOGON task registered for runneradmin'
              try { Start-ScheduledTask -TaskName 'GhrdpWebDeskAdmin' -ErrorAction Stop; Write-Host '[webdesk] GhrdpWebDeskAdmin start attempted (runneradmin console session already live)' } catch { Write-Host ('[webdesk] admin task start deferred: ' + $_.Exception.Message) }
          } catch { Write-Host ('[webdesk] runneradmin task register failed: ' + $_.Exception.Message) }
          exit 0

      - name: WebRTC unit tests (pipeline restart loop, backoff ramp)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $repoRoot = ''
          foreach ($root in @('D:\a','C:\a')) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Recurse -Filter 'go.mod' -Depth 8 -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like '*payloads\ghrdp-webrtc\go.mod' } | Select-Object -First 1
              if ($hit) { $repoRoot = $hit.FullName.Substring(0, $hit.FullName.Length - '\payloads\ghrdp-webrtc\go.mod'.Length); break }
          }
          if (-not $repoRoot) { $repoRoot = $env:GITHUB_WORKSPACE }
          $src = Join-Path $repoRoot 'payloads\ghrdp-webrtc'
          Write-Host ('[webrtc] unit tests in ' + $src)
          Push-Location $src
          try {
              $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
              go test -mod=readonly -count=1 ./... 2>&1 | ForEach-Object { Write-Host ('  go test: ' + $_) }
              $rc = $LASTEXITCODE
          } finally { Pop-Location }
          # A failing restart loop is the blackout bug; failing here is much cheaper
          # than discovering it from a 22s black canvas on the deployed server.
          if ($rc -ne 0) { Write-Host '[webrtc] FATAL: unit tests failed'; exit 1 }
          Write-Host '[webrtc] unit tests passed'
          exit 0

      - name: Build and deploy WebRTC server (identity-proof, stamped, session-guarded)
        env:
          GH_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== WebRTC server deploy (P1/P2/P3/P6) ==='
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              Write-Host '[webrtc] Installing FFmpeg...'
              choco install ffmpeg -y --no-progress 2>&1 | Out-Null
              $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH','User')
          }
          Write-Host ('[webrtc] ffmpeg: ' + ((ffmpeg -version 2>&1 | Select-Object -First 1) -replace 'ffmpeg version ',''))
          # Discover the workspace the SAME way a SYSTEM/terminal-exec run must:
          # recursive search for payloads\ghrdp-webrtc\go.mod under D:\a first.
          $repoRoot = ''
          foreach ($root in @('D:\a','C:\a')) {
              if (-not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Recurse -Filter 'go.mod' -Depth 8 -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like '*payloads\ghrdp-webrtc\go.mod' } | Select-Object -First 1
              if ($hit) { $repoRoot = $hit.FullName.Substring(0, $hit.FullName.Length - '\payloads\ghrdp-webrtc\go.mod'.Length); break }
          }
          if (-not $repoRoot) { $repoRoot = $env:GITHUB_WORKSPACE }
          Write-Host ('[webrtc] repo root: ' + $repoRoot)
          $bootstrap = Join-Path $repoRoot 'payloads\ghrdp-webrtc\deploy-bootstrap.ps1'
          if (-not (Test-Path $bootstrap)) { Write-Host ('[webrtc] FATAL: bootstrap missing at ' + $bootstrap); exit 1 }
          & $bootstrap -RepoRoot $repoRoot -GitCommit $env:GH_SHA
          $rc = $LASTEXITCODE
          Write-Host ('[webrtc] deploy-bootstrap exit code: ' + $rc)
          if ($rc -ne 0) { Write-Host '[webrtc] FATAL: identity-proof deploy failed - not silently continuing'; exit $rc }
          exit 0

      - name: Stamp guard (/version git_commit == workflow sha, session_id == 2)
        env:
          GH_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $deadline = (Get-Date).AddSeconds(20)
          $v = $null
          while ((Get-Date) -lt $deadline) {
              try { $v = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/version' -TimeoutSec 3 -ErrorAction Stop; if ($v) { break } } catch { }
              Start-Sleep -Milliseconds 750
          }
          if (-not $v) { Write-Host '[stamp] FATAL: /version unreachable on :8080'; exit 1 }
          Write-Host ('[stamp] /version -> commit=' + $v.git_commit + ' session_id=' + $v.session_id + ' capture=' + $v.capture + ' encoder=' + $v.encoder + ' mode=' + $v.mode + ' exe=' + $v.exe_path)
          $stampSha = [string]$v.git_commit
          if (-not $stampSha -or $stampSha -eq 'unknown') { Write-Host '[stamp] FATAL: binary is unstamped (no git_commit in /version)'; exit 1 }
          if ($stampSha -ne $env:GH_SHA) { Write-Host ('[stamp] FATAL: /version git_commit ' + $stampSha + ' != workflow sha ' + $env:GH_SHA); exit 1 }
          if ([int]$v.session_id -ne 2) {
              Write-Host ('[stamp] session_id ' + $v.session_id + ' != 2 - restarting GhrdpWebRTC once')
              try { Stop-ScheduledTask -TaskName 'GhrdpWebRTC' -ErrorAction SilentlyContinue } catch { }
              $stampExe = 'webrtc-server.exe'
              try {
                  $st = Get-ScheduledTask -TaskName 'GhrdpWebRTC' -ErrorAction SilentlyContinue
                  if ($st -and $st.Actions -and $st.Actions[0].Execute) { $stampExe = Split-Path -Leaf ([string]$st.Actions[0].Execute) }
              } catch { }
              Get-CimInstance Win32_Process -Filter ("Name='" + $stampExe + "'") -ErrorAction SilentlyContinue | ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force } catch { } }
              Start-Sleep -Seconds 3
              try { Start-ScheduledTask -TaskName 'GhrdpWebRTC' -ErrorAction Stop } catch { }
              Start-Sleep -Seconds 5
              try { $v = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/version' -TimeoutSec 5 -ErrorAction Stop } catch { $v = $null }
              if (-not $v -or [int]$v.session_id -ne 2) { Write-Host '[stamp] FATAL: server not in session 2 after restart'; exit 1 }
              Write-Host ('[stamp] post-restart session_id=' + $v.session_id)
          }
          Write-Host '[stamp] GUARD PASS: stamped binary serving in session 2'
          exit 0

      - name: Auto-acceptance probe (30s -> acceptance.json -> artifact + summary)
        continue-on-error: true
        env:
          GH_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $acc = 'C:\ghrdp\webrtc\accept-webrtc.ps1'
          if (-not (Test-Path $acc)) { Write-Host ('[accept] FATAL: ' + $acc + ' missing'); exit 1 }
          & $acc -ExpectedSha $env:GH_SHA -DurationSec 30 -SummaryPath $env:GITHUB_STEP_SUMMARY
          $rc = $LASTEXITCODE
          Write-Host ('[accept] acceptance exit code: ' + $rc)
          $j = 'C:\ghrdp\webrtc\acceptance.json'
          if (Test-Path $j) { Write-Host '[accept] acceptance.json:'; Get-Content $j | ForEach-Object { Write-Host ('  ' + $_) } }
          else { Write-Host '[accept] FATAL: acceptance.json was not produced' }
          if ($rc -ne 0) { Write-Host '[accept] FATAL: acceptance FAILED - see summary above'; exit $rc }
          exit 0

      - name: Upload acceptance artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-acceptance-${{ github.run_id }}
          path: |
            C:\ghrdp\webrtc\acceptance.json
            C:\ghrdp\webrtc\probe-1.out
            C:\ghrdp\webrtc\probe-2.out
            C:\ghrdp\webrtc\deploy.log
            C:\ghrdp\webrtc\ffmpeg-stderr.log
            C:\ghrdp\webrtc\crash.log
            C:\ghrdp\webrtc\server.log
            C:\ghrdp\webrtc\accept.log
            C:\ghrdp\webrtc\dumps\*
          if-no-files-found: warn
          retention-days: 14

      - name: Keep Parsec host session warm (auto-relaunch parsecd as RDP user)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ru = $env:RDP_USER
          try {
              $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -Command "while($true){ if(-not (Get-Process parsecd -ErrorAction SilentlyContinue)){ $p=(Get-ChildItem ''C:\Program Files\Parsec\parsecd.exe'',''C:\Program Files (x86)\Parsec\parsec.exe'' -ErrorAction SilentlyContinue | Select -First 1); if($p){ Start-Process $p.FullName } }; Start-Sleep 10 }"')
              $trigger = New-ScheduledTaskTrigger -AtLogOn -User $ru
              $principal = New-ScheduledTaskPrincipal -UserId $ru -LogonType Interactive -RunLevel Highest
              Register-ScheduledTask -TaskName 'GhrdpParsecWarm' -Action $action -Trigger $trigger -Principal $principal -Force -ErrorAction Stop | Out-Null
              Write-Host '[parsec] warm-keep task registered for ' + $ru
              try { Start-ScheduledTask -TaskName 'GhrdpParsecWarm' -ErrorAction Stop; Write-Host '[parsec] warm task started (session live now)' } catch { Write-Host '[parsec] warm task starts at next logon' }
          } catch { Write-Host ('[parsec] warm task failed: ' + $_.Exception.Message) }
          exit 0

      - name: Machine personalization + apps (Edge/Chrome/Firefox extensions + bookmarks, VB-CABLE)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = ''
          try { $ip = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { }
          $cfgPath = 'C:\ghrdp\config.json'
          $cfg = @{}
          if (Test-Path $cfgPath) { try { $cfg = Get-Content -LiteralPath $cfgPath -Raw | ConvertFrom-Json } catch { } }
          $pagesBase = [string]$cfg.pagesBase
          $defTheme = 'Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $defTheme -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $defTheme -Name 'AppsUseLightTheme' -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $defTheme -Name 'SystemUsesLightTheme' -Value 0 -Type DWord -ErrorAction SilentlyContinue
          $defDwm = 'Registry::HKEY_USERS\.DEFAULT\Software\Microsoft\Windows\DWM'
          New-Item -Path $defDwm -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path $defDwm -Name 'AccentColor' -Value 0xff4cc2ff -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $defDwm -Name 'AccentColorInactive' -Value 0xff2a6f8f -Type DWord -ErrorAction SilentlyContinue
          Write-Host '[theme] dark mode + accent staged for new logons'
          $rustOn = ($env:RUST_AVAILABLE -eq 'true')
          $tailPort = '7331'
          if ($rustOn) { $tailPort = '7332' }
          # [F10-4b §4.2] managed bookmark policy = exactly {Mission Control,
          # docs/AUTOLOGIN.md repo page, Tailscale admin-DNS}. No third-party
          # indexes are ever placed here (launch-gate F10 fails on any match).
          $reqBookmarks = @()
          $sessionBookmarks = @()
          if ($ip) { $sessionBookmarks += @{ name = 'Mission Control'; url = ('http://' + $ip + ':' + $tailPort) } }
          else     { $sessionBookmarks += @{ name = 'Mission Control'; url = 'http://127.0.0.1:7331' } }
          $sessionBookmarks += @(
              @{ name = 'Auto-login guide (docs/AUTOLOGIN.md)'; url = 'https://github.com/dekarita/supreme-lamp/blob/main/docs/AUTOLOGIN.md' },
              @{ name = 'Tailscale Admin - DNS'; url = 'https://login.tailscale.com/admin/dns' }
          )
          # [remediation] pagesBase tool bookmarks (Decryptor/Archive/Explorer) removed
          $allBookmarks = $reqBookmarks + $sessionBookmarks
          # [F10-11 §4.1] Edge extension IDs: resolved AT BUILD TIME from live
          # pages only - never from memory. The resolver lives in exactly ONE
          # place (payloads/edge-ext-resolve.ps1) and is dot-sourced here and in
          # autologin-lab.yml (launch-gates enforces both dot-sources + that the
          # file contains no literal 32-char id). Discovery cascade = store
          # search page -> vendor repo page -> store-indexing SERP -> CWS search
          # page, then the store DETAIL page for that id must carry the
          # canonical slug in its URL and a publisher/title marker. Unresolvable
          # or unverified => skipped LOUDLY (a guessed id could install the
          # wrong extension).
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\edge-ext-resolve.ps1')
          $ubo = Resolve-StoreExtId -Query 'uBlock Origin' -Slug 'ublock-origin' `
              -Markers @('gorhill', 'uBlock Origin') `
              -VendorPages @('https://raw.githubusercontent.com/gorhill/uBlock/master/README.md')
          $dr  = Resolve-StoreExtId -Query 'Dark Reader' -Slug 'dark-reader' `
              -Markers @('darkreader.org', 'Dark Reader') `
              -VendorPages @('https://raw.githubusercontent.com/darkreader/darkreader/main/README.md')
          $uboId = if ($ubo) { $ubo.id } else { '' }
          $drId  = if ($dr)  { $dr.id }  else { '' }
          $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $edgePol -Force -ErrorAction SilentlyContinue | Out-Null
          $extPath = Join-Path $edgePol 'ExtensionInstallForcelist'
          New-Item -Path $extPath -Force -ErrorAction SilentlyContinue | Out-Null
          $extN = 0
          if ($ubo) { $extN++; Set-ItemProperty -Path $extPath -Name ([string]$extN) -Value (Get-ExtForceListValue -Resolved $ubo) -ErrorAction SilentlyContinue }
          if ($dr)  { $extN++; Set-ItemProperty -Path $extPath -Name ([string]$extN) -Value (Get-ExtForceListValue -Resolved $dr) -ErrorAction SilentlyContinue }
          Write-Host ('[edge] forced extensions written: ' + $extN + ' of 2 (uBlock Origin + Dark Reader, live-resolved at build time)')
          $reqChildren = @()
          foreach ($b in $reqBookmarks) { $reqChildren += @{ name = [string]$b.name; url = [string]$b.url } }
          $sessChildren = @()
          foreach ($b in $sessionBookmarks) { $sessChildren += @{ name = [string]$b.name; url = [string]$b.url } }
          $favsJson = ConvertTo-Json -InputObject @(
              @{ toplevel_name = 'Essential'; children = $reqChildren },
              @{ toplevel_name = 'GHRDP Session'; children = $sessChildren }
          ) -Depth 6 -Compress
          foreach ($polPath in @('HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge')) {
              try {
                  New-Item -Path $polPath -Force -ErrorAction SilentlyContinue | Out-Null
                  Set-ItemProperty -Path $polPath -Name 'ManagedFavorites' -Value $favsJson -ErrorAction Stop
                  Write-Host ('[edge] ManagedFavorites set at ' + $polPath)
              } catch {
                  Write-Host ('[edge] ManagedFavorites write failed: ' + $polPath + ': ' + $_.Exception.Message)
              }
          }
          $chromePol = 'HKLM:\SOFTWARE\Policies\Google\Chrome'
          New-Item -Path $chromePol -Force -ErrorAction SilentlyContinue | Out-Null
          $chromeExt = Join-Path $chromePol 'ExtensionInstallForcelist'
          New-Item -Path $chromeExt -Force -ErrorAction SilentlyContinue | Out-Null
          # [F10-11 §4.1] Chrome-side entries use the SAME live resolver against
          # the Chrome Web Store (no id is carried in the repo, so the previous
          # authoring-time constants are gone entirely).
          $cwsN = 0
          $cubo = Resolve-StoreExtId -Store 'cws' -Query 'uBlock Origin' -Slug 'ublock-origin' -Markers @('uBlock Origin', 'gorhill')
          $cdr  = Resolve-StoreExtId -Store 'cws' -Query 'Dark Reader' -Slug 'dark-reader' -Markers @('Dark Reader', 'darkreader.org')
          if ($cubo) { $cwsN++; Set-ItemProperty -Path $chromeExt -Name ([string]$cwsN) -Value (Get-ExtForceListValue -Resolved $cubo) -ErrorAction SilentlyContinue } else { Write-Host '::warning::[chrome] uBlock CWS id unresolved live - skipped (never guessed)' }
          if ($cdr)  { $cwsN++; Set-ItemProperty -Path $chromeExt -Name ([string]$cwsN) -Value (Get-ExtForceListValue -Resolved $cdr) -ErrorAction SilentlyContinue } else { Write-Host '::warning::[chrome] Dark Reader CWS id unresolved live - skipped (never guessed)' }
          Write-Host ('[chrome] forced extensions written: ' + $cwsN + ' of 2 (live-resolved from Chrome Web Store pages)')
          $chromeBm = @()
          foreach ($b in $reqBookmarks) { $chromeBm += @{ name = [string]$b.name; url = [string]$b.url } }
          foreach ($b in $sessionBookmarks) { $chromeBm += @{ name = [string]$b.name; url = [string]$b.url } }
          $chromeBmJson = ConvertTo-Json -InputObject @(@{ toplevel_name = 'GHRDP'; children = $chromeBm }) -Depth 6 -Compress
          foreach ($cpol in @('HKLM:\SOFTWARE\Policies\Google\Chrome', 'HKCU:\SOFTWARE\Policies\Google\Chrome')) {
              try {
                  New-Item -Path $cpol -Force -ErrorAction SilentlyContinue | Out-Null
                  Set-ItemProperty -Path $cpol -Name 'ManagedBookmarks' -Value $chromeBmJson -ErrorAction Stop
                  Write-Host ('[chrome] ManagedBookmarks set at ' + $cpol)
              } catch {
                  Write-Host ('[chrome] ManagedBookmarks write failed: ' + $cpol + ': ' + $_.Exception.Message)
              }
          }
          $ff = 'C:\Program Files\Mozilla Firefox'
          if (Test-Path $ff) {
              try {
                  $dist = Join-Path $ff 'distribution'
                  New-Item -ItemType Directory -Path $dist -Force -ErrorAction SilentlyContinue | Out-Null
                  $bm = @()
                  foreach ($b in $allBookmarks) { $bm += @{ URL = [string]$b.url; Title = [string]$b.name; Placement = 'toolbar' } }
                  # [F12-3 §3.2] Firefox force-install: BOTH the extension id
                  # (guid) and the xpi URL are resolved LIVE from the AMO API at
                  # build time (Resolve-AmoAddon in the shared resolver
                  # payloads/edge-ext-resolve.ps1, dot-sourced above). No add-on
                  # id and no download URL is carried in this repo - a store-side
                  # rename can no longer force-install a stale or wrong add-on,
                  # and an unresolvable slug is skipped LOUDLY (never guessed).
                  $ffUbo = Resolve-AmoAddon -Slug 'ublock-origin' -Markers @('uBlock Origin', 'gorhill', 'Raymond Hill')
                  $ffDr  = Resolve-AmoAddon -Slug 'darkreader'  -Markers @('Dark Reader', 'darkreader')
                  $ffExtSettings = [ordered]@{}
                  if ($ffUbo) { $ffExtSettings[[string]$ffUbo.id] = @{ installation_mode = 'force_installed'; install_url = [string]$ffUbo.url } }
                  else { Write-Host '::warning::[firefox] uBlock Origin unresolved live on addons.mozilla.org - skipped (never guessed)' }
                  if ($ffDr) { $ffExtSettings[[string]$ffDr.id] = @{ installation_mode = 'force_installed'; install_url = [string]$ffDr.url } }
                  else { Write-Host '::warning::[firefox] Dark Reader unresolved live on addons.mozilla.org - skipped (never guessed)' }
                  $pol = [ordered]@{ policies = [ordered]@{
                      Bookmarks = $bm
                      ExtensionSettings = $ffExtSettings
                  } }
                  [System.IO.File]::WriteAllText((Join-Path $dist 'policies.json'), (ConvertTo-Json -InputObject $pol -Depth 8), (New-Object System.Text.UTF8Encoding($false)))
                  $okFF = $false
                  $ffRead = 0
                  try {
                      $ffJson = Get-Content -LiteralPath (Join-Path $dist 'policies.json') -Raw | ConvertFrom-Json
                      $okFF = $true
                      try { $ffRead = @($ffJson.policies.ExtensionSettings.PSObject.Properties).Count } catch { $ffRead = 0 }
                  } catch { }
                  Write-Host ('[firefox] policies.json written: forced extensions=' + $ffRead + ' of 2, bookmarks=' + $bm.Count + ' (valid=' + $okFF + ')')
                  if ($ffRead -lt 2) { Write-Host '::warning::[firefox] fewer than 2 extensions in policies.json - check the AMO resolver warnings above' }
              } catch {
                  Write-Host ('[firefox] policies failed: ' + $_.Exception.Message)
              }
          } else {
              Write-Host '[firefox] not installed; skipping'
          }
          # [F12-3 §3.1] POLICY READBACK for the lab's edge://policy and
          # chrome://policy cells: what was written above must be visible in the
          # registry the browsers read. The helper is the SHARED one
          # (payloads/ghrdp-provision-apps.ps1) that autologin-lab.yml cell K
          # dot-sources too - one definition, exercised by the lab. A readback
          # mismatch is a loud warning (the extension pages are the lab check).
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-provision-apps.ps1')
          $edgeBack = Get-ForcedEntryCount $extPath
          $cwsBack  = Get-ForcedEntryCount $chromeExt
          Write-Host ('[policy] readback: Edge ExtensionInstallForcelist=' + $edgeBack + ' (wrote ' + $extN + '); Chrome ExtensionInstallForcelist=' + $cwsBack + ' (wrote ' + $cwsN + ')')
          if ($edgeBack -ne $extN -or $cwsBack -ne $cwsN) { Write-Host '::warning::[policy] forcelist readback mismatch - a browser may not see the policy until gpupdate/relaunch' }
          # [F12-3 §3.1] every written value must have the browser-accepted
          # "<32-char id>;<update url>" shape - a malformed value is ignored by
          # the browser while the registry still looks populated.
          try {
              foreach ($v in @((Get-Item -LiteralPath $extPath -ErrorAction Stop).GetValueNames())) {
                  if ($v -notmatch '^\d+$') { continue }
                  $val = [string](Get-ItemProperty -Path $extPath -Name $v -ErrorAction Stop).$v
                  if (-not (Test-ForcedEntryShape $val)) { Write-Host ('::warning::[policy] Edge forcelist value ' + $v + ' has a non-standard shape (skipped by the browser?)') }
              }
          } catch { Write-Host '::warning::[policy] Edge forcelist shape check failed' }
          try {
              $mfBack = [string](Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -ErrorAction Stop).ManagedFavorites
              $mfNames = @()
              try { $mfNames = @((($mfBack | ConvertFrom-Json) | ForEach-Object { $_.toplevel_name })) } catch { }
              Write-Host ('[policy] readback: Edge ManagedFavorites ' + $mfBack.Length + ' bytes, toplevel=' + ($mfNames -join ','))
          } catch { Write-Host '::warning::[policy] ManagedFavorites readback failed' }
          try {
              Get-Process -Name msedge, firefox, chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Write-Host '[browsers] stopped running browsers so policies reload on next launch'
          } catch { }
          try {
              & gpupdate.exe /force 2>$null | Out-Null
              $LASTEXITCODE = 0
              Write-Host '[browsers] gpupdate /force executed'
          } catch { }
          # [U1 / #7D] P2P client winget block removed. P2P-index software is not part of the native
          # RDP auto-login architecture and its presence widened the runner attack surface.
          Write-Host '[parsec] skipped - new Parsec requires email OTP (token pairing deprecated); RDP with CredSSP-disabled .rdp is the primary path'
          try {
              $vcUrl = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Setup_x64.exe'
              $vcPath = Join-Path $env:RUNNER_TEMP 'VBCABLE_Setup_x64.exe'
              Remove-Item -LiteralPath $vcPath -Force -ErrorAction SilentlyContinue
              & curl.exe -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 -o $vcPath $vcUrl 2>$null
              $code = $LASTEXITCODE
              $LASTEXITCODE = 0
              if (($code -eq 0) -and (Test-Path -LiteralPath $vcPath) -and ((Get-Item -LiteralPath $vcPath).Length -gt 1000000)) {
                  Start-Process -FilePath $vcPath -ArgumentList '/S', '/D' -WindowStyle Hidden
                  Write-Host '[vbcable] setup launched best-effort'
              } else {
                  Write-Host ('[vbcable] download failed (exit=' + $code + '); skipping (optional)')
              }
          } catch {
              Write-Host ('[vbcable] error (optional): ' + $_.Exception.Message)
          }
          exit 0

      - name: Install virtual display driver (headless console session renders forever)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $zip = Join-Path $env:RUNNER_TEMP 'idd.zip'
          & curl.exe -fL --retry 3 --connect-timeout 20 --max-time 180 -o $zip 'https://github.com/ge9/IddSampleDriver/releases/download/v1.0.2/IddSampleDriver.zip' 2>$null
          $LASTEXITCODE = 0
          if (-not (Test-Path $zip)) { Write-Host '[vdd] download failed - webdesk will need an open RDP client (minimized is fine)'; exit 0 }
          $dst = 'C:\ghrdp\idd'
          try { Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force } catch { Write-Host '[vdd] extract failed'; exit 0 }
          $inf = Get-ChildItem -Path $dst -Recurse -Filter '*.inf' | Select-Object -First 1
          if ($inf) {
              & pnputil.exe /add-driver $inf.FullName /install 2>$null | Out-Null
              $LASTEXITCODE = 0
              Write-Host '[vdd] virtual display driver installed: ' + $inf.Name
          } else { Write-Host '[vdd] inf not found in zip' }
          exit 0

      # [remediation #7D] prior tailnet-agent gate step removed - it drove
      # the C2 enroll/client-cmd/agent-status flow whose endpoints are now 404.

      # [F11-5.2 §5.2] qBittorrent as a PLAIN APP (no mirror/index wiring, no
      # autostart, no Web UI enablement). Cache-backed: a previous run's
      # installer in C:\ghrdp\cache\qbittorrent (already on the setup cache
      # path) is reused, otherwise `winget download` seeds it and `winget
      # install` remains the fallback. The Bittorrent-related publish/mirror
      # pipeline stays OFF - launch-gates F11 asserts MIRROR_INPUT is only ever
      # compared to 'true' and that no index bookmark or publish step returns.
      - name: App - qBittorrent (plain app, cached, no mirror wiring)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cache = 'C:\ghrdp\cache\qbittorrent'
          New-Item -ItemType Directory -Path $cache -Force -ErrorAction SilentlyContinue | Out-Null
          $present = $false
          try {
              foreach ($k in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*','HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
                  $hit = Get-ItemProperty $k -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'qBittorrent*' } | Select-Object -First 1
                  if ($hit) { $present = $true; break }
              }
          } catch { }
          if (-not $present) {
              $cached = Get-ChildItem -Path $cache -Filter '*setup*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
              if (-not $cached -and $winget) {
                  Write-Host ('[qbittorrent] winget download -> ' + $cache)
                  & $winget download --id qBittorrent.qBittorrent --exact --accept-package-agreements --accept-source-agreements --disable-interactivity --download-directory $cache 2>&1 | Select-Object -Last 3 | Out-Null
                  $LASTEXITCODE = 0
                  $cached = Get-ChildItem -Path $cache -Filter '*setup*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              }
              if ($cached) {
                  Write-Host ('[qbittorrent] installing from cache: ' + $cached.Name)
                  Start-Process -FilePath $cached.FullName -ArgumentList '/S' -WindowStyle Hidden -Wait
              } elseif ($winget) {
                  Write-Host '[qbittorrent] cache miss - winget install (silent)'
                  & $winget install --id qBittorrent.qBittorrent --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3 | Out-Null
                  $LASTEXITCODE = 0
              } else { Write-Host '[qbittorrent] winget unavailable - skipped (advisory, never fatal)' }
          } else { Write-Host '[qbittorrent] already present on this host' }
          try {
              $exe = Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              Write-Host ('[qbittorrent] present=' + [bool]$exe)
          } catch { }
          # [F12-3 §3.4] DEFAULT HANDLER for .torrent + magnet, via the SHARED
          # helper (payloads/ghrdp-provision-apps.ps1) that autologin-lab.yml
          # cell L dot-sources as well. The ProgId is DISCOVERED from the
          # installed shell registration (never a hardcoded vendor string) and
          # both associations are read back. This wires a file type to the
          # ALREADY-INSTALLED plain app: no download automation, no index, no
          # mirror, no Web UI anywhere in this step.
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-provision-apps.ps1')
          $qbExe = ''
          try { $qbExe = (Get-ChildItem -Path 'C:\Program Files\qBittorrent','C:\Program Files (x86)\qBittorrent' -Filter 'qbittorrent.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName } catch { }
          if (-not $qbExe) { Write-Host '[qbittorrent] exe not found - .torrent/magnet association skipped (advisory)' }
          else {
              $assoc = Set-QbittorrentDefaultHandler -ExePath $qbExe
              Write-Host ('[qbittorrent] association ok=' + $assoc.ok + ' progId=' + $assoc.progId + ' .torrent=' + $assoc.torrent + ' magnet=' + $assoc.magnet + ' error=' + $assoc.error)
              if (-not $assoc.ok) { Write-Host ('::warning::[qbittorrent] association incomplete (' + $assoc.error + ') - advisory, never fatal') }
          }
          exit 0

      # [F11-6 §6] Setup-time report: provisioning minutes from JOB_STARTED_AT,
      # printed as an annotation + summary so the <=6 min target is verifiable
      # without parsing runner logs.
      - name: Setup time report (F11-6)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $start = $null
          try { if ($env:JOB_STARTED_AT) { $start = ([datetime]$env:JOB_STARTED_AT).ToUniversalTime() } } catch { }
          if (-not $start) { Write-Host '[setup] JOB_STARTED_AT missing - report skipped'; exit 0 }
          $mins = [math]::Round(((Get-Date).ToUniversalTime() - $start).TotalMinutes, 2)
          Write-Host ('::notice title=Setup time::provisioning finished in ' + $mins + ' minutes (target <= 6 on a warm cache)')
          if ($env:GITHUB_STEP_SUMMARY) { ('### Setup time: ' + $mins + ' minutes (target <= 6; keep-alive window untouched)') | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          exit 0

      - name: Service Readiness Check (Pre-Keepalive)
        if: ${{ always() && (github.event.inputs.mode == 'rdp') && success() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $S = $env:GITHUB_STEP_SUMMARY
          $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'

          Write-Host "=== Bounded Pre-Keepalive Service Readiness Verification ==="

          # 1. Dashboard API Contract with monotonic elapsed-time deadline
          Write-Host "Verifying Mission Control Dashboard responsiveness..."
          $dashboardReady = $false
          $deadlineSec = 60
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $firstFailure = ""
          $lastClassification = "unknown"
          while ($sw.Elapsed.TotalSeconds -lt $deadlineSec) {
              $remSec = [int][Math]::Max(1, [Math]::Min(5, ($deadlineSec - $sw.Elapsed.TotalSeconds)))
              try {
                  $res = Invoke-WebRequest -Uri "http://localhost:7331/progress" -UseBasicParsing -TimeoutSec $remSec -ErrorAction Stop
                  if ($res.StatusCode -eq 200) {
                      $json = $null
                      try { $json = $res.Content | ConvertFrom-Json } catch { $json = $null }
                      if ($json -and ($json.ok -eq $true -or $json.status -eq "ok") -and ($json.phase -eq "ready" -or $json.phase -eq "running" -or $null -ne $json.progress)) {
                          $dashboardReady = $true
                          $lastClassification = "ready"
                          Write-Host ("Dashboard API responded with valid readiness JSON in {0:F1}s." -f $sw.Elapsed.TotalSeconds)
                          break
                      } else {
                          $lastClassification = "schema_mismatch"
                          if (-not $firstFailure) { $firstFailure = "HTTP 200 with invalid schema/missing readiness fields" }
                      }
                  } else {
                      $lastClassification = "http_" + $res.StatusCode
                      if (-not $firstFailure) { $firstFailure = "HTTP " + $res.StatusCode }
                  }
              } catch {
                  $exMsg = $_.Exception.Message
                  if ($exMsg -match "500") { $lastClassification = "http_500" }
                  elseif ($exMsg -match "404") { $lastClassification = "http_404" }
                  elseif ($exMsg -match "401|403") { $lastClassification = "http_401_403" }
                  elseif ($exMsg -match "refused") { $lastClassification = "connection_refused" }
                  elseif ($exMsg -match "timeout") { $lastClassification = "timeout" }
                  else { $lastClassification = "transport_error" }
                  if (-not $firstFailure) { $firstFailure = $exMsg }
                  Write-Host ("Dashboard API probe ({0:F1}s elapsed, class={1}): {2}" -f $sw.Elapsed.TotalSeconds, $lastClassification, $exMsg)
              }
              $rem = $deadlineSec - $sw.Elapsed.TotalSeconds
              if ($rem -gt 2) { Start-Sleep -Seconds 2 }
          }

          # 2. Tailscale & MagicDNS State
          $tsIp = [string]$env:TS_TAILNET_IP
          $fqdn = [string]$env:TS_MAGICDNS_FQDN
          if (-not $tsIp -and (Test-Path -LiteralPath $tsExe)) {
              try {
                  $j = (& $tsExe status --json 2>$null) | ConvertFrom-Json
                  if ($j -and $j.Self -and $j.Self.TailscaleIPs) {
                      $cgnat = '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.'
                      foreach ($a in @($j.Self.TailscaleIPs)) {
                          if (([string]$a).Trim() -match $cgnat) { $tsIp = ([string]$a).Trim(); break }
                      }
                  }
                  if (-not $fqdn -and $j -and $j.Self -and $j.Self.DNSName) {
                      $candidateDns = ([string]$j.Self.DNSName).TrimEnd('.')
                      if ($candidateDns -match '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
                          $fqdn = $candidateDns
                      }
                  }
              } catch { }
          }
          $tsReady = [bool]($tsIp -match '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.')

          # 3. RDP Listener Readiness (Port 3389)
          $rdpReady = $false
          try {
              $rdpConn = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
              if ($rdpConn) { $rdpReady = $true }
          } catch { }

          # 4. Web Desktop Readiness (Port 7333 / 5900 if present)
          $webdeskReady = $false
          try {
              $wdConn = Get-NetTCPConnection -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue
              if ($wdConn) { $webdeskReady = $true }
          } catch { }

          Write-Host ("- Dashboard API Ready: " + $dashboardReady)
          Write-Host ("- Tailscale IP Ready: " + $tsReady + " ($tsIp)")
          Write-Host ("- MagicDNS FQDN: " + $fqdn)
          Write-Host ("- RDP Listener (3389) Ready: " + $rdpReady)
          Write-Host ("- Web Desktop (7333) Listening: " + $webdeskReady)

          if (-not $dashboardReady) {
              $msg = "Dashboard service failed to respond on http://localhost:7331/progress within 60s."
              Write-Host "::error::$msg"
              if ($S) {
                  "### ❌ Service Readiness Verification Failed" | Add-Content -LiteralPath $S -Encoding utf8
                  "Mission Control Dashboard endpoint එක ප්‍රතිචාර නොදක්වයි (`http://localhost:7331`)." | Add-Content -LiteralPath $S -Encoding utf8
              }
              throw "SERVICE_READINESS_FAILED: $msg"
          }

          if (-not $tsReady) {
              $msg = "Tailscale network interface failed to assign a valid CGNAT tailnet IP."
              Write-Host "::error::$msg"
              if ($S) {
                  "### ❌ Service Readiness Verification Failed" | Add-Content -LiteralPath $S -Encoding utf8
                  "Tailscale ජාල මුහුණතට වලංගු IP ලිපිනයක් ලැබී නොමැත." | Add-Content -LiteralPath $S -Encoding utf8
              }
              throw "SERVICE_READINESS_FAILED: $msg"
          }

          if (-not $rdpReady) {
              $msg = "RDP Listener on TCP port 3389 is not listening."
              Write-Host "::error::$msg"
              if ($S) {
                  "### ❌ Service Readiness Verification Failed" | Add-Content -LiteralPath $S -Encoding utf8
                  "RDP සේවාව Port 3389 මත සක්‍රීය වී නොමැත." | Add-Content -LiteralPath $S -Encoding utf8
              }
              throw "SERVICE_READINESS_FAILED: $msg"
          }

          # Usable, secret-free access instructions printed before keepalive begins
          Write-Host "============================================================="
          Write-Host "  RDP & MISSION CONTROL ACCESS ENDPOINTS (SERVICES READY)"
          Write-Host "  Tailscale IP Endpoint : http://$tsIp`:7331/"
          if ($fqdn) { Write-Host "  MagicDNS FQDN Endpoint: http://$fqdn`:7331/" }
          Write-Host "  RDP Command           : mstsc /v:$tsIp"
          Write-Host "  Status                : SERVICES_READY / CLIENT_CONNECTION_NOT_VERIFIED"
          Write-Host "============================================================="

          if ($S) {
              '### 🚀 RDP & Mission Control Session Ready' | Add-Content -LiteralPath $S -Encoding utf8
              'සියලුම අත්‍යවශ්‍ය සේවාවන් සාර්ථකව ආරම්භ වී සක්‍රීය තත්වයේ පවතී.' | Add-Content -LiteralPath $S -Encoding utf8
              '' | Add-Content -LiteralPath $S -Encoding utf8
              '**ලබාගත හැකි ස්ථාන (Endpoints):**' | Add-Content -LiteralPath $S -Encoding utf8
              ('- Mission Control Dashboard (Tailnet IP): `http://{0}:7331/`' -f $tsIp) | Add-Content -LiteralPath $S -Encoding utf8
              if ($fqdn) { ('- Mission Control Dashboard (MagicDNS): `http://{0}:7331/`' -f $fqdn) | Add-Content -LiteralPath $S -Encoding utf8 }
              ('- Direct RDP Command: `mstsc /v:{0}`' -f $tsIp) | Add-Content -LiteralPath $S -Encoding utf8
              '' | Add-Content -LiteralPath $S -Encoding utf8
              '**Verification State:** `SERVICES_READY / CLIENT_CONNECTION_NOT_VERIFIED`' | Add-Content -LiteralPath $S -Encoding utf8
              '*සටහන: මුරපද හෝ සත්‍යාපන ටෝකන Log හෝ Step Summary තුළ කිසිවිටෙකත් ප්‍රකාශයට පත් නොකෙරේ.*' | Add-Content -LiteralPath $S -Encoding utf8
          }

      - name: Keep-alive 5h30 (60s heartbeat, rust probe, auto-restart, banners)
        if: ${{ success() && (github.event.inputs.mode == 'rdp') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try { [Console]::OutputEncoding = [System.Text.Encoding]::UTF8 } catch { }
          $root = 'C:\ghrdp'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $cfgPath = Join-Path $root 'config.json'
          $progPath = Join-Path $root 'progress.json'
          $idxPath = Join-Path $root 'mirror-index.json'
          $summary = $env:GITHUB_STEP_SUMMARY
          $runUrl = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID
          $cancelCli = 'gh run cancel ' + $env:GITHUB_RUN_ID + ' -R ' + $env:GITHUB_REPOSITORY
          $jobStart = (Get-Date)
          try { if ($env:JOB_STARTED_AT) { $jobStart = [datetime]$env:JOB_STARTED_AT } } catch { }
          $hardCap = $jobStart.AddMinutes(352)
          $idleCap = $jobStart.AddMinutes(350)
          $sessionWindowMinutes = 330
          $deadline = $idleCap
          # [F9k-guard] cascade guard: ghrdp-lib.ps1 is staged by an EARLIER step.
          # If it is absent, that earlier step halted this run - this step is the
          # cascade, not the cause. Read the FIRST failed step above.
          $lib = Join-Path $root 'ghrdp-lib.ps1'
          if (-not (Test-Path -LiteralPath $lib)) {
              Write-Host '::error::ghrdp-lib.ps1 missing - an EARLIER step halted this run. Read the FIRST failed step above; this step is a cascade, not the cause.'
              if ($env:GITHUB_STEP_SUMMARY) { '### Upstream halt: lib never staged - fix the first failed step.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              exit 1
          }
          . (Join-Path $root 'ghrdp-lib.ps1')
          $cfgKa = Read-MirrorCfg -Path $cfgPath
          if ($cfgKa -and -not [string]$cfgKa.rdpIp) {
              $ipBack = ''
              for ($bt = 1; $bt -le 10; $bt++) {
                  try { $ipBack = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim(); $LASTEXITCODE = 0 } catch { $ipBack = '' }
                  if ($ipBack) { break }
                  Start-Sleep -Seconds 3
              }
              if ($ipBack) { $cfgKa.rdpIp = $ipBack; Save-MirrorCfg -Cfg $cfgKa -Path $cfgPath; Write-Host ('[keepalive] backfilled rdpIp=' + $ipBack) }
          }
          if ($cfgKa) { $cfgKa | Add-Member -NotePropertyName keepAliveDeadline -NotePropertyValue ($deadline.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')) -Force; $cfgKa | Add-Member -NotePropertyName keepAlivePhase -NotePropertyValue 'idle-wait' -Force; Save-MirrorCfg -Cfg $cfgKa -Path $cfgPath }
          $beat = 0
          $lastBannerBeat = -10
          $lastWatchNudge = (Get-Date).AddMinutes(-10)
          $lastTsFix = (Get-Date).AddMinutes(-10)
          $lastRdpFix = (Get-Date).AddMinutes(-10)
          $lastPsFix = (Get-Date).AddMinutes(-10)
          $lastRustFix = (Get-Date).AddMinutes(-10)
          $lastStaleFix = (Get-Date).AddMinutes(-10)
          $lastWebDeskFix = (Get-Date).AddMinutes(-10)
          $lastWebRtcFix = (Get-Date).AddMinutes(-10)
          # Resolve the WebRTC exe name from the task definition instead of assuming
          # webrtc-server.exe, so a renamed binary still heals correctly (graveyard #30).
          $webRtcExeName = 'webrtc-server.exe'
          try {
              $wt = Get-ScheduledTask -TaskName 'GhrdpWebRTC' -ErrorAction SilentlyContinue
              if ($wt -and $wt.Actions -and $wt.Actions[0].Execute) {
                  $webRtcExeName = Split-Path -Leaf ([string]$wt.Actions[0].Execute)
              }
          } catch { }
          Write-Host ('[keepalive] WebRTC exe name from task definition: ' + $webRtcExeName)
          $webRtcFilter = "Name='" + $webRtcExeName + "'"
          $lastVncFix = (Get-Date).AddMinutes(-10)
          $lastDirectTry = (Get-Date).AddMinutes(-10)
          $icons = [ordered]@{
              rocket = [char]::ConvertFromUtf32(0x1F680)
              screen = [char]::ConvertFromUtf32(0x1F5A5)
              link = [char]::ConvertFromUtf32(0x1F517)
              folder = [char]::ConvertFromUtf32(0x1F4C1)
              siren = [char]::ConvertFromUtf32(0x1F6A8)
              hourglass = [char]::ConvertFromUtf32(0x23F3)
              check = [char]::ConvertFromUtf32(0x2705)
              warn = [char]::ConvertFromUtf32(0x26A0)
              wrench = [char]::ConvertFromUtf32(0x1F527)
          }
          $rustExe = Join-Path $root 'rust\ghrdp-dash.exe'
          $rustAdvertise = ($env:RUST_AVAILABLE -eq 'true')
          $rustUrl = [string]$env:RUST_URL
          $rustProbeOn = $true
          $rustMissingLogged = $false
          $script:rustLast = 'OFF'
          if (-not $rustAdvertise) { $rustProbeOn = $false }
          function Read-GhrdpJson {
              param([string]$Path)
              for ($a = 1; $a -le 3; $a++) {
                  try {
                      if (-not (Test-Path -LiteralPath $Path)) { return $null }
                      $fs = [System.IO.File]::Open($Path, 'Open', 'Read', 'ReadWrite')
                      $ms = New-Object System.IO.MemoryStream
                      $fs.CopyTo($ms)
                      $fs.Dispose()
                      $b = $ms.ToArray()
                      $ms.Dispose()
                      if ($b.Length -eq 0) { return $null }
                      if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }
                      return (([System.Text.Encoding]::UTF8.GetString($b)).TrimStart([char]0xFEFF) | ConvertFrom-Json)
                  } catch { Start-Sleep -Milliseconds 150 }
              }
              return $null
          }
          function Test-PortListen {
              param([int]$PortNum)
              try { return [bool](Get-NetTCPConnection -LocalPort $PortNum -State Listen -ErrorAction SilentlyContinue) } catch { return $false }
          }
          function Test-TsRunning {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json
                  $LASTEXITCODE = 0
                  if ($j -and ($j.BackendState -eq 'Running')) { return $true }
              } catch { }
              return $false
          }
          function Test-DashHttp {
              try {
                  $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7331/progress' -UseBasicParsing -TimeoutSec 6 -ErrorAction Stop
                  if ($r.StatusCode -eq 200) { return $true }
              } catch { }
              return $false
          }
          function Test-RustTcp {
              $client = $null
              try {
                  $client = New-Object System.Net.Sockets.TcpClient
                  $iar = $client.BeginConnect('127.0.0.1', 7332, $null, $null)
                  $done = $iar.AsyncWaitHandle.WaitOne(1500)
                  if ($done -and $client.Connected) {
                      $client.EndConnect($iar) | Out-Null
                      return $true
                  }
                  return $false
              } catch {
                  return $false
              } finally {
                  if ($client) { $client.Dispose() }
              }
          }
          function Get-Remaining {
              $span = $deadline - (Get-Date)
              if ($span.TotalSeconds -lt 0) { $span = New-TimeSpan -Seconds 0 }
              return ('{0:00}:{1:00}:{2:00}' -f [int][math]::Floor($span.TotalHours), $span.Minutes, $span.Seconds)
          }
          function Get-SpeedStr {
              param([long]$Bps)
              if ($Bps -ge 1048576) { return ('{0:N1} MB/s' -f ($Bps / 1048576.0)) }
              if ($Bps -ge 1024) { return ('{0:N1} KB/s' -f ($Bps / 1024.0)) }
              return ([string]$Bps + ' B/s')
          }
          function Get-Last5Links {
              $idx = Read-GhrdpJson -Path $idxPath
              $out = @()
              if ($idx) {
                  $items = @($idx)
                  if ($items.Count -gt 0) {
                      $start = [math]::Max(0, $items.Count - 5)
                      for ($i = $start; $i -lt $items.Count; $i++) {
                          $it = $items[$i]
                          if ($it -and $it.link) { $out += ('{0} -> {1}' -f [string]$it.name, [string]$it.link) }
                      }
                  }
              }
              return @($out)
          }

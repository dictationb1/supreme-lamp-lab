          # [F24 §2 collector-begin] AUTH-FAILURE EVIDENCE COLLECTOR (secret-free).
          # Every keep-alive tick (60s) reads the runner's OWN Security log for
          # 4624/4625 and records ONLY counts + Status/SubStatus/FailureReason
          # codes into config.json -> rdpListener.authEvents. It NEVER records a
          # password, a domain, or an address. F27 permits TargetUserName on failures; the dashboard's
          # discriminator needs the status code (4625 0xC000006A/0xC000006D =>
          # wrong password; 0xC000015B => logon type denied) and nothing else.
          # Extracted VERBATIM by autologin-lab cell U and driven with synthetic
          # events - the parse path is proven without a live Security log.
          $script:F24WindowSec = 3600
          $script:F24LastVerdict = ''
          function Get-RdpAuthEventFields {
              param([xml]$Xml)
              $id = ''
              $t = ''
              $name = @{}
              try { $id = [string]($Xml.SelectSingleNode("//*[local-name()='EventID']")).InnerText } catch { }
              try { $t = [string]($Xml.SelectSingleNode("//*[local-name()='TimeCreated']").GetAttribute('SystemTime')) } catch { }
              try {
                  foreach ($d in @($Xml.SelectNodes("//*[local-name()='Data']"))) {
                      $n = [string]$d.GetAttribute('Name')
                      if ($n) { $name[$n] = [string]$d.InnerText }
                  }
              } catch { }
              return [pscustomobject]@{
                  id        = $id.Trim()
                  timeUtc   = $t
                  status    = ([string]$name['Status']).Trim().ToUpperInvariant()
                  subStatus = ([string]$name['SubStatus']).Trim().ToUpperInvariant()
                  reason    = ([string]$name['FailureReason']).Trim()
                  logonType = ([string]$name['LogonType']).Trim()
                  targetUserName = ([string]$name['TargetUserName']).Trim()
              }
          }
          function Get-RdpAuthCodeMeaning {
              param([string]$Code)
              switch (([string]$Code).Trim().ToUpperInvariant()) {
                  '0XC000006A' { return 'wrong-password' }
                  '0XC000006D' { return 'bad-user-or-password' }
                  '0XC0000064' { return 'no-such-user' }
                  '0XC000015B' { return 'logon-type-denied' }
                  '0XC0000234' { return 'account-locked' }
                  '0XC0000072' { return 'account-disabled' }
                  '0XC000006E' { return 'account-restriction' }
                  '0XC000006F' { return 'time-restriction' }
                  '0XC0000070' { return 'workstation-restriction' }
                  '0XC0000071' { return 'credential-expired' }
                  default { if ($Code) { return 'other' } return '' }
              }
          }
          function Get-RdpAuthEventSummary {
              param($Items, [int]$WindowSec = 3600, [string]$ProbeError = '')
              $c4624 = 0; $c4625 = 0; $last4625 = ''; $last4624 = ''; $lastSub = ''
              $failures = @()
              $codes = [ordered]@{}
              foreach ($it in @($Items | Sort-Object timeUtc)) {
                  if (-not $it) { continue }
                  if ([string]$it.id -eq '4624') {
                      if ([string]$it.logonType -eq '10') { $c4624++; $last4624 = [string]$it.timeUtc }
                      continue
                  }
                  if ([string]$it.id -ne '4625') { continue }
                  $c4625++
                  if ([string]$it.timeUtc) { $last4625 = [string]$it.timeUtc; $lastSub = [string]$it.subStatus }
                  # F27 allowlist: no raw XML, subject/domain/address or credential data.
                  $failures += [pscustomobject]@{ ts = [string]$it.timeUtc; failureReason = [string]$it.reason; subStatus = [string]$it.subStatus; targetUserName = [string]$it.targetUserName }
                  foreach ($c in @([string]$it.status, [string]$it.subStatus)) {
                      if (-not $c) { continue }
                      if (-not $codes.Contains($c)) { $codes[$c] = 0 }
                      $codes[$c] = [int]$codes[$c] + 1
                  }
              }
              $codeList = @()
              foreach ($k in @($codes.Keys)) {
                  $codeList += [pscustomobject]@{ code = [string]$k; count = [int]$codes[$k]; meaning = (Get-RdpAuthCodeMeaning -Code ([string]$k)) }
              }
              $meanings = @($codeList | ForEach-Object { [string]$_.meaning })
              $verdict = 'none'
              if ($c4625 -gt 0) {
                  if (($meanings -contains 'wrong-password') -or ($meanings -contains 'bad-user-or-password')) { $verdict = 'credential-mismatch' }
                  elseif ($meanings -contains 'no-such-user') { $verdict = 'no-such-user' }
                  elseif ($meanings -contains 'logon-type-denied') { $verdict = 'logon-type-denied' }
                  else { $verdict = 'unclassified' }
              }
              return [pscustomobject]@{
                  ts         = (Get-Date).ToUniversalTime().ToString('o')
                  windowSec  = $WindowSec
                  count4624  = $c4624
                  count4625  = $c4625
                  codes      = $codeList
                  last4625At = $last4625
                  last4624At = $last4624
                  lastSubStatus = $lastSub
                  failures = @($failures | Select-Object -Last 40)
                  verdict    = $verdict
                  probeError = $ProbeError
              }
          }
          function Update-RdpAuthEvents {
              param([string]$CfgPath)
              $items = @()
              $probeErr = ''
              try {
                  $since = (Get-Date).ToUniversalTime().AddSeconds(-1 * $script:F24WindowSec)
                  $raw = @(Get-WinEvent -FilterHashtable @{ LogName = 'Security'; Id = @(4624, 4625); StartTime = $since } -MaxEvents 400 -ErrorAction Stop)
                  foreach ($e in $raw) { $items += (Get-RdpAuthEventFields -Xml ([xml]$e.ToXml())) }
              } catch { $probeErr = 'security-log-unreadable' }
              $sum = Get-RdpAuthEventSummary -Items $items -WindowSec $script:F24WindowSec -ProbeError $probeErr
              try {
                  if ($CfgPath -and (Test-Path -LiteralPath $CfgPath)) {
                      $cfgA = [System.IO.File]::ReadAllText($CfgPath) | ConvertFrom-Json
                      $rdpL = $null
                      if ($cfgA.PSObject.Properties['rdpListener']) { $rdpL = $cfgA.rdpListener } else { $rdpL = [pscustomobject]@{} }
                      $rdpL | Add-Member -NotePropertyName authEvents -NotePropertyValue $sum -Force
                      $cfgA | Add-Member -NotePropertyName rdpListener -NotePropertyValue $rdpL -Force
                      [System.IO.File]::WriteAllText($CfgPath, ($cfgA | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
                  }
              } catch {
                  Write-Host ('[F24] authEvents config write failed: ' + $_.Exception.Message)
              }
              # [F37 §4] TELESCOPE ON THE SAME 60s KEEP-ALIVE TICK: the RUNNER
              # observes its own listener face and stamps the derived bind facts
              # onto config.json -> rdpListener.telescope, so the SERVER CONN LOG
              # row shows boundThumb vs servedThumb LIVE (a bind drift is visible
              # instantly, not at the next dispatch). The module is the single
              # source of truth; everything here is contained - a missing module
              # or a dead probe stamps an explanatory line, never an exception.
              try {
                  $f37Mod = Join-Path 'C:\ghrdp' 'rdp-telescope.ps1'
                  if (-not (Test-Path -LiteralPath $f37Mod)) { $f37Mod = Join-Path $env:GITHUB_WORKSPACE 'payloads/rdp-telescope.ps1' }
                  if (Test-Path -LiteralPath $f37Mod) {
                      . $f37Mod
                      $f37Fqdn = ''
                      try { $f37Fqdn = [string]$cfgA.dnsName } catch { }
                      $f37Tel = Invoke-RdpTelescope -Fqdn $f37Fqdn -Src 'keepalive' -Local -Ip '127.0.0.1' -SkipLogon -SkipCred
                      $f37F = Get-RdpTelescopeFields -Telescope $f37Tel
                      $f37Stamp = [ordered]@{
                          ts = (Get-Date).ToUniversalTime().ToString('o')
                          src = 'keepalive'
                          trace = [string]$f37F.trace
                          deathPoint = [string]$f37F.deathPoint
                          boundThumb = [string]$f37F.boundThumb
                          servedThumb = [string]$f37F.servedThumb
                          serving = [bool]$f37F.serving
                          bindDrift = [bool]$f37F.bindDrift
                          aclRead = [bool]$f37F.aclRead
                          aclSids = @($f37F.aclSids)
                          aclReadMethod = [string]$f37F.aclReadMethod
                          aclModule = [string]$f37F.aclModule
                          container = [string]$f37F.container
                          schannelTail = @($f37F.schannelTail)
                          schannelWhy = [string]$f37F.schannelWhy
                          aclOk = [bool]$f37F.aclOk
                          inStore = [bool]$f37F.inStore
                          hasKey = [bool]$f37F.hasKey
                          hasServerAuth = [bool]$f37F.hasServerAuth
                          eku = @($f37F.eku)
                          san = @($f37F.san)
                          keyFileFound = [bool]$f37F.keyFileFound
                          containerKind = [string]$f37F.containerKind
                          containerPath = [string]$f37F.containerPath
                          keyFilePathSource = [string]$f37F.keyFilePathSource
                          keyDirHits = @($f37F.keyDirHits)
                          keyDirSample = @($f37F.keyDirSample)
                          keyTypedError = [string]$f37F.keyTypedError
                          typesLoader = [string]$f37F.typesLoader
                          protocol = [string]$f37F.protocol
                          cipher = [string]$f37F.cipher
                          failureAt = [string]$f37F.failureAt
                          tlsWhy = [string]$f37F.tlsWhy
                          listenerWhy = [string]$f37F.listenerWhy
                          redStages = @($f37F.redStages)
                          fatalStages = @($f37F.fatalStages)
                          deriveError = [string]$f37F.deriveError
                          credScope = 'client-only'
                          lines = @($f37Tel.lines)
                      }
                      $cfgT = [System.IO.File]::ReadAllText($CfgPath) | ConvertFrom-Json
                      $rlT = $(if ($cfgT.PSObject.Properties['rdpListener'] -and $cfgT.rdpListener) { $cfgT.rdpListener } else { New-Object psobject })
                      $rlT | Add-Member -NotePropertyName telescope -NotePropertyValue $f37Stamp -Force
                      $cfgT | Add-Member -NotePropertyName rdpListener -NotePropertyValue $rlT -Force
                      [System.IO.File]::WriteAllText($CfgPath, ($cfgT | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
                      $f37S = $env:GITHUB_STEP_SUMMARY
                      Write-Host ('[F37] keep-alive telescope: deathPoint=' + $f37F.deathPoint + ' bound=' + $f37F.boundThumb + ' served=' + $f37F.servedThumb + ' aclRead=' + $f37F.aclRead + ' aclReadMethod=' + [string]$f37F.aclReadMethod + ' aclModule=' + [string]$f37F.aclModule + ' drift=' + $f37F.bindDrift + ' fatal=[' + (@($f37F.fatalStages) -join ',') + '] red=[' + (@($f37F.redStages) -join ',') + ']' + $(if ([string]$f37F.deriveError) { ' deriveError=' + [string]$f37F.deriveError } else { '' }))
                      if ($f37S -and ($f37F.bindDrift -or $f37F.deathPoint -ne 'none')) {
                          # A red telescope prints ITSELF into the summary, first
                          # occurrence only (the tick runs every 60s).
                          if (-not $script:F37KeptAlivePrinted) {
                              $script:F37KeptAlivePrinted = $true
                              Write-RdpTelescopeSummary -Telescope $f37Tel -Title 'F37 keep-alive telescope (bind drift / death point)' -SummaryPath $f37S | Out-Null
                          }
                      }
                  } else {
                      Write-Host ('[F37] keep-alive telescope skipped: rdp-telescope.ps1 not found in C:\ghrdp or the workspace')
                  }
              } catch {
                  Write-Host ('[F37] keep-alive telescope failed: ' + $_.Exception.Message)
              }
              $codeTxt = (@($sum.codes | ForEach-Object { [string]$_.code + ':' + [string]$_.count }) -join ',')
              Write-Host ('[F24] authEvents: 4624=' + $sum.count4624 + ' 4625=' + $sum.count4625 + ' verdict=' + $sum.verdict + ' codes=[' + $codeTxt + ']' + $(if ($sum.probeError) { ' probeError=' + $sum.probeError } else { '' }))
              # Step summary only when the picture CHANGES (never once per tick).
              if ($sum.verdict -ne $script:F24LastVerdict) {
                  $script:F24LastVerdict = $sum.verdict
                  $f24S = $env:GITHUB_STEP_SUMMARY
                  if ($f24S) {
                      ('### F24 auth events (Security log, window ' + [int]($sum.windowSec / 60) + ' min): verdict=' + $sum.verdict) | Add-Content -Path $f24S
                      ('- 4624=' + $sum.count4624 + ' 4625=' + $sum.count4625 + ' codes=[' + $codeTxt + ']' + $(if ($sum.probeError) { ' probeError=' + $sum.probeError } else { '' })) | Add-Content -Path $f24S
                  }
              }
              return $sum
          }
          # [F24 §2 collector-end] (marker last: the lab cell extracts the
          # COMPLETE collector verbatim)
          # [F30 §3 keepalive-begin] SERVER CONN-LOG MIRROR. The server process
          # samples BOTH RDP Operational logs on its own 30s tick (that is the only
          # surface that can see a TLS/CredSSP-layer drop: 4624/4625 never fire for
          # a connection killed before LSA). This step mirrors the newest sample
          # into config.json rdpListener.connLog - so the field the F30 spec names
          # exists in the config too - and prints the newest 3 reason codes to the
          # run log. Read-only for the state file the server owns.
          function Update-ConnLogMirror {
              param([string]$CfgPath, [string]$StatePath)
              if (-not (Test-Path -LiteralPath $StatePath)) { return $null }
              $raw = ''
              try { $raw = [System.IO.File]::ReadAllText($StatePath) } catch { return $null }
              if (-not $raw) { return $null }
              $state = $null
              try { $state = $raw | ConvertFrom-Json } catch { return $null }
              if (-not $state) { return $null }
              $cfg = Read-GhrdpJson -Path $CfgPath
              if (-not $cfg) { return $state }
              $rl = $null
              if ($cfg.PSObject.Properties['rdpListener'] -and $cfg.rdpListener) { $rl = $cfg.rdpListener } else { $rl = New-Object psobject }
              $rl | Add-Member -NotePropertyName connLog -NotePropertyValue $state -Force
              $cfg | Add-Member -NotePropertyName rdpListener -NotePropertyValue $rl -Force
              try { [System.IO.File]::WriteAllText($CfgPath, ($cfg | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false))) } catch { }
              return $state
          }
          # [F30 §3 keepalive-end]
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 60
              $beat++
              # [F24 §2] 60s auth-event tick: counts + status codes only.
              try { Update-RdpAuthEvents -CfgPath $cfgPath | Out-Null } catch { Write-Host ('[F24] collector tick failed: ' + $_.Exception.Message) }
              # [F30 §3] mirror the server's 30s conn-log sample into config.json
              # rdpListener.connLog and print the newest 3 reason codes: a
              # tls-forcibly-closed / tls-handshake-failed / cert-rejected reason
              # here is the pre-logon TLS drop the Security log cannot show.
              try {
                  $cl = Update-ConnLogMirror -CfgPath $cfgPath -StatePath (Join-Path $root 'rdp-connlog.json')
                  if ($cl) {
                      $clTxt = ''
                      if ($cl.items -and @($cl.items).Count -gt 0) { $clTxt = (@($cl.items | Select-Object -First 3 | ForEach-Object { ('#' + [string]$_.id + ' ' + [string]$_.reason) }) -join ' ') }
                      Write-Host ('[F30] SERVER CONN LOG: ' + $(if ($clTxt) { $clTxt } else { 'no events yet' }) + ' probeError=' + [string]$cl.probeError)
                  }
              } catch { Write-Host ('[F30] conn-log mirror tick failed: ' + $_.Exception.Message) }
              $stamp = Get-Date -Format 'HH:mm:ss'
              $cfgNow = Read-GhrdpJson -Path $cfgPath
              $ipNow = ''
              if ($cfgNow) { $ipNow = [string]$cfgNow.rdpIp }
              $ssa = $null
              try { if ($cfgNow -and $cfgNow.sessionStartedAt) { $ssa = [datetime]$cfgNow.sessionStartedAt } } catch { }
              if ($ssa) { $sessEnd = $ssa.AddMinutes($sessionWindowMinutes); if ($sessEnd -gt $hardCap) { $sessEnd = $hardCap }; $deadline = $sessEnd; $phaseNow = 'active' } else { $deadline = $idleCap; $phaseNow = 'idle-wait' }
              try {
                if ($cfgNow) {
                  $cfgNow | Add-Member -NotePropertyName keepAliveDeadline -NotePropertyValue ($deadline.ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')) -Force
                  $cfgNow | Add-Member -NotePropertyName keepAlivePhase -NotePropertyValue $phaseNow -Force
                  [System.IO.File]::WriteAllText($cfgPath, ($cfgNow | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
                }
              } catch { }
              $tsOk = Test-TsRunning
              if (-not $tsOk) {
                  if (((Get-Date) - $lastTsFix).TotalMinutes -ge 2) {
                      $lastTsFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' Tailscale NOT connected - restarting the Tailscale service')
                      try { Start-Service -Name Tailscale -ErrorAction Stop } catch { Write-Host ('   restart failed: ' + $_.Exception.Message) }
                      Start-Sleep -Seconds 8
                      $tsOk = Test-TsRunning
                      if ($tsOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' Tailscale is Running again') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' Tailscale - will retry later') }
                  }
              }
              $rdpOk = Test-PortListen -PortNum 3389
              if (-not $rdpOk) {
                  if (((Get-Date) - $lastRdpFix).TotalMinutes -ge 2) {
                      $lastRdpFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' port 3389 NOT listening - restarting TermService')
                      try { Restart-Service -Name TermService -Force -ErrorAction Stop } catch { Write-Host ('   TermService restart failed: ' + $_.Exception.Message) }
                      Start-Sleep -Seconds 8
                      $rdpOk = Test-PortListen -PortNum 3389
                      if ($rdpOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' RDP listener is back on 3389') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' RDP - will retry later') }
                  }
              }
              $psOk = Test-DashHttp
              # [F34-4] Quiet skip when the payload is not on disk: until 'Write deploy
              # payloads' lands C:\ghrdp\ghrdp-server.ps1 (and on any run where it was
              # removed) the restart was doomed - Start-ScheduledTask threw and the tick
              # printed a wrench line every 2 minutes that read like a fresh incident.
              # No file = nothing to heal, so say that once and do not attempt it.
              $psSkipped = $false
              if (-not $psOk -and -not (Test-Path -LiteralPath 'C:\ghrdp\ghrdp-server.ps1')) {
                  $psSkipped = $true
                  Write-Host ($icons.hourglass + ' ' + $stamp + ' ghrdp-server.ps1 not on disk - dashboard restart skipped (nothing to heal yet)')
              }
              if (-not $psOk -and -not $psSkipped) {
                  if (((Get-Date) - $lastPsFix).TotalMinutes -ge 2) {
                      $lastPsFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' PowerShell dashboard not responding on 7331 - restarting GhrdpServer')
                      try {
                          Start-ScheduledTask -TaskName 'GhrdpServer' -ErrorAction Stop
                      } catch {
                          Write-Host ('   task start failed: ' + $_.Exception.Message + ' - launching background process')
                          try {
                              $pwshPath2 = 'powershell.exe'
                              $c2 = Get-Command pwsh.exe -ErrorAction SilentlyContinue
                              if ($c2) { $pwshPath2 = $c2.Source }
                              Start-Process -FilePath $pwshPath2 -ArgumentList '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-server.ps1"' -WindowStyle Hidden
                          } catch { Write-Host ('   background launch failed: ' + $_.Exception.Message) }
                      }
                      Start-Sleep -Seconds 8
                      $psOk = Test-DashHttp
                      if ($psOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' PowerShell dashboard is responding again') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' PS dashboard 7331') }
                  }
              }
              $vncOk = $false; $brOk = $false
              try { $vncOk = [bool](Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue) } catch { }
              try { $brOk = [bool](Get-NetTCPConnection -LocalPort 7333 -State Listen -ErrorAction SilentlyContinue) } catch { }
              if ((-not $vncOk -or -not $brOk) -and (((Get-Date) - $lastVncFix).TotalMinutes -ge 2)) {
                  $lastVncFix = Get-Date
                  Write-Host ($icons.wrench + ' ' + $stamp + ' web desktop backend down (vnc=' + $vncOk + ' bridge=' + $brOk + ') - restarting')
                  if (-not $vncOk) { try { Start-Service -Name tvnserver -ErrorAction Stop } catch { } }
                  # [F9n] tailnet-IP bind (serve retired): the bridge must listen on
                  # the tailnet address the advertised webdeskUrl points at. A loopback
                  # rebind would be unreachable AND would hide the outage from the
                  # dashboard, so an invalid/missing tailnet IP skips the heal.
                  if (-not $brOk) {
                      try {
                          if ($ipNow -match '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') {
                              Start-Process -FilePath python -ArgumentList '-m','websockify','--web','C:\ghrdp\novnc',($ipNow + ':7333'),'127.0.0.1:5900' -WindowStyle Hidden
                          } else {
                              Write-Host ($icons.warn + ' ' + $stamp + ' websockify heal skipped: no valid tailnet IP in config (refusing loopback rebind)')
                          }
                      } catch { }
                  }
              }
              $rustStr = 'OFF'
              if ($rustProbeOn) {
                  if (-not (Test-Path -LiteralPath $rustExe)) {
                      $rustProbeOn = $false
                      if (-not $rustMissingLogged) {
                          $rustMissingLogged = $true
                          Write-Host 'rust dash unavailable (build failed) - stopping 7332 probes for this run'
                      }
                      $rustStr = 'OFF'
                  } else {
                      $rustOk = Test-RustTcp
                      if (-not $rustOk) {
                          if (((Get-Date) - $lastRustFix).TotalMinutes -ge 2) {
                              $lastRustFix = Get-Date
                              Write-Host ($icons.wrench + ' ' + $stamp + ' Rust dashboard down on 7332 - restarting GhrdpRustDash')
                              $restarted = $false
                              try {
                                  Start-ScheduledTask -TaskName 'GhrdpRustDash' -ErrorAction Stop
                                  $restarted = $true
                              } catch {
                                  try {
                                      Start-Process -FilePath $rustExe -WorkingDirectory 'C:\ghrdp' -WindowStyle Hidden
                                      $restarted = $true
                                  } catch {
                                      Write-Host ('   restart failed: ' + $_.Exception.Message)
                                  }
                              }
                              if ($restarted) {
                                  Start-Sleep -Seconds 8
                                  $rustOk = Test-RustTcp
                                  if ($rustOk) { Write-Host ($icons.check + ' RECOVERED ' + $stamp + ' Rust dashboard is listening on 7332 again') } else { Write-Host ($icons.warn + ' STILL DOWN ' + $stamp + ' Rust dashboard 7332 - PowerShell fallback on 7331 is serving') }
                              }
                          }
                      }
                      if ($rustOk) { $rustStr = 'UP' } else { $rustStr = 'DOWN' }
                  }
              }
              $script:rustLast = $rustStr
              $dashShort = '(n/a)'
              if ($ipNow) {
                  if ($rustAdvertise -and ($script:rustLast -eq 'UP') -and $rustUrl) { $dashShort = $rustUrl }
                  else { $dashShort = 'http://' + $ipNow + ':7331/' }
              }
              $prog = Read-GhrdpJson -Path $progPath
              $watcherStr = 'NOT-STARTED'
              $scans = 0
              $done = 0
              $total = 0
              $failed = 0
              $spd = [long]0
              $watcherOk = $false
              if ($prog) {
                  if ($prog.agg) {
                      $done = [int]$prog.agg.done
                      $total = [int]$prog.agg.total
                      $failed = [int]$prog.agg.failed
                      $spd = [long]$prog.agg.speedBps
                  }
                  if ($prog.telemetry) { $scans = [int]$prog.telemetry.scans }
                  $age = $null
                  try { if ($prog.ts) { $age = [int]((Get-Date) - [datetime]$prog.ts).TotalSeconds } } catch { }
                  if ([bool]$prog.alive) {
                      if (($null -ne $age) -and ($age -lt 15)) {
                          $watcherOk = $true
                          $watcherStr = 'ACTIVE'
                      } elseif ($null -ne $age) {
                          $watcherStr = ('STALE (' + $age + 's)')
                      } else {
                          $watcherStr = 'STALE'
                      }
                  } elseif ($total -gt 0) {
                      $watcherStr = 'IDLE'
                  }
              }
              if (-not $watcherOk -and ($watcherStr -like 'STALE*')) {
                  if (((Get-Date) - $lastStaleFix).TotalMinutes -ge 2) {
                      $lastStaleFix = Get-Date
                      Write-Host ($icons.wrench + ' ' + $stamp + ' watcher STALE - nudging GhrdpWatcher (RDP user must be logged on)')
                      try { Start-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction Stop } catch { Write-Host ('   nudge failed: ' + $_.Exception.Message) }
                  }
              }
              if (((Get-Date) - $lastWatchNudge).TotalMinutes -ge 10) {
                  $lastWatchNudge = Get-Date
                  try { Start-ScheduledTask -TaskName 'GhrdpWatcher' -ErrorAction SilentlyContinue } catch { }
              }
           $wdAge = -1
           try { $wdTs = [System.IO.File]::ReadAllText('C:\ghrdp\webdesk\frame-ts.txt'); $wdAge = [int]((Get-Date) - [datetime]$wdTs).TotalMilliseconds } catch { }
           try { $pz = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-pub2.ps1*' } | ForEach-Object { $_.ProcessId.ToString() + '/s' + $_.SessionId }); [System.IO.File]::WriteAllText('C:\ghrdp\webdesk\procs.txt', ($pz -join ',')) } catch { }
            if (($wdAge -lt 0 -or $wdAge -gt 15000) -and (((Get-Date) - $lastWebDeskFix).TotalMinutes -ge 2)) {
                $lastWebDeskFix = Get-Date
                $sess = $false; $discId = $null; $actSess = $false
                try {
                    $ql = @(& quser.exe 2>$null); $LASTEXITCODE = 0
                    foreach ($qr in $ql) {
                        if (($qr -match [regex]::Escape([string]$cfgNow.rdpUser)) -or ($qr -match 'runneradmin')) {
                            $sess = $true
                            $m2 = [regex]::Match($qr, '(\d+)\s+(Disc|Active|Conn)')
                            if ($m2.Success) {
                                if ($m2.Groups[2].Value -eq 'Disc' -and -not $discId) { $discId = $m2.Groups[1].Value }
                                if ($m2.Groups[2].Value -eq 'Active') { $actSess = $true }
                            }
                        }
                    }
                } catch { }
                if ($discId) {
                    # [remediation 8D] tscon /password heal removed - no plaintext RDP password on command line. Disconnected sessions self-recover on next RDP login.
                    Write-Host ($icons.wrench + ' ' + $stamp + ' session ' + $discId + ' DISCONNECTED - waiting for user RDP login (no auto-tscon)')
                } elseif (-not $sess) {
                    Write-Host ($icons.wrench + ' ' + $stamp + ' no interactive session for RDP user - remediation #7C removed loopback-boot (NLA-off + plaintext cmdkey); log in via real RDP with NLA on')
                } else {
                    $aliveAge = -1
                    try { $aliveAge = [int]((Get-Date) - [datetime][System.IO.File]::ReadAllText('C:\ghrdp\webdesk\webdesk-alive.txt')).TotalMilliseconds } catch { }
                    if ($actSess -and ($wdAge -gt 15000)) {
                        Write-Host ($icons.wrench + ' ' + $stamp + ' active session but capture stale (frame=' + $wdAge + 'ms alive=' + $aliveAge + 'ms) - killing wrong-session captures + restarting')
                        try { Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-pub2.ps1*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } } catch { }
                        try { Start-ScheduledTask -TaskName 'GhrdpWebDesk' -ErrorAction Stop } catch { Write-Host ('   webdesk restart failed: ' + $_.Exception.Message) }
                        Start-Sleep -Seconds 5
                        $stillGone = $true
                        try { if (Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*ghrdp-pub2.ps1*' }) { $stillGone = $false } } catch { }
                        if ($stillGone) {
                            Write-Host ($icons.wrench + ' ' + $stamp + ' task restart produced no process - fallback direct start')
                            try { Start-Process 'powershell.exe' -ArgumentList '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ghrdp\ghrdp-pub2.ps1"' -WindowStyle Hidden } catch { Write-Host ('   fallback direct start failed: ' + $_.Exception.Message) }
                        }
                    }
                }
            }
            # --- WebRTC watchdog (P3/P4): keep exactly one server+ffmpeg in session 2 ---
            if (((Get-Date) - $lastWebRtcFix).TotalMinutes -ge 2) {
                $lastWebRtcFix = Get-Date
                $wv = $null
                try { $wv = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/version' -TimeoutSec 3 -ErrorAction Stop } catch { }
                $wAlive = $false; $wSess = -1; $wFfmpeg = 0
                try { if (Get-CimInstance Win32_Process -Filter $webRtcFilter -ErrorAction SilentlyContinue) { $wAlive = $true } } catch { }
                try { if ($wv) { $wSess = [int]$wv.session_id } } catch { }
                try { $wFfmpeg = @(Get-CimInstance Win32_Process -Filter "Name='ffmpeg.exe'" -ErrorAction SilentlyContinue).Count } catch { }
                if ((!$wAlive) -or (!$wv) -or ($wSess -ne 2) -or ($wFfmpeg -gt 1)) {
                    Write-Host ($icons.wrench + ' ' + $stamp + ' WebRTC heal: alive=' + $wAlive + ' version=' + [bool]$wv + ' session=' + $wSess + ' ffmpeg=' + $wFfmpeg)
                    try { Stop-ScheduledTask -TaskName 'GhrdpWebRTC' -ErrorAction SilentlyContinue } catch { }
                    try {
                        Get-CimInstance Win32_Process -Filter "Name='webrtc-server.exe'" -ErrorAction SilentlyContinue | ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force } catch { } }
                        Get-CimInstance Win32_Process -Filter "Name='ffmpeg.exe'" -ErrorAction SilentlyContinue | ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force } catch { } }
                    } catch { }
                    Start-Sleep -Seconds 2
                    try { Start-ScheduledTask -TaskName 'GhrdpWebRTC' -ErrorAction Stop } catch { Write-Host ('   webrtc restart failed: ' + $_.Exception.Message) }
                    Start-Sleep -Seconds 3
                    try { $wv2 = Invoke-RestMethod -Uri 'http://127.0.0.1:8080/version' -TimeoutSec 5 -ErrorAction Stop; Write-Host ('   webrtc healed: session_id=' + $wv2.session_id + ' commit=' + $wv2.git_commit) } catch { Write-Host '   webrtc still down after restart' }
                }
            }
           try {
               $tsj = (& 'C:\Program Files\Tailscale\tailscale.exe' status --json 2>$null) | ConvertFrom-Json
               $peer = $null
               if ($tsj -and $tsj.Peer) { foreach ($pp in $tsj.Peer.PSObject.Properties) { if ($pp.Value.Online) { $peer = $pp.Value; break } } }
               if ($peer) {
                   $isDirect = [bool]$peer.CurAddr
                    [System.IO.File]::WriteAllText('C:\ghrdp\webdesk\ts-path.txt', $(if ($isDirect) { 'DIRECT ' + [string]$peer.CurAddr } else { 'DERP ' + [string]$peer.Relay }), (New-Object System.Text.UTF8Encoding($false)))
                    try { $dc = @(Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue).Count; [System.IO.File]::WriteAllText('C:\ghrdp\webdesk\display-count.txt', [string]$dc) } catch { }
                   if (-not $isDirect -and (((Get-Date) - $lastDirectTry).TotalMinutes -ge 5)) { $lastDirectTry = Get-Date; & 'C:\Program Files\Tailscale\tailscale.exe' ping --until-direct -c 3 --timeout 5s ([string]@($peer.TailscaleIPs)[0]) 2>$null | Out-Null; $LASTEXITCODE = 0 }
               }
           } catch { }
          try {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*webdesk\term\run-*.ps1*' -and $_.ProcessId -ne $PID -and ((Get-Date) - $_.CreationDate).TotalMinutes -gt 6 } | ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } catch { } }
            Get-ChildItem 'C:\ghrdp\webdesk\term\status-*.txt' -ErrorAction SilentlyContinue | ForEach-Object { $tx = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue; if ($tx -match 'running' -and ((Get-Date) - $_.LastWriteTime).TotalMinutes -gt 6) { Set-Content $_.FullName 'exit=-1' -ErrorAction SilentlyContinue } }
          } catch { }
              $tsStr = 'OK'
              if (-not $tsOk) { $tsStr = 'DOWN' }
              $tsPath = 'n/a'
              if ($tsOk) {
                  try {
                      $j2 = (& $ts status --json 2>$null) | ConvertFrom-Json
                      if ($j2 -and $j2.Peer) {
                          foreach ($prop in $j2.Peer.PSObject.Properties) {
                              $pip = $null
                              try { $pip = @($prop.Value.TailscaleIPs)[0] } catch { }
                              if (-not $pip) { continue }
                              $o = (& $ts ping -c 1 $pip 2>$null) -join ' '
                              $ms = [regex]::Match($o, 'in ([0-9.]+)ms')
                              if ($o -match 'via DERP') { $tsPath = 'DERP ' + $ms.Groups[1].Value + 'ms' }
                              elseif ($ms.Success) { $tsPath = 'DIRECT ' + $ms.Groups[1].Value + 'ms' }
                              break
                          }
                      }
                  } catch { }
              }
              $rdpStr = 'OK'
              if (-not $rdpOk) { $rdpStr = 'DOWN' }
              $psStr = 'UP'
              if (-not $psOk) { $psStr = 'DOWN' }
              $line = 'HEARTBEAT ' + $icons.hourglass + ' remaining ' + (Get-Remaining) + ' | dashboard ' + $dashShort + ' | ts:' + $tsStr + ' path:' + $tsPath + ' | rdp3389:' + $rdpStr + ' | ps7331:' + $psStr + ' | rust7332:' + $rustStr + ' | watcher:' + $watcherStr + ' (scans ' + $scans + ') | files ' + $done + '/' + $total + ' failed ' + $failed + ' | speed ' + (Get-SpeedStr -Bps $spd) + ' | Last updated: ' + $stamp
              if (-not ($tsOk -and $rdpOk -and $psOk)) { $line = $icons.warn + ' ' + $line }
              Write-Host $line
              try {
                  . (Join-Path $env:RUNNER_TEMP 'publish-status.ps1')
                  $cfg2 = $null; $prog2 = $null
                  try { if (Test-Path 'C:\ghrdp\config.json') { $cfg2 = Get-Content 'C:\ghrdp\config.json' -Raw | ConvertFrom-Json } } catch { }
                  try { if (Test-Path 'C:\ghrdp\progress.json') { $prog2 = Get-Content 'C:\ghrdp\progress.json' -Raw | ConvertFrom-Json } } catch { }
                  $agg2 = @{ total = 0; done = 0; failed = 0; overallPct = 0; speedBps = 0 }
                  if ($prog2 -and $prog2.agg) { $agg2 = $prog2.agg }
                  $files2 = @()
                  if ($prog2 -and $prog2.files) { $files2 = @($prog2.files | Select-Object -First 200 | ForEach-Object { @{ name = [string]$_.name; size = [long]$_.size; phase = [string]$_.phase; pct = [double]$_.pct; status = [string]$_.status; link = [string]$_.link; encrypted = [string]$_.encrypted } }) }
                  $tail2 = @()
                  if ($prog2 -and $prog2.log) { $tail2 = @($prog2.log | Select-Object -Last 60) }
                  $statusObj2 = [ordered]@{
                      ts = (Get-Date -Format o)
                      runId = [string]$env:GITHUB_RUN_ID
                      runUrl = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
                      runStatus = 'in_progress'
                      runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
                      startedAt = $(if ($cfg2) { [string]$cfg2.startedAt } else { '' })
                      sessionStartedAt = $(if ($cfg2) { [string]$cfg2.sessionStartedAt } else { '' })
                      watcherAlive = $(if ($prog2) { [bool]$prog2.alive } else { $false })
                      speedBps = [long]$agg2.speedBps
                      overallPct = [double]$agg2.overallPct
                      filesDone = [int]$agg2.done
                      filesTotal = [int]$agg2.total
                      missionControlUrl = $(if ($cfg2 -and $cfg2.rdpIp) { 'http://' + $cfg2.rdpIp + ':7332/' } else { '' })
                      tailnetUrl = $(if ($cfg2 -and $cfg2.rdpIp) { 'http://' + $cfg2.rdpIp + ':7331/' } else { '' })
                      rustUrl = $(if ($cfg2) { [string]$cfg2.rustUrl } else { '' })
                      funnelUrl = $(if ($cfg2) { [string]$cfg2.funnelUrl } else { '' })
                      mirrorKey = '' # F52: no mirror key in the public snapshot
                      legacyKey = $(if ($cfg2) { [string]$cfg2.legacyDecryptKey } else { '' })
                      telegraphUrl = $(if ($cfg2) { [string]$cfg2.mirrorIndexUrl } else { '' })
                      rentryNewUrl = $(if ($cfg2) { [string]$cfg2.rentryNewUrl } else { '' })
                      egressIp = $(if ($cfg2) { [string]$cfg2.runnerEgressIp } else { '' })
                      encryptMode = $(if ($cfg2) { [string]$cfg2.encryptMode } else { '' })
                      files = $files2
                      logTail = $tail2
                      history = @()
                      runnerIp = $(if ($cfg2) { [string]$cfg2.rdpIp } else { '' })
                      epoch = (Get-Date).ToUniversalTime().ToString('o')
                      serverPort = 7331
                  }
                  Publish-StatusToGhPages -JsonText ($statusObj2 | ConvertTo-Json -Depth 20 -Compress)
              } catch { Write-Host ('[status] publish failed: ' + $_.Exception.Message) }
              if (($beat - $lastBannerBeat) -ge 10) {
                  $lastBannerBeat = $beat
                  Show-Banner -Reason ('auto-refresh, heartbeat ' + $beat)
              }
          }
          try { $cfgEnd = Read-GhrdpJson -Path $cfgPath; if ($cfgEnd) { $cfgEnd | Add-Member -NotePropertyName keepAlivePhase -NotePropertyValue 'ended' -Force; $cfgEnd | Add-Member -NotePropertyName keepAliveDeadline -NotePropertyValue ((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')) -Force; [System.IO.File]::WriteAllText($cfgPath, ($cfgEnd | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false))) } } catch { }
          Show-Banner -Reason 'keep-alive window finished - cleanup follows'
          Write-Host '[keepalive] keep-alive window complete; the cleanup steps will run now'
          exit 0

      # [F46 §1] the worker's attempt table, whatever the run's outcome: one row
      # per attempt with host/phase/status/ms and the COMPLETE host message. This
      # is what replaces "FAILED after 5 tries (all hosts; see log)" - a red run
      # now ships its own reason in the summary and the artifact.
      - name: F46 mirror attempt table + probe matrix (survives halts)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $S = $env:GITHUB_STEP_SUMMARY
          $art = Join-Path $env:GITHUB_WORKSPACE 'rdp-diag'
          New-Item -ItemType Directory -Path $art -Force -ErrorAction SilentlyContinue | Out-Null
          $mod = 'C:\ghrdp\ghrdp-mirror.ps1'
          if (-not (Test-Path -LiteralPath $mod)) { $mod = Join-Path $env:GITHUB_WORKSPACE 'payloads\ghrdp-mirror.ps1' }
          $tableTxt = 'attempt table unavailable: progress.json not readable'
          try {
              . $mod
              $prog = $null
              try { $prog = [System.IO.File]::ReadAllText('C:\ghrdp\progress.json') | ConvertFrom-Json } catch { $prog = $null }
              $attempts = @()
              $mode = 'unknown'
              $mirrorOn = 'unknown'
              try { if ($prog) { $mirrorOn = [string]$prog.mirror } } catch { }
              try { if ($prog.mirrorDiag) { $attempts = @($prog.mirrorDiag.attempts); $mode = [string]$prog.mirrorDiag.encryptMode } } catch { }
              if (@($attempts).Count -eq 0) {
                  $tableTxt = ('no mirror upload attempts this run (mirror=' + $mirrorOn + ' encryptMode=' + $mode + ') - zero attempts is itself a reported state, never an unexplained failure')
              } else {
                  $tableTxt = (Format-F46AttemptTableText -Attempts $attempts) + "`n" + ('encryptMode=' + $mode + ' (encrypted=false means the worker uploaded PLAINTEXT; the card must say so)')
              }
          } catch { $tableTxt = ('attempt table failed: ' + $_.Exception.Message) }
          Write-Host ('[F46] ' + $tableTxt)
          if ($S) {
              '### F46 mirror attempt table' | Add-Content -Path $S
              '```' | Add-Content -Path $S
              $tableTxt | Add-Content -Path $S
              '```' | Add-Content -Path $S
          }
          try { [System.IO.File]::WriteAllText((Join-Path $art 'mirror-attempts.txt'), ($tableTxt + "`n"), (New-Object System.Text.UTF8Encoding($false))) } catch { }
          exit 0

      - name: F46 mirror diagnostics artifact (probe + attempt table)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-diag
          if-no-files-found: warn
          retention-days: 14
          path: rdp-diag/mirror-*

      # [F59 §3] STARTUP TIMING REPORT + ARTIFACT. Every instrumented step wrote
      # {"step","sec","at"} lines to C:\ghrdp\startup-timing.jsonl (payloads/
      # f59-timing.ps1). This step prints the table, emits the before/after
      # numbers the PR body reports (baseline 15-20 min -> <5 min target), and
      # uploads the jsonl so every dispatch carries its own measurements.
      - name: F59 startup timing report (startup-timing.jsonl)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-timing.ps1')
          $file = Get-F59TimingFile
          $out = Join-Path $env:RUNNER_TEMP 'startup-timing.jsonl'
          if (Test-Path -LiteralPath $file) {
              Copy-Item -LiteralPath $file -Destination $out -Force
          } else {
              $rec = @{ step = 'timing-file-missing'; sec = 0; at = (Get-Date).ToUniversalTime().ToString('o') }
              [System.IO.File]::WriteAllText($out, ($rec | ConvertTo-Json -Compress) + "`n", (New-Object System.Text.UTF8Encoding($false)))
              Write-Host '::warning::[F59 timing] no startup-timing.jsonl was written by the instrumented steps'
          }
          $rows = Invoke-F59Measured -Step 'timing-report-read' -Body {
              $acc = @()
              foreach ($l in (Get-Content -LiteralPath $out)) {
                  if (-not $l.Trim()) { continue }
                  try { $acc += ($l | ConvertFrom-Json) } catch { }
              }
              return $acc
          }
          Write-Host '[F59 timing] startup-timing.jsonl:'
          $dash = -1
          foreach ($r in $rows) {
              Write-Host ('  ' + [string]$r.step + ' = ' + [string]$r.sec + 's')
              if ([string]$r.step -eq 'dashboard-reachable-from-job-start') { $dash = [double]$r.sec }
          }
          $provision = -1
          try { $provision = Get-F59SecondsSinceJobStart } catch { }
          if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## F59 startup timing'
              foreach ($r in $rows) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('* ' + [string]$r.step + ': ' + [string]$r.sec + 's') }
              if ($dash -ge 0) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('* dashboard-reachable-from-job-start: ' + [math]::Round($dash / 60.0, 1) + ' min (target <5 min)') }
          }
          if ($dash -ge 0) {
              Write-Host ('::notice title=F59 startup total::dashboard-reachable=' + $dash + 's (' + [math]::Round($dash / 60.0, 1) + ' min) target=<300s')
          }
          exit 0
      - name: Upload startup-timing artifact (F59)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-timing
          path: ${{ runner.temp }}/startup-timing.jsonl
          retention-days: 7
          if-no-files-found: error

      # [F92 §7.1] SMOKE GATE. Runs at the END of the rdp job, BEFORE the
      # cleanup step tears the server down (the spec's standalone `smoke:
      # needs: [deploy]` job cannot work here: on this 6h-ephemeral pattern the
      # dashboard is only alive DURING the rdp job - a post-rdp smoke job would
      # always probe a dead port). Green smoke => the "Dashboard Ready" notice
      # from the publish-url job is the operator's go. Playwright golden-path
      # already gates every PR via e2e-ui.yml, so this step stays the lean
      # curl+assert pair on the runner.
      - name: F92 smoke (wait for backend + assert self-test)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Check if service startup was actually reached before probing backend
          if [ ! -f "/c/ghrdp/ghrdp-server.ps1" ] && [ ! -f "C:/ghrdp/ghrdp-server.ps1" ] && ! curl -sf --max-time 5 --connect-timeout 3 "http://localhost:7331/progress" >/dev/null 2>&1; then
            echo "[f92 smoke] SKIPPED: backend service startup was not reached due to earlier provisioning failure"
            exit 0
          fi
          node ./scripts/f92-smoke-probe.mjs
          node ./scripts/assert-selftest.js "${RUNNER_TEMP:-/tmp}/sr.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-failure-${{ github.run_id }}
          path: |
            /tmp/sr.json
            ${{ runner.temp }}/sr.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup (wipe profiles/storage, reset funnel/serve) - no log-clear per remediation 8E
        if: ${{ always() && env.GHRDP_EPHEMERAL == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          Write-Host '[cleanup] secure cleanup starting'
          if (Test-Path -LiteralPath $ts) {
              foreach ($cmdArgs in @(@('serve', '--reset'), @('funnel', '--reset'), @('serve', 'off'), @('funnel', 'off'))) {
                  try { & $ts @cmdArgs 2>$null | Out-Null } catch { }
                  $LASTEXITCODE = 0
              }
              Write-Host '[cleanup] tailscale serve/funnel reset'
          }
          foreach ($tn in @('GhrdpWatcher', 'GhrdpServer', 'GHRDP-Server', 'GhrdpRustDash', 'GhrdpDirectHunter')) {
              try { Stop-ScheduledTask -TaskName $tn -ErrorAction SilentlyContinue } catch { }
              try { Unregister-ScheduledTask -TaskName $tn -Confirm:$false -ErrorAction SilentlyContinue } catch { }
          }
          $own = $PID
          try {
              $procs = Get-CimInstance Win32_Process -Filter "Name='pwsh.exe' OR Name='powershell.exe' OR Name='ghrdp-dash.exe'" -ErrorAction SilentlyContinue
              foreach ($pr in @($procs)) {
                  if (-not $pr) { continue }
                  if ([int]$pr.ProcessId -eq $own) { continue }
                  if ($pr.CommandLine -and ($pr.CommandLine -like '*ghrdp*')) {
                      try { Stop-Process -Id $pr.ProcessId -Force -ErrorAction SilentlyContinue } catch { }
                  }
              }
          } catch { }
          Write-Host '[cleanup] tasks and processes stopped (incl. ghrdp-dash.exe)'
          foreach ($p in @('D:\RDP-Storage', 'C:\ghrdp', 'C:\ghrdp-wipe')) {
              try { if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue } } catch { }
          }
          $user = [string]$env:RDP_USER
          if ($user) {
              $prof = $null
              try {
                  $keys = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList' -ErrorAction SilentlyContinue
                  foreach ($k in $keys) {
                      $img = (Get-ItemProperty -Path $k.PSPath -Name ProfileImagePath -ErrorAction SilentlyContinue).ProfileImagePath
                      if ($img -and ((Split-Path -Leaf ([string]$img)) -ieq $user)) { $prof = [string]$img; break }
                  }
              } catch { }
              if (-not $prof) {
                  try {
                      $dirs = Get-ChildItem 'C:\Users' -Directory -Filter ($user + '*') -ErrorAction SilentlyContinue
                      if ($dirs -and (@($dirs).Count -gt 0)) { $prof = @($dirs)[0].FullName }
                  } catch { }
              }
              if ($prof -and (Test-Path -LiteralPath $prof)) {
                  try {
                      $up = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue | Where-Object { ([string]$_.LocalPath) -ieq $prof }
                      if ($up) { Remove-CimInstance -InputObject $up -ErrorAction SilentlyContinue }
                  } catch { }
                  try { Remove-Item -LiteralPath $prof -Recurse -Force -ErrorAction SilentlyContinue } catch { }
                  Write-Host ('[cleanup] profile removed (incl. browser data): ' + $prof)
              } else {
                  Write-Host '[cleanup] no RDP profile found (never logged in) - nothing to wipe'
              }
              try { Remove-LocalUser -Name $user -ErrorAction SilentlyContinue } catch { }
              Write-Host ('[cleanup] local account removed: ' + $user)
          } else {
              Write-Host '[cleanup] RDP user was not created; skipping user wipe'
          }
          foreach ($n in @('RDP-Storage (D).lnk', 'Mission Control.lnk', 'GHRDP Start (watcher + dashboard).lnk', 'DEBUG-GHRDP.bat', 'GHRDP-DEBUG-REPORT.txt')) {
              try { Remove-Item -LiteralPath ('C:\Users\Public\Desktop\' + $n) -Force -ErrorAction SilentlyContinue } catch { }
          }
          # [remediation 8E] wevtutil cl event-log-clear loop + PSReadLine history delete removed - no anti-forensics.
          if (Test-Path -LiteralPath $ts) {
              try { & $ts logout 2>$null | Out-Null } catch { }
              $LASTEXITCODE = 0
          }
          Write-Host '[cleanup] done'
          # [M8 follow-up RC-02] the nested terminal publication that used to sit
          # here (Publish-StatusToGhPages with runStatus='completed' + overallPct=100
          # hardcoded) is RETIRED: (a) it was token-loss-prone (this step never sees
          # $env:GITHUB_TOKEN and the C:\ghrdp wipe above deletes gh-pages-token.txt,
          # so it silently returned - PROB-004), and (b) whenever it DID publish it
          # wrote a false 'completed/100%' even for cancelled runs - the exact lie
          # M8 exists to erase. The 'Finalize status.json (M8 ...)' step below is now
          # the SOLE terminal writer on every outcome; if it fails, the snapshot
          # truthfully keeps its last published (stale) state instead of a fabricated
          # completed. The security cleanup above is unchanged.
          # archive.json is still appended by the pre-cleanup step only.
          exit 0

      # [M8] CANCELLATION-SAFE STATUS FINALIZER (PROB-004 / RC-02). The Cleanup
      # step's nested finalize was token-loss-prone (it wiped C:\ghrdp - including
      # gh-pages-token.txt - BEFORE publishing, and that step never saw
      # $env:GITHUB_TOKEN, so Publish-StatusToGhPages silently returned): a
      # cancelled run left runStatus=in_progress published forever (observed:
      # docs/status.json frozen at in_progress for 58h after the 2026-10-07
      # cancellation). It also hardcoded runStatus='completed' regardless of the
      # real outcome (retired in the M8 follow-up - this step is now the SOLE
      # terminal writer). This step runs on EVERY outcome (always()), maps the
      # real job.status to a truthful terminal runStatus, and is fully
      # self-contained (no RUNNER_TEMP helper, no C:\ghrdp token file). It never
      # fails the job, every request is explicitly timed, the whole finalize is
      # deadline-bounded, and a finished run never clobbers the snapshot a newer
      # run (or a newer attempt of the same run) is heartbeating.
      # OWNERSHIP POLICY (generation-aware, see Resolve-FinalizeAction):
      #   live snapshot (in_progress) of ANOTHER run   -> step aside, no write
      #   live snapshot of a NEWER attempt of this run  -> step aside (stale attempt)
      #   terminal snapshot of THIS run+attempt         -> idempotent skip
      #   terminal snapshot of a DIFFERENT run          -> safe to supersede
      #     (a terminal state is dead-state by definition: that run cannot
      #      resume heartbeating; the per-attempt re-read plus the PUT sha
      #      fence still protect against a takeover between read and write)
      #   missing file / older-attempt state            -> finalize
      #   unreadable/invalid/unidentifiable state       -> UNKNOWN ownership:
      #     step aside with a visible warning; never treat a failed read as
      #     permission to overwrite.
      # HONEST LIMITS: if: always() cannot survive forced runner termination,
      # job-timeout kills, lost permissions or total network loss; in those
      # cases this step simply never runs and the snapshot stays stale-UNKNOWN
      # (observable via the M7 freshness gate), which is truthful - it is never
      # reported as cancelled/completed by this step.
      - name: Finalize status.json (M8 cancellation-safe terminal state)
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          # Time bounds (RC-02 follow-up): every request is explicitly timed and
          # the whole finalize is deadline-bounded; env overrides let the
          # behavioral harness shrink them. No fixed completion time is promised.
          $reqTimeoutSec = 30
          try { if ($env:M8_REQUEST_TIMEOUT_SEC) { $reqTimeoutSec = [int]$env:M8_REQUEST_TIMEOUT_SEC } } catch { }
          if ($reqTimeoutSec -lt 5) { $reqTimeoutSec = 5 }
          $deadlineSec = 150
          try { if ($env:M8_FINALIZE_DEADLINE_SEC) { $deadlineSec = [int]$env:M8_FINALIZE_DEADLINE_SEC } } catch { }
          if ($deadlineSec -lt ($reqTimeoutSec + 10)) { $deadlineSec = $reqTimeoutSec + 10 }
          $maxAttempts = 3
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          function Test-M8Deadline { return ($clock.ElapsedMilliseconds -lt ($deadlineSec * 1000)) }
          function Out-M8Sanitized { param([string]$Msg)
              $tok = [string]$env:GITHUB_TOKEN
              if ($tok) { $Msg = $Msg -replace [regex]::Escape($tok), '***' }
              return $Msg
          }
          # Discriminating reader (PROB-004 follow-up): never conflates failure
          # kinds. state: ok | missing | auth | transient | invalid | invalid-identity
          function Get-TrackedStatus {
              param($Api, $Headers)
              $r = @{ state = 'transient'; sha = $null; runId = ''; runStatus = ''; runAttempt = 0; pct = 0; done = 0; total = 0; detail = '' }
              $sc = 0
              $g = $null
              try {
                  $g = Invoke-RestMethod -Uri ($Api + '?ref=main') -Headers $Headers -TimeoutSec $reqTimeoutSec -SkipHttpErrorCheck -StatusCodeVariable sc -ErrorAction Stop
              } catch {
                  $code = 0
                  try { $code = [int]$_.Exception.Response.StatusCode } catch { }
                  if ($code -eq 404) { $r.state = 'missing'; return $r }
                  if ($code -eq 401 -or $code -eq 403) { $r.state = 'auth'; $r.detail = ('http ' + $code); return $r }
                  $r.detail = ('request failed: ' + $_.Exception.Message)
                  return $r
              }
              if ($sc -eq 404) { $r.state = 'missing'; return $r }
              if ($sc -eq 401 -or $sc -eq 403) { $r.state = 'auth'; $r.detail = ('http ' + $sc); return $r }
              if ($sc -lt 200 -or $sc -ge 300) { $r.state = 'transient'; $r.detail = ('http ' + $sc); return $r }
              $r.sha = [string]$g.sha
              $text = $null
              try { $text = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($g.content -replace "`n", ''))) } catch { }
              if ($null -eq $text) { $r.state = 'invalid'; $r.detail = 'base64 decode failed'; return $r }
              $obj = $null
              try { $obj = $text | ConvertFrom-Json } catch { }
              if ($null -eq $obj) { $r.state = 'invalid'; $r.detail = 'json parse failed'; return $r }
              if (-not ($obj.PSObject.Properties['runId'] -and $obj.runId)) { $r.state = 'invalid-identity'; $r.detail = 'missing runId'; return $r }
              if (-not ($obj.PSObject.Properties['runStatus'] -and $obj.runStatus)) { $r.state = 'invalid-identity'; $r.detail = 'missing runStatus'; return $r }
              $r.state = 'ok'
              $r.runId = [string]$obj.runId
              $r.runStatus = [string]$obj.runStatus
              try { if ($obj.PSObject.Properties['runAttempt']) { $r.runAttempt = [int]$obj.runAttempt } } catch { }
              try { $r.pct = [double]$obj.overallPct } catch { }
              try { $r.done = [int]$obj.filesDone } catch { }
              try { $r.total = [int]$obj.filesTotal } catch { }
              return $r
          }
          $terminalStates = @('completed', 'cancelled', 'failed', 'unknown')
          # Ownership policy (see the step comment for the full table).
          function Resolve-FinalizeAction {   # -> finalize|skip-owned|skip-foreign-active|skip-superseded|skip-unknown|abort-read|retry-read
              param($Cur, [string]$Mine, [int]$MyAttempt)
              switch ($cur.state) {
                  'missing' { return 'finalize' }
                  'auth' { return 'abort-read' }
                  'transient' { return 'retry-read' }
                  'ok' {
                      if ($cur.runId -ne $mine) {
                          if ($cur.runStatus -eq 'in_progress') { return 'skip-foreign-active' }
                          if ($terminalStates -contains $cur.runStatus) { return 'finalize' }
                          return 'skip-unknown'
                      }
                      if ($cur.runStatus -eq 'in_progress') {
                          if ($cur.runAttempt -gt $myAttempt) { return 'skip-superseded' }
                          return 'finalize'
                      }
                      if ($terminalStates -contains $cur.runStatus) {
                          if ($cur.runAttempt -ge $myAttempt) { return 'skip-owned' }
                          return 'finalize'
                      }
                      return 'skip-unknown'
                  }
              }
              return 'skip-unknown'
          }
          try {
              $jobStatus = '${{ job.status }}'
              $terminal = 'unknown'
              switch ($jobStatus) {
                  'success'   { $terminal = 'completed' }
                  'cancelled' { $terminal = 'cancelled' }
                  'failure'   { $terminal = 'failed' }
              }
              $token = [string]$env:GITHUB_TOKEN
              if (-not $token) {
                  # No credential: never attempt an unauthorized write; say so plainly.
                  Write-Host '::warning::[m8] GITHUB_TOKEN is not available to this step; terminal status.json could not be published (snapshot left unchanged)'
                  exit 0
              }
              $repo = $env:GITHUB_REPOSITORY
              $api = "https://api.github.com/repos/$repo/contents/docs/status.json"
              $H = @{ Authorization = ('Bearer ' + $token); Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'ghrdp-runner' }
              $mine = [string]$env:GITHUB_RUN_ID
              $myAttempt = 1
              try { if ($env:GITHUB_RUN_ATTEMPT) { $myAttempt = [int]$env:GITHUB_RUN_ATTEMPT } } catch { }
              $cur = Get-TrackedStatus -Api $api -Headers $H
              $action = Resolve-FinalizeAction -Cur $cur -Mine $mine -MyAttempt $myAttempt
              if ($action -eq 'retry-read' -and (Test-M8Deadline)) {
                  # One bounded read-retry here; the publish loop re-reads again.
                  Start-Sleep -Seconds 2
                  $cur = Get-TrackedStatus -Api $api -Headers $H
                  $action = Resolve-FinalizeAction -Cur $cur -Mine $mine -MyAttempt $myAttempt
              }
              if ($action -eq 'skip-foreign-active') {
                  Write-Host ('::notice::[m8] docs/status.json is owned by run ' + $cur.runId + ' (active in_progress); skipping finalize for run ' + $mine)
                  exit 0
              }
              if ($action -eq 'skip-owned' -or $action -eq 'skip-superseded' -or $action -eq 'skip-unknown') {
                  Write-Host ('::notice::[m8] docs/status.json not finalized by run ' + $mine + ' (action=' + $action + '; remote runId=' + $cur.runId + ' attempt=' + $cur.runAttempt + ' status=' + $cur.runStatus + ') - snapshot left unchanged')
                  exit 0
              }
              if ($action -ne 'finalize') {
                  Write-Host ('::warning::[m8] could not read/validate docs/status.json safely (action=' + $action + '; detail=' + (Out-M8Sanitized ([string]$cur.detail)) + '); snapshot left unchanged')
                  exit 0
              }
              $published = $false
              # Progress carry policy (PROB-004 follow-up): counters are refreshed
              # from the FRESHEST same-run read inside the loop, never taken from
              # a foreign snapshot, and never fabricated into a synthetic 100%.
              $pct = 0; $done = 0; $total = 0; $progressSource = 'none-observed'
              for ($attempt = 1; ($attempt -le $maxAttempts) -and (-not $published) -and (Test-M8Deadline); $attempt++) {
                  # Re-read before every PUT: a takeover between attempts aborts
                  # here; the residual race lands as a 409 on the sha fence.
                  $cur = Get-TrackedStatus -Api $api -Headers $H
                  $action = Resolve-FinalizeAction -Cur $cur -Mine $mine -MyAttempt $myAttempt
                  if ($action -eq 'retry-read') { if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds 2 }; continue }
                  if ($action -eq 'skip-foreign-active') {
                      Write-Host ('::notice::[m8] run ' + $cur.runId + ' now owns docs/status.json; aborting finalize for run ' + $mine)
                      break
                  }
                  if ($action -ne 'finalize') {
                      Write-Host ('::notice::[m8] finalize aborted at attempt ' + $attempt + ' (action=' + $action + ') - snapshot left unchanged')
                      break
                  }
                  if ($cur.state -eq 'ok' -and $cur.runId -eq $mine) {
                      $pct = [double]$cur.pct; $done = [int]$cur.done; $total = [int]$cur.total
                      $progressSource = ('remote-read attempt=' + $attempt)
                  }
                  $finalObj = [ordered]@{
                      ts = (Get-Date -Format o)
                      runId = $mine
                      runAttempt = $myAttempt
                      runUrl = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $mine)
                      runStatus = $terminal
                      finalizeReason = ('job.status=' + $jobStatus)
                      progressSource = $progressSource
                      watcherAlive = $false
                      speedBps = 0; overallPct = $pct; filesDone = $done; filesTotal = $total
                      missionControlUrl = ''; tailnetUrl = ''; rustUrl = ''; funnelUrl = ''
                      mirrorKey = ''; legacyKey = ''; telegraphUrl = ''; rentryNewUrl = ''
                      egressIp = ''; encryptMode = ''; files = @(); logTail = @(); history = @()
                  }
                  $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes(($finalObj | ConvertTo-Json -Depth 20 -Compress)))
                  $body = @{ message = ('status finalize ' + $terminal + ' ' + (Get-Date -Format o)); content = $b64; branch = 'main' }
                  if ($cur.state -eq 'ok' -and $cur.sha) { $body.sha = [string]$cur.sha }
                  $scPut = 0
                  try {
                      Invoke-RestMethod -Uri $api -Headers $H -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -TimeoutSec $reqTimeoutSec -SkipHttpErrorCheck -StatusCodeVariable scPut -ErrorAction Stop | Out-Null
                      if ($scPut -ge 200 -and $scPut -lt 300) { $published = $true }
                      elseif ($scPut -eq 401 -or $scPut -eq 403) {
                          Write-Host ('::warning::[m8] terminal publish rejected with http ' + $scPut + ' (auth); credentials are not retried')
                          break
                      } elseif ($scPut -eq 409) {
                          Write-Host ('[m8] publish attempt ' + $attempt + ' hit a 409 conflict; re-reading and re-validating under the bounded policy')
                      } else {
                          Write-Host ('[m8] publish attempt ' + $attempt + ' got http ' + $scPut + '; bounded retry follows')
                      }
                  } catch {
                      Write-Host ('[m8] publish attempt ' + $attempt + ' failed: ' + (Out-M8Sanitized $_.Exception.Message))
                  }
                  if (-not $published -and $attempt -lt $maxAttempts -and (Test-M8Deadline)) {
                      $sleepSec = [Math]::Min(2 * $attempt, [Math]::Max(1, [int](($deadlineSec * 1000 - $clock.ElapsedMilliseconds) / 2000)))
                      Start-Sleep -Seconds $sleepSec
                  }
              }
              if ($published) {
                  # Run-scoped sentinel: any LATE heartbeat through
                  # Publish-StatusToGhPages (a publisher that outlives the
                  # cleanup kill) is suppressed, so a valid terminal state
                  # cannot silently regress to in_progress.
                  try {
                      $sentinel = @{ runId = $mine; runAttempt = $myAttempt; runStatus = $terminal; ts = (Get-Date -Format o) }
                      [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP ('ghrdp-m8-terminal-' + $mine + '.json')), ($sentinel | ConvertTo-Json -Compress), (New-Object System.Text.UTF8Encoding($false)))
                  } catch { }
                  Write-Host ('[m8] status.json finalized: runStatus=' + $terminal + ' (job.status=' + $jobStatus + ')')
              } else {
                  Write-Host '::warning::[m8] could not publish terminal status.json within the bounded retry/deadline; the published snapshot stays stale'
              }
          } catch {
              Write-Host ('::warning::[m8] finalize failed: ' + (Out-M8Sanitized $_.Exception.Message))
          }
          exit 0

# [remediation 8E] "Overwrite free space" step removed - no anti-forensics.

  # [F92 §7.1] The operator's "it's safe to open the dashboard" signal.
  # needs:[rdp] serialises it behind the in-job F92 smoke step: if smoke went
  # red, rdp still completed (the step failure is visible in the log + the
  # artifact) - but the notice ONLY prints when the whole rdp job is green,
  # so a red smoke never ships a green "Ready" banner.
  publish-url:
    name: Verify Launch Outcome & Publish Summary
    needs: [preflight, ensure-f59-binaries, build-ui, verify-dependencies, rdp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify Launch Outcome and Publish Summary
        shell: pwsh
        env:
          EXEC_MODE: ${{ github.event.inputs.mode || 'readiness' }}
          PREFLIGHT_RES: ${{ needs.preflight.result }}
          F59_RES: ${{ needs.ensure-f59-binaries.result }}
          UI_RES: ${{ needs.build-ui.result }}
          VERIFY_RES: ${{ needs.verify-dependencies.result }}
          RDP_RES: ${{ needs.rdp.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $S = $env:GITHUB_STEP_SUMMARY

          $mode = $env:EXEC_MODE
          $preflightRes = $env:PREFLIGHT_RES
          $f59Res = $env:F59_RES
          $uiRes = $env:UI_RES
          $verifyRes = $env:VERIFY_RES
          $rdpRes = $env:RDP_RES

          Write-Host "LAUNCH OUTCOME CHECK:"
          Write-Host "- Mode: $mode"
          Write-Host "- Preflight Result: $preflightRes"
          Write-Host "- Ensure F59 Binaries Result: $f59Res"
          Write-Host "- Build UI Result: $uiRes"
          Write-Host "- Verify Dependencies Result: $verifyRes"
          Write-Host "- RDP Job Result: $rdpRes"

          if ($mode -eq 'readiness') {
              Write-Host "STATE: CONFIGURATION_PRESENT (Mode: readiness)"
              if ($S) {
                  '### 🛑 Readiness Check Complete' | Add-Content -LiteralPath $S -Encoding utf8
                  'වින්‍යාසකරණ (Configuration) දත්ත සාර්ථකව පරීක්ෂා කරන ලදී (Mode: readiness).' | Add-Content -LiteralPath $S -Encoding utf8
                  'RDP Session එක ආරම්භ කිරීම සඳහා `mode=rdp` ලෙස තෝරාගෙන නැවත Workflow එක ක්‍රියාත්මක කරන්න.' | Add-Content -LiteralPath $S -Encoding utf8
              }
              exit 0
          }

          if ($preflightRes -ne 'success') {
              $msg = "Launch blocked: Preflight configuration check failed or cancelled (result: $preflightRes)."
              Write-Host "::error::$msg"
              if ($S) {
                  '### ❌ RDP Launch Blocked' | Add-Content -LiteralPath $S -Encoding utf8
                  'Preflight පරීක්ෂාව අසාර්ථක විය.' | Add-Content -LiteralPath $S -Encoding utf8
              }
              exit 1
          }

          if ($verifyRes -ne 'success') {
              $msg = "Launch blocked: Dependency verification failed (result: $verifyRes)."
              Write-Host "::error::$msg"
              if ($S) {
                  '### ❌ RDP Launch Blocked' | Add-Content -LiteralPath $S -Encoding utf8
                  'අත්‍යවශ්‍ය Dependencies (UI/Binaries) සූදානම් කිරීම අසාර්ථක විය.' | Add-Content -LiteralPath $S -Encoding utf8
              }
              exit 1
          }

          if ($rdpRes -eq 'skipped') {
              $msg = "UNEXPECTED_RDP_SKIP: Workflow requested mode=rdp, preflight and dependency checks succeeded, but the rdp job was unexpectedly skipped."
              Write-Host "::error::$msg"
              if ($S) {
                  '### ❌ RDP Launch Unexpectedly Skipped (Defect Detected)' | Add-Content -LiteralPath $S -Encoding utf8
                  '**දෝෂය:** `mode=rdp` තෝරාගෙන Preflight සහ Dependency verification සාර්ථක වූ නමුත් RDP job එක ආරම්භ නොවී Skip වී ඇත.' | Add-Content -LiteralPath $S -Encoding utf8
                  '**State:** DEPENDENCIES_VERIFIED, RDP_JOB_STARTED=False' | Add-Content -LiteralPath $S -Encoding utf8
              }
              exit 1
          }

          if ($rdpRes -eq 'cancelled') {
              Write-Host "RDP job was cancelled."
              if ($S) {
                  '### 🛑 RDP Launch Cancelled' | Add-Content -LiteralPath $S -Encoding utf8
                  'RDP ක්‍රියාවලිය පරිශීලකයා හෝ පද්ධතිය මගින් අවලංගු කරන ලදී.' | Add-Content -LiteralPath $S -Encoding utf8
              }
              exit 1
          }

          if ($rdpRes -ne 'success') {
              $msg = "RDP job failed (result: $rdpRes)."
              Write-Host "::error::$msg"
              if ($S) {
                  '### ❌ RDP Session Failed' | Add-Content -LiteralPath $S -Encoding utf8
                  'RDP ක්‍රියාත්මක කිරීමේ Job එක අසාර්ථක විය.' | Add-Content -LiteralPath $S -Encoding utf8
              }
              exit 1
          }

          # rdpRes == 'success'
          Write-Host "STATE: SERVICES_READY, RDP_JOB_STARTED=True"
          Write-Host "::notice title=RDP Session Completed::RDP session finished and cleaned up successfully."
          if ($S) {
              '### ✅ RDP Session Execution Completed' | Add-Content -LiteralPath $S -Encoding utf8
              'RDP සැසිය සාර්ථකව ආරම්භ වී, නියමිත කාලය අවසානයේ සේවාවන් ආරක්ෂිතව නවතා දමන ලදී.' | Add-Content -LiteralPath $S -Encoding utf8
              '**State:** CONFIGURATION_PRESENT, DEPENDENCIES_VERIFIED, RDP_JOB_STARTED, SERVICES_READY' | Add-Content -LiteralPath $S -Encoding utf8
          }
          exit 0

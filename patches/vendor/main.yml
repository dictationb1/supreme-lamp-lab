name: Windows RDP - Tailscale Mission Control (6h ephemeral)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'ක්‍රියාත්මක කරන මාදිලිය (Mode). "readiness" මගින් RDP ආරම්භ නොකර වින්‍යාසයන් පමණක් පරීක්ෂා කරයි. "rdp" මගින් අවශ්‍ය dependencies (UI, prebuilt binaries) ස්වයංක්‍රීයව සූදානම් කර RDP සැසිය ආරම්භ කරයි.'
        type: choice
        options:
          - readiness
          - rdp
        default: readiness
        required: true
      runner_target:
        description: 'Runner: windows-latest = US Azure (fast DL, ~260ms RDP) | self-hosted-windows-near = your nearby runner (10-60ms RDP)'
        type: choice
        options:
          - windows-latest
          - self-hosted-windows-near
        default: windows-latest
      encrypt_mode:
        description: 'none = upload original files unencrypted (streamable on gofile); media-plain = video/audio plain, rest AES-256; all = encrypt everything (.ghenc suffix)'
        type: choice
        options:
          - none
          - media-plain
          - all
        default: none
      # [F47 §1 -> F48 §0 -> F59 §1] PER-RUN MIRROR OPT-IN, DEFAULT FLIPPED ON.
      # [F48] uploads run in TOKEN-LESS guest mode - no repository secret exists
      # or is read, and a missing credential is the NORMAL state (never a halt).
      # [F59] the dispatch default is now TRUE: a stock dispatch mirrors with the
      # one-click F49 runtime opt-in/disable path unchanged; false turns the
      # manual lane OFF for this run. The shipped config host default (F11-5.2,
      # Get-F46DefaultHost enabled=$false) is a different thing and is untouched.
      mirror_enable:
        description: 'F47/F48 per-run mirror opt-in (F59 default ON): mirrorHosts[0] for THIS run only, token-less guest mode (no secret needed). false = mirror stays OFF for this run.'
        type: boolean
        default: true
      # [F59 §1] PLAINTEXT IS THE DEFAULT for the manual dispatch lane and the
      # visible PLAINTEXT MODE banner is mandatory. The SAFETY FLOOR is not
      # electable: Downloads auto-upload and the runtime opt-in lane ALWAYS
      # encrypt (AES-256-GCM / CBC-PBKDF2 fallback), and the per-run key stays
      # runner-local. true = the F46 encrypted lane for the manual dispatch path.
      mirror_encrypt:
        description: 'F59 default FALSE = PLAINTEXT MODE for the manual dispatch lane (visible banner required). true = F46 AES-256-GCM (CBC-PBKDF2 fallback). Downloads auto-upload and runtime opt-in ALWAYS encrypt - the safety floor cannot be elected away.'
        type: boolean
        default: false
      # [F59 §1] F56-d transport lane, DEFAULT FLIPPED ON: the Search tab and the
      # aria2c fetch button are live out of the box (the binary is the F59
      # prebuilt release asset). false hides the lane for this run.
      search_enable:
        description: 'F56-d transport lane (F59 default ON): Search tab + aria2c fetch live out of the box. false = lane hidden for this run.'
        type: boolean
        default: true

permissions:
  contents: write   # push docs/search.html from the watcher (superset of read)
  actions: write    # [F43] artifact upload/download for dist-ui (build-ui -> rdp)
  pages: write      # enable/configure GitHub Pages via API
  id-token: write   # optional, harmless; needed only if you later use OIDC

jobs:
  preflight:
    name: Preflight Configuration Check
    runs-on: ubuntu-latest
    outputs:
      need_f59_build: ${{ steps.check.outputs.need_f59_build }}
      need_ui_build: ${{ steps.check.outputs.need_ui_build }}
      f59_status: ${{ steps.check.outputs.f59_status }}
      ui_status: ${{ steps.check.outputs.ui_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preflight Configuration Check (Readiness Gate)
        id: check
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          VNC_PASS: ${{ secrets.VNC_PASS }}
          RENTRY_EDIT_PASSWORD: ${{ secrets.RENTRY_EDIT_PASSWORD }}
          MIRROR_INPUT: ${{ github.event.inputs.mirror_enable }}
          EXEC_MODE: ${{ github.event.inputs.mode || 'readiness' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $S = $env:GITHUB_STEP_SUMMARY
          $missingSecrets = @()

          if (-not $env:TS_AUTHKEY) { $missingSecrets += 'TS_AUTHKEY' }
          if (-not $env:VNC_PASS) { $missingSecrets += 'VNC_PASS' }
          if ($env:MIRROR_INPUT -eq 'true' -and -not $env:RENTRY_EDIT_PASSWORD) { $missingSecrets += 'RENTRY_EDIT_PASSWORD (Mirror mode සක්‍රීය නිසා)' }

          if ($missingSecrets.Count -gt 0) {
              $msg = "අත්‍යවශ්‍ය Configuration Secrets නොමැත: " + ($missingSecrets -join '; ')
              Write-Host "::error::$msg"
              if ($S) {
                  "### ❌ RDP ආරම්භ කිරීම අවහිර කර ඇත (Launch Blocked)" | Add-Content -Path $S
                  "**හේතුව:** අත්‍යවශ්‍ය රහස්‍ය දත්ත (secrets) සකසා නොමැත." | Add-Content -Path $S
                  "" | Add-Content -Path $S
                  "**අඩුපාඩු:**" | Add-Content -Path $S
                  foreach ($m in $missingSecrets) {
                      "- ``$m``" | Add-Content -Path $S
                  }
                  "" | Add-Content -Path $S
                  "**විසඳුම:**" | Add-Content -Path $S
                  "- Secrets සඳහා: [Secrets Settings](https://github.com/$env:GITHUB_REPOSITORY/settings/secrets/actions)" | Add-Content -Path $S
              }
              throw "CONFIGURATION_MISSING: $msg"
          }

          # Validate F59 prebuilt pins manifest locally
          $pinsPath = Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-prebuilt-pins.json'
          if (-not (Test-Path -LiteralPath $pinsPath)) {
              throw "MANIFEST_MISSING: payloads/f59-prebuilt-pins.json file does not exist in repository workspace."
          }
          $pinsRaw = Get-Content -LiteralPath $pinsPath -Raw
          if ([string]::IsNullOrWhiteSpace($pinsRaw)) {
              throw "INVALID_MANIFEST: payloads/f59-prebuilt-pins.json is empty."
          }
          try {
              $pins = $pinsRaw | ConvertFrom-Json
          } catch {
              throw ("INVALID_MANIFEST: payloads/f59-prebuilt-pins.json JSON parse failed: " + $_.Exception.Message)
          }

          $tag = [string]$pins.release_tag
          if ([string]::IsNullOrWhiteSpace($tag)) {
              throw "INVALID_MANIFEST: release_tag in payloads/f59-prebuilt-pins.json is empty."
          }
          $ckAsset = [string]$pins.checksums_asset
          $ariaName = [string]$pins.assets.aria2c.name
          $ariaSha = [string]$pins.assets.aria2c.sha256
          $qbtName = [string]$pins.assets.qbittorrent.name
          $qbtSha = [string]$pins.assets.qbittorrent.sha256

          if ([string]::IsNullOrWhiteSpace($ckAsset) -or [string]::IsNullOrWhiteSpace($ariaName) -or [string]::IsNullOrWhiteSpace($ariaSha) -or [string]::IsNullOrWhiteSpace($qbtName) -or [string]::IsNullOrWhiteSpace($qbtSha)) {
              throw "INVALID_MANIFEST: payloads/f59-prebuilt-pins.json is missing required asset names or sha256 checksum pins."
          }

          # Inspect F59 prebuilt release
          $repo = $env:GITHUB_REPOSITORY
          $needF59Build = $false
          $f59Status = 'REUSED'
          $relJson = gh release view $tag -R $repo --json assets 2>&1
          if ($LASTEXITCODE -ne 0) {
              $needF59Build = $true
              $f59Status = 'MISSING'
              Write-Host "::notice::Release $tag not found or accessible. Preparation required."
          } else {
              try {
                  $relObj = $relJson | ConvertFrom-Json
                  $assetNames = @($relObj.assets | ForEach-Object { [string]$_.name })
                  $needAssets = @($ckAsset, $ariaName, $qbtName)
                  foreach ($na in $needAssets) {
                      if ($assetNames -notcontains $na) {
                          $needF59Build = $true
                          $f59Status = 'MISSING'
                          Write-Host "::notice::Asset $na missing from release $tag. Preparation required."
                      }
                  }
              } catch {
                  $needF59Build = $true
                  $f59Status = 'MISSING'
              }
          }

          # Inspect UI prebuilt release
          $sha = $env:GITHUB_SHA
          $uiAsset = "ui-dist-${sha}.zip"
          $needUiBuild = $false
          $uiStatus = 'REUSED'
          $uiRelJson = gh release view ui-dist -R $repo --json assets 2>&1
          if ($LASTEXITCODE -ne 0) {
              $needUiBuild = $true
              $uiStatus = 'MISSING'
              Write-Host "::notice::Release ui-dist not found or accessible. Preparation required."
          } else {
              try {
                  $uiRelObj = $uiRelJson | ConvertFrom-Json
                  $uiAssetNames = @($uiRelObj.assets | ForEach-Object { [string]$_.name })
                  if ($uiAssetNames -notcontains $uiAsset -or $uiAssetNames -notcontains "${uiAsset}.sha256") {
                      $needUiBuild = $true
                      $uiStatus = 'MISSING'
                      Write-Host "::notice::UI asset $uiAsset or sidecar missing from release ui-dist. Preparation required."
                  }
              } catch {
                  $needUiBuild = $true
                  $uiStatus = 'MISSING'
              }
          }

          if ($env:EXEC_MODE -eq 'readiness') {
              Write-Host "READINESS CHECK COMPLETE:"
              Write-Host "- Secrets: VALID"
              Write-Host ("- F59 Binaries: " + $(if ($needF59Build) { "PENDING_AUTOMATIC_PREPARATION (Will be created automatically on mode=rdp)" } else { "VERIFIED/REUSED" }))
              Write-Host ("- UI Bundle: " + $(if ($needUiBuild) { "PENDING_AUTOMATIC_PREPARATION (Will be created automatically on mode=rdp)" } else { "VERIFIED/REUSED" }))

              if ($S) {
                  $f59Text = if ($needF59Build) { ('🟡 **PENDING AUTOMATIC PREPARATION** ({0} හිදී ස්වයංක්‍රීයව සකසනු ලැබේ)' -f '`mode=rdp`') } else { '🟢 **VERIFIED / REUSED**' }
                  $uiText  = if ($needUiBuild)  { ('🟡 **PENDING AUTOMATIC PREPARATION** ({0} හිදී ස්වයංක්‍රීයව සකසනු ලැබේ)' -f '`mode=rdp`') } else { '🟢 **VERIFIED / REUSED**' }

                  '### ✅ Configuration Validated (Mode: readiness)' | Add-Content -LiteralPath $S -Encoding utf8
                  'සියලුම Configuration Secrets සහ Local Dependency Contracts සාර්ථකව පරීක්ෂා කරන ලදී.' | Add-Content -LiteralPath $S -Encoding utf8
                  '' | Add-Content -LiteralPath $S -Encoding utf8
                  '**Dependency Readiness Status:**' | Add-Content -LiteralPath $S -Encoding utf8
                  ('- Prebuilt Binaries (`prebuilt-binaries`): {0}' -f $f59Text) | Add-Content -LiteralPath $S -Encoding utf8
                  ('- Web UI Bundle (`ui-dist`): {0}' -f $uiText) | Add-Content -LiteralPath $S -Encoding utf8
                  '' | Add-Content -LiteralPath $S -Encoding utf8
                  'RDP Session එක ආරම්භ කිරීම සඳහා `mode=rdp` තෝරාගෙන Workflow එක Run කරන්න. අවශ්‍ය Dependencies ස්වයංක්‍රීයව සූදානම් කෙරේ.' | Add-Content -LiteralPath $S -Encoding utf8
              }
          } else {
              Write-Host "CONFIGURATION_PRESENT: All required secrets and local manifest files found."
              Write-Host "Dependencies state: need_f59_build=$needF59Build, need_ui_build=$needUiBuild"
              if ($S) {
                  "### ⚙️ Preflight Configuration Check Passed (Mode: rdp)" | Add-Content -Path $S
                  "අත්‍යවශ්‍ය Configuration Secrets සහ Local Manifests වලංගු වේ." | Add-Content -Path $S
                  "- Prebuilt Binaries: " + $(if ($needF59Build) { "PREPARING (Automatic build scheduled)" } else { "REUSED" }) | Add-Content -Path $S
                  "- Web UI Bundle: " + $(if ($needUiBuild) { "PREPARING (Automatic build scheduled)" } else { "REUSED" }) | Add-Content -Path $S
              }
          }

          if ($env:GITHUB_OUTPUT) {
              "need_f59_build=$($needF59Build.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT
              "need_ui_build=$($needUiBuild.ToString().ToLower())" | Add-Content -Path $env:GITHUB_OUTPUT
              "f59_status=$f59Status" | Add-Content -Path $env:GITHUB_OUTPUT
              "ui_status=$uiStatus" | Add-Content -Path $env:GITHUB_OUTPUT
          }

      - name: Readiness Only Mode Exit
        if: github.event.inputs.mode == 'readiness' || github.event.inputs.mode == ''
        shell: pwsh
        run: |
          $S = $env:GITHUB_STEP_SUMMARY
          Write-Host "::notice::Readiness check complete. Stopping here as mode=readiness."
          if ($S) {
             "### 🛑 Readiness Check Complete" | Add-Content -Path $S
             "වින්‍යාසකරණ (Configuration) දත්ත සාර්ථකව පරීක්ෂා කරන ලදී." | Add-Content -Path $S
             "RDP Session එක ආරම්භ කිරීම සඳහා `mode=rdp` ලෙස තෝරාගෙන නැවත Workflow එක ක්‍රියාත්මක කරන්න." | Add-Content -Path $S
          }

  ensure-f59-binaries-call:
    needs: [preflight]
    if: ${{ !cancelled() && github.event.inputs.mode == 'rdp' && needs.preflight.outputs.need_f59_build == 'true' }}
    uses: ./.github/workflows/f59-prebuilt-binaries.yml
    secrets: inherit

  ensure-f59-binaries:
    needs: [preflight, ensure-f59-binaries-call]
    if: >-
      ${{
        !cancelled() &&
        github.event.inputs.mode == 'rdp' &&
        needs.preflight.result == 'success' &&
        (needs.ensure-f59-binaries-call.result == 'success' || needs.ensure-f59-binaries-call.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    outputs:
      f59_status: ${{ steps.f59-check.outputs.f59_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify F59 Prebuilt Binaries Availability
        id: f59-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEED_BUILD: ${{ needs.preflight.outputs.need_f59_build }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content -LiteralPath 'payloads/f59-prebuilt-pins.json' -Raw | ConvertFrom-Json
          $tag = [string]$pins.release_tag
          $repo = $env:GITHUB_REPOSITORY
          $relJson = gh release view $tag -R $repo --json assets 2>&1
          if ($LASTEXITCODE -ne 0) {
              throw "F59 prebuilt binaries release $tag is missing after preparation step."
          }
          $relObj = $relJson | ConvertFrom-Json
          $assetNames = @($relObj.assets | ForEach-Object { [string]$_.name })
          $needAssets = @([string]$pins.checksums_asset, [string]$pins.assets.aria2c.name, [string]$pins.assets.qbittorrent.name)
          foreach ($na in $needAssets) {
              if ($assetNames -notcontains $na) {
                  throw "F59 prebuilt binary asset $na is missing from release $tag after preparation step."
              }
          }
          $status = if ($env:NEED_BUILD -eq 'true') { 'CREATED' } else { 'REUSED' }
          Write-Host "F59 prebuilt binaries verified. Status: $status"
          if ($env:GITHUB_OUTPUT) { "f59_status=$status" | Add-Content -Path $env:GITHUB_OUTPUT }

  build-ui-via-call:
    needs: [preflight]
    if: ${{ !cancelled() && github.event.inputs.mode == 'rdp' && needs.preflight.outputs.need_ui_build == 'true' }}
    uses: ./.github/workflows/build-ui.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}

  build-ui:
    needs: [preflight, build-ui-via-call]
    if: >-
      ${{
        !cancelled() &&
        github.event.inputs.mode == 'rdp' &&
        needs.preflight.result == 'success' &&
        (needs.build-ui-via-call.result == 'success' || needs.build-ui-via-call.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ui_status: ${{ steps.ui-prebuilt.outputs.ui_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/cache@v4
        name: F59 UI fallback cache (pnpm store + node_modules)
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
          key: f59-ui-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json') }}
          restore-keys: |
            f59-ui-${{ runner.os }}-
      - name: Download prebuilt UI bundle (F59 release asset, SHA-256 verified)
        id: ui-prebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEED_BUILD: ${{ needs.preflight.outputs.need_ui_build }}
        run: |
          set -euo pipefail
          asset="ui-dist-${GITHUB_SHA}.zip"
          mkdir -p "$RUNNER_TEMP/ui-dl"
          hit=0
          if gh release download ui-dist --pattern "$asset" --pattern "${asset}.sha256" --dir "$RUNNER_TEMP/ui-dl" --clobber 2>/dev/null; then hit=1; fi
          if [ "$hit" -ne 1 ]; then
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&workflow=build-ui.yml" --jq '.workflow_runs[0].id' 2>/dev/null || true)
            echo "[F92 ui-prebuilt] ${asset} absent despite build-ui-via-call (run for this sha = ${run_id:-none}) - falling back to the labeled on-runner build."
            echo "::error::[F77 ui-prebuilt] ui-dist-<sha>.zip not published for ${GITHUB_SHA} after 180s; dispatch build-ui.yml manually and re-run main.yml. Falling back to an on-runner build of this exact sha (never a different sha's bundle)."
            echo 'hit=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$RUNNER_TEMP/ui-dl/${asset}.sha256"
          echo "hit=true" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/ui-dl"
          node "$GITHUB_WORKSPACE/scripts/f59-verify-sha256.mjs" "$asset" "$(tr -d '[:space:]' < "${asset}.sha256")" --label "$asset"
          unzip -o -q "$asset" -d out
          test -f out/index.html
          mkdir -p "$GITHUB_WORKSPACE/ui/dist"
          cp out/index.html "$GITHUB_WORKSPACE/ui/dist/index.html"
          LEN=$(wc -c < "$GITHUB_WORKSPACE/ui/dist/index.html")
          if [ "$LEN" -le 51200 ]; then echo "ui-v2.html staging failed - prebuilt bundle too small ($LEN bytes)"; exit 1; fi
          node "$GITHUB_WORKSPACE/scripts/check-regression-ids.mjs"
          node "$GITHUB_WORKSPACE/scripts/check-no-neon-green.mjs" "$GITHUB_WORKSPACE/ui/dist/index.html"
          node "$GITHUB_WORKSPACE/scripts/check-bottom-bar-time.mjs"
          echo "[F59 ui-prebuilt] hit sha256-verified ${asset} bytes=$LEN"
          if [ "${NEED_BUILD:-false}" = "true" ]; then
            echo "ui_status=CREATED" >> "$GITHUB_OUTPUT"
          else
            echo "ui_status=REUSED" >> "$GITHUB_OUTPUT"
          fi
      - name: Build v2 single-file bundle (F59 fallback - asset miss only)
        if: steps.ui-prebuilt.outputs.hit != 'true'
        run: |
          set -euo pipefail
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          export VITE_BUILD_SHA="${GITHUB_SHA}"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          test -f ui/dist/index.html
          node "$GITHUB_WORKSPACE/scripts/check-regression-ids.mjs"
          node "$GITHUB_WORKSPACE/scripts/check-fx-ids.mjs"
          node "$GITHUB_WORKSPACE/scripts/check-no-neon-green.mjs" ui/dist/index.html
          node "$GITHUB_WORKSPACE/scripts/check-bottom-bar-time.mjs"
          LEN=$(wc -c < ui/dist/index.html)
          echo "[F43] build-ui artifact bytes=$LEN (F59 fallback path)"
          if [ "$LEN" -le 51200 ]; then echo "ui-v2.html staging failed - build artifact missing"; exit 1; fi
          echo "ui_status=CREATED" >> "$GITHUB_OUTPUT"
      - name: Upload dist-ui
        uses: actions/upload-artifact@v4
        with:
          name: dist-ui
          path: ui/dist/index.html
          retention-days: 1
          if-no-files-found: error

  verify-dependencies:
    name: Verify Dependencies & Authorize Launch
    needs: [preflight, ensure-f59-binaries, build-ui]
    if: >-
      ${{
        !cancelled() &&
        github.event.inputs.mode == 'rdp' &&
        needs.preflight.result == 'success' &&
        needs.ensure-f59-binaries.result == 'success' &&
        needs.build-ui.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify All Dependencies and Publish Summary
        shell: pwsh
        env:
          F59_STATUS: ${{ needs.ensure-f59-binaries.outputs.f59_status || 'VERIFIED' }}
          UI_STATUS: ${{ needs.build-ui.outputs.ui_status || 'VERIFIED' }}
        run: |
          $S = $env:GITHUB_STEP_SUMMARY
          Write-Host "ALL REQUIRED DEPENDENCIES VERIFIED:"
          Write-Host "- Prebuilt Binaries: $env:F59_STATUS"
          Write-Host "- Web UI Bundle: $env:UI_STATUS"

          if ($S) {
              '### 🚀 RDP Launch Dependencies Orchestrated and Verified' | Add-Content -LiteralPath $S -Encoding utf8
              '' | Add-Content -LiteralPath $S -Encoding utf8
              '| Dependency | Status | Outcome |' | Add-Content -LiteralPath $S -Encoding utf8
              '| --- | --- | --- |' | Add-Content -LiteralPath $S -Encoding utf8
              ('| Prebuilt Binaries (`prebuilt-binaries`) | VERIFIED | **{0}** |' -f $env:F59_STATUS) | Add-Content -LiteralPath $S -Encoding utf8
              ('| Web UI Bundle (`ui-dist`) | VERIFIED | **{0}** |' -f $env:UI_STATUS) | Add-Content -LiteralPath $S -Encoding utf8
              '' | Add-Content -LiteralPath $S -Encoding utf8
              'RDP පරිසරය සූදානම් කිරීම සහ සේවාවන් ආරම්භ කිරීම සඳහා අනුමැතිය ලබා දෙන ලදී.' | Add-Content -LiteralPath $S -Encoding utf8
          }

  rdp:
    needs: [preflight, ensure-f59-binaries, build-ui, verify-dependencies]
    if: >-
      ${{
        !cancelled() &&
        github.event.inputs.mode == 'rdp' &&
        needs.preflight.result == 'success' &&
        needs.verify-dependencies.result == 'success' &&
        needs.build-ui.result == 'success' &&
        needs.ensure-f59-binaries.result == 'success'
      }}
    runs-on: ${{ github.event.inputs.runner_target || 'windows-latest' }}
    timeout-minutes: 357
    env:
      GHRDP_EPHEMERAL: 'true'
      ENCRYPT_MODE: ${{ github.event.inputs.encrypt_mode || 'none' }}
      # [F47 §1] the per-run opt-in as a string; the stage step is the only
      # consumer and it still only ever compares MIRROR_INPUT to 'true'
      # ([F59] the DISPATCH DEFAULT is now true; the comparison is unchanged).
      MIRROR_INPUT: ${{ github.event.inputs.mirror_enable == true && 'true' || 'false' }}
      MIRROR_ENCRYPT_INPUT: ${{ github.event.inputs.mirror_encrypt == true && 'true' || 'false' }}
      # [F59 §1] the plaintext election is the DEFAULT now: ONLY an explicit
      # mirror_encrypt=true keeps the encrypted lane. false/omitted means
      # PLAINTEXT MODE with the visible banner. The auto-path encryption floor
      # (Downloads auto-upload + runtime opt-in) is enforced in the stage/watcher
      # code and is NOT derived from this flag.
      MIRROR_PLAINTEXT_ELECTED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mirror_encrypt != 'true' && 'true' || 'false' }}
      SEARCH_INPUT: ${{ github.event.inputs.search_enable == true && 'true' || 'false' }}
      RENTRY_MAIN_URL: 'https://rentry.co/myurl0'
      RENTRY_MAIN_EDIT: ''
      RUN_STARTED_AT: ''
      # [F9b] opt-in MagicDNS auto-enable: empty unless the user sets both
      # secrets; the gates then POST /dns/preferences before halting.
      TS_API_TOKEN: ${{ secrets.TS_API_TOKEN }}
      TS_TAILNET_NAME: ${{ secrets.TS_TAILNET_NAME }}

    steps:
      # [F31c §1] FIRST step. A dead push credential fails HERE, before checkout
      # or any Tailscale/RDP setup. The runner has no repo yet, so the dry-run
      # uses a throwaway clone in RUNNER_TEMP (never the workspace, never a
      # --global git config). The token is never printed; git output is
      # redacted before it can reach the log. Nonzero is exit 1 - no bypass.
      - name: GitHub Token Diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ref = '${{ github.ref }}'
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = [string]$env:GITHUB_REF }
          $ask = Join-Path $env:RUNNER_TEMP 'f31c-askpass.cmd'
          if (-not (Test-Path -LiteralPath '.git')) {
            $repo = [string]$env:GITHUB_REPOSITORY
            $tok = [string]$env:GITHUB_TOKEN
            if (-not $tok) { $tok = [string]$env:GH_TOKEN }
            $probe = Join-Path $env:RUNNER_TEMP 'f31c-push-probe'
            if (Test-Path -LiteralPath $probe) { Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Path $probe -Force | Out-Null
            @('@echo off','echo %~1 | findstr /I "Username" >nul','if %ERRORLEVEL%==0 (echo x-access-token) else (echo %GITHUB_TOKEN%)') | Set-Content -LiteralPath $ask -Encoding ascii
            $env:GIT_ASKPASS = $ask
            $env:GIT_TERMINAL_PROMPT = '0'
            $env:GCM_INTERACTIVE = 'Never'
            $emptyCfg = Join-Path $env:RUNNER_TEMP 'f31c-empty-gitconfig'
            Set-Content -LiteralPath $emptyCfg -Value '' -Encoding ascii
            $env:GIT_CONFIG_GLOBAL = $emptyCfg
            $env:GIT_CONFIG_NOSYSTEM = '1'
            Push-Location $probe
            $bootOk = $true
            $bootErr = ''
            & git init -q
            if ($LASTEXITCODE -ne 0) { $bootOk = $false; $bootErr = 'git init failed' }
            if ($bootOk) {
              if (-not $repo -or -not $tok) { $bootOk = $false; $bootErr = 'missing GITHUB_TOKEN or GITHUB_REPOSITORY' }
              else {
                & git remote add origin ("https://github.com/" + $repo + ".git")
                $fetched = $false
                for ($i = 1; $i -le 3 -and -not $fetched; $i++) {
                  & git -c credential.helper= fetch --depth=1 origin $ref
                  if ($LASTEXITCODE -eq 0) { $fetched = $true } else { Start-Sleep -Seconds (2 * $i) }
                }
                if (-not $fetched) { $bootOk = $false; $bootErr = 'git fetch failed (push credential rejected or unreachable)' }
                else {
                  $branch = ($ref -replace '^refs/heads/','')
                  if ($branch -eq $ref) { $branch = 'f31c-probe' }
                  & git checkout -B $branch FETCH_HEAD
                  if ($LASTEXITCODE -ne 0) { $bootOk = $false; $bootErr = 'git checkout of fetched ref failed' }
                  elseif ($ref -like 'refs/heads/*') { & git update-ref $ref HEAD }
                }
              }
            }
            if (-not $bootOk) {
              Pop-Location
              Remove-Item -LiteralPath $ask -Force -ErrorAction SilentlyContinue
              $result = [regex]::Replace([string]$bootErr, '(ghp_|gho_|ghu_|ghs_|ghr_|github_pat_|tskey-)[A-Za-z0-9_\-]+', '[redacted]')
              Write-Host "Testing git push access..."
              Write-Host "::error::git push failed: $result"
              Write-Host "User must: (1) Arena Settings -> GitHub Integration -> Reconnect, OR"
              Write-Host "(2) Windows Credential Manager -> git:github.com -> Remove, then git push (browser auth)"
              exit 1
            }
          }
          # [F31c §1 token-diag-begin]
          Write-Host "Testing git push access..."
          $result = git push --dry-run origin ${{ github.ref }} 2>&1
          if ($LASTEXITCODE -ne 0) {
            $result = [regex]::Replace([string]$result, '(ghp_|gho_|ghu_|ghs_|ghr_|github_pat_|tskey-)[A-Za-z0-9_\-]+', '[redacted]')
            if ($ask -and (Test-Path -LiteralPath $ask)) { Remove-Item -LiteralPath $ask -Force -ErrorAction SilentlyContinue }
            Write-Host "::error::git push failed: $result"
            Write-Host "User must: (1) Arena Settings -> GitHub Integration -> Reconnect, OR"
            Write-Host "(2) Windows Credential Manager -> git:github.com -> Remove, then git push (browser auth)"
            exit 1
          }
          Write-Host "✅ git push access confirmed"
          if ($ask -and (Test-Path -LiteralPath $ask)) { Remove-Item -LiteralPath $ask -Force -ErrorAction SilentlyContinue }
          # [F31c §1 token-diag-end]
          if ((Get-Location).Path -ne $env:GITHUB_WORKSPACE) { Pop-Location }

      - name: Checkout repo (payloads)
        uses: actions/checkout@v4
        with:
          # [F59 §2] shallow checkout: nothing on this path needs history.
          fetch-depth: 1

      - name: Auto-deploy Web UI, Worker, and Status Logic (Zero-Touch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Publish-GitHubFile {
              param([string]$RelPath, [string]$Content, [string]$Msg)
              $repo = $env:GITHUB_REPOSITORY
              $api = "https://api.github.com/repos/$repo/contents/$RelPath"
              $H = @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'ghrdp-runner' }
              $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($Content))
              $sha = $null
              try { $g = Invoke-RestMethod -Uri ($api + '?ref=main') -Headers $H -ErrorAction Stop; $sha = $g.sha } catch { }
              # [F10-4c §5] skip the Pages-affecting PUT entirely when the
              # remote docs content is byte-identical (no commit => no Pages
              # rebuild for unchanged docs).
              if ($sha -and $g.PSObject.Properties['content']) {
                  try {
                      $remote = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($g.content -replace "`n",'')))
                      if ($remote -eq $Content) { Write-Host "[deploy] Unchanged ${RelPath} - skipped (no Pages redeploy)"; return }
                  } catch { }
              }
              $body = @{ message = ($Msg + ' ' + (Get-Date -Format o)); content = $b64; branch = 'main' }
              if ($sha) { $body.sha = $sha }
              try {
                  Invoke-RestMethod -Uri $api -Headers $H -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null
                  Write-Host "[deploy] Committed $RelPath"
              } catch { Write-Host "[deploy] Failed to commit ${RelPath}: $($_.Exception.Message)" }
          }
          $statusObj = [ordered]@{
              ts = (Get-Date -Format o)
              runId = [string]$env:GITHUB_RUN_ID
              runUrl = ('https://github.com/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID)
              runStatus = 'in_progress'
              runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
              startedAt = (Get-Date -Format o)
              sessionStartedAt = ''
              watcherAlive = $false
              speedBps = 0
              overallPct = 0.0
              filesDone = 0
              filesTotal = 0
              missionControlUrl = ''
              tailnetUrl = ''
              rustUrl = ''
              funnelUrl = ''
              mirrorKey = ''
              legacyKey = ''
              telegraphUrl = ''
              rentryNewUrl = ''
              egressIp = ''
              encryptMode = 'none'
              files = @()
              logTail = @()
              history = @()
              runnerIp = ''
              epoch = (Get-Date).ToUniversalTime().ToString('o')
              serverPort = 7331
          }
          Publish-GitHubFile -RelPath 'docs/status.json' -Content ($statusObj | ConvertTo-Json -Depth 20 -Compress) -Msg 'chore: initial status.json [skip ci]'
          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine('function Publish-StatusToGhPages {')
          [void]$sb.AppendLine('    param([string]$JsonText)')
          [void]$sb.AppendLine('    $sf = (Join-Path $env:RUNNER_TEMP ("ghrdp-m8-terminal-" + [string]$env:GITHUB_RUN_ID + ".json"))')
          [void]$sb.AppendLine('    if ([string]$env:GITHUB_RUN_ID -and (Test-Path -LiteralPath $sf)) { Write-Host "[status] terminal sentinel present for run $([string]$env:GITHUB_RUN_ID) - late publish suppressed (M8 finalized)"; return }')
          [void]$sb.AppendLine('    $repo = $env:GITHUB_REPOSITORY')
          [void]$sb.AppendLine('    $token = ""')
          [void]$sb.AppendLine('    try { $token = ([System.IO.File]::ReadAllText("C:\ghrdp\gh-pages-token.txt")).Trim() } catch { }')
          [void]$sb.AppendLine('    if (-not $token) { try { $token = [string]$env:GITHUB_TOKEN } catch { } }')
          [void]$sb.AppendLine('    if (-not $token) { return }')
          [void]$sb.AppendLine('    $api = "https://api.github.com/repos/$repo/contents/docs/status.json"')
          [void]$sb.AppendLine('    $H = @{ Authorization = ("Bearer " + $token); Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28"; "User-Agent" = "ghrdp-runner" }')
          [void]$sb.AppendLine('    $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($JsonText))')
          [void]$sb.AppendLine('    $sha = $null')
          [void]$sb.AppendLine('    try { $g = Invoke-RestMethod -Uri ($api + "?ref=main") -Headers $H -ErrorAction Stop; $sha = $g.sha } catch { }')
          [void]$sb.AppendLine('    $body = @{ message = ("status update " + (Get-Date -Format o)); content = $b64; branch = "main" }')
          [void]$sb.AppendLine('    if ($sha) { $body.sha = $sha }')
          [void]$sb.AppendLine('    for ($attempt = 1; $attempt -le 3; $attempt++) {')
          [void]$sb.AppendLine('        try {')
          [void]$sb.AppendLine('            Invoke-RestMethod -Uri $api -Headers $H -Method Put -ContentType "application/json" -Body ($body | ConvertTo-Json -Compress) -ErrorAction Stop | Out-Null')
          [void]$sb.AppendLine('            return')
          [void]$sb.AppendLine('        } catch {')
          [void]$sb.AppendLine('            if ($attempt -lt 3) { Start-Sleep -Seconds (2 * $attempt) }')
          [void]$sb.AppendLine('        }')
          [void]$sb.AppendLine('    }')
          [void]$sb.AppendLine('}')
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'publish-status.ps1'), $sb.ToString(), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host '[deploy] publish-status.ps1 helper saved to RUNNER_TEMP'
          Write-Host '[deploy] auto-deploy complete'
          exit 0

      # [F10-4c §5] setup-phase caches: TightVNC MSI, noVNC tree, pip wheel
      # cache (websockify/vncdotool), cargo target (Rust dash). Keep-alive is
      # untouched. One composite key; Cargo.toml changes bust the whole set by
      # design (simple, conservative). First run warms the caches; subsequent
      # dispatches skip ~1-2 min of downloads/compiles.
      - uses: actions/cache@v4
        name: Setup-phase caches (F10-4c)
        with:
          path: |
            C:\ghrdp\cache
            C:\ghrdp\novnc
            ~\AppData\Local\pip\Cache
            ${{ runner.temp }}\ghrdp-rust\target
          key: f10-setup-${{ runner.os }}-${{ hashFiles('payloads/Cargo.toml') }}-v1
          restore-keys: |
            f10-setup-${{ runner.os }}-
      # [F59 §2] PREBUILT BINARY CACHE (separate from the F10-4c setup cache):
      # the aria2c/qBittorrent release assets are downloaded + SHA-256 verified on
      # the first dispatch per pin revision and restored from here afterwards.
      # The key includes the pin file hash, so any pin change busts the cache.
      - uses: actions/cache@v4
        name: F59 prebuilt binary cache (SHA-256 pinned assets)
        with:
          path: C:\ghrdp\prebuilt
          key: f59-prebuilt-${{ runner.os }}-${{ hashFiles('payloads/f59-prebuilt-pins.json') }}
      - name: Record job start + pre-create cache directories (F10-4c/F11-6)
        shell: pwsh
        run: |
          # [F11-6 §6] merged with the cache-dir prep (one fewer runner step).
          $startedAt = (Get-Date).ToUniversalTime().ToString('o')
          Add-Content -Path $env:GITHUB_ENV -Value ("JOB_STARTED_AT=" + $startedAt)
          Write-Host ('[init] job started at ' + $startedAt)
          New-Item -ItemType Directory -Path 'C:\ghrdp\cache' -Force | Out-Null
          New-Item -ItemType Directory -Path 'C:\ghrdp\novnc' -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:LOCALAPPDATA\pip\Cache" -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'ghrdp-rust\target') -Force | Out-Null
          Write-Host '[cache] setup-phase cache dirs ensured'
      - name: Validate required secret (RENTRY_EDIT_PASSWORD) - fail fast, NO bypass
        env:
          RENTRY_EDIT_PASSWORD: ${{ secrets.RENTRY_EDIT_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $mirrorOn = ($env:MIRROR_INPUT -eq 'true')
          $secret = [string]$env:RENTRY_EDIT_PASSWORD
          $link = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/settings/secrets/actions/new'
          if ($mirrorOn -and -not $secret) {
              Write-Host '============================================================'
              Write-Host '  MISSING REQUIRED SECRET: RENTRY_EDIT_PASSWORD'
              Write-Host ('  Add it here: ' + $link)
              Write-Host '    Name  : RENTRY_EDIT_PASSWORD'
              Write-Host '    Value : the edit code of https://rentry.co/myurl0'
              Write-Host '  Mirror is ENABLED but the secret is missing.'
              Write-Host '  NO BYPASS: refusing to publish Rentry anonymously. Failing now.'
              Write-Host '============================================================'
              Write-Host '[validate] RENTRY_EDIT_PASSWORD not set - OK (myurl0 is frozen; github.io is the primary index).'
          }
          # [F48 §0] token-less guest mode: the mirror needs NO secret at all -
          # a missing credential is the NORMAL state, never a warning or halt.
          if ($env:MIRROR_INPUT -eq 'true') {
              Write-Host '[validate] F48 mirror opt-in ON for this run: token-less guest mode (no secret read, no auth header).'
          } else {
              Write-Host '[validate] F48/F59 mirror opt-in OFF for this run (mirror_enable=false was dispatched; the F59 dispatch default is ON).'
          }
          if (-not $mirrorOn) {
              Write-Host '[validate] mirror is OFF this run - RENTRY_EDIT_PASSWORD not required.'
          } else {
              Write-Host '[validate] RENTRY_EDIT_PASSWORD present - myurl0 will be edited with it (append-only, no bypass).'
          }
          exit 0

      # [F59 §2] PARALLEL PRE-WARM. Three independent jobs run as background
      # PowerShell jobs INSIDE this one step (cross-step Start-Job is impossible:
      # every step is its own process) and the step Wait-Jobs before returning,
      # so the dispatch pays the SLOWEST leg instead of the sum:
      #   1. Tailscale MSI download (the same retry ladder as before),
      #   2. the SHA-256-pinned PREBUILT BINARIES (aria2c + qBittorrent) from the
      #      prebuilt-binaries release - F59 §2: no Chocolatey anywhere, and every
      #      byte is verified against payloads/f59-prebuilt-pins.json AND the
      #      release checksums.txt before it is staged or executed (FAIL-CLOSED),
      #   3. the PowerShell server pre-parse warm (parser load, not execution).
      # Timings -> C:\ghrdp\startup-timing.jsonl (F59 §3).
      - name: F59 parallel pre-warm (Tailscale MSI + prebuilt binaries + PS parse)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory -Path 'C:\ghrdp' -Force | Out-Null
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-timing.ps1')
          $swAll = Start-F59Step

          $msiJob = Start-Job -ArgumentList $env:GITHUB_WORKSPACE -ScriptBlock {
              Set-Location $args[0]
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
              $out = 'tailscale-setup.msi'
              $ok = $false
              for ($a = 1; $a -le 4; $a++) {
                  Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
                  & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
                  $LASTEXITCODE = 0
                  if ((Test-Path $out) -and ((Get-Item $out).Length -gt 1000000)) {
                      $ok = $true
                      Write-Host ('[ts] downloaded via curl, attempt {0}, size={1}' -f $a, (Get-Item $out).Length)
                      break
                  }
                  Write-Host ('[ts] curl attempt {0} failed; retrying' -f $a)
                  Start-Sleep -Seconds (3 * $a)
              }
              if (-not $ok) {
                  for ($a = 1; $a -le 3; $a++) {
                      try {
                          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 300 -ErrorAction Stop
                          if ((Test-Path $out) -and ((Get-Item $out).Length -gt 1000000)) {
                              $ok = $true
                              Write-Host ('[ts] downloaded via Invoke-WebRequest, attempt {0}' -f $a)
                              break
                          }
                      } catch {
                          Write-Host ('[ts] Invoke-WebRequest attempt {0} failed: {1}' -f $a, $_.Exception.Message)
                      }
                      Start-Sleep -Seconds (3 * $a)
                  }
              }
              if (-not $ok) { throw 'Could not download the Tailscale MSI after retries. Re-run the workflow.' }
              return @{ sw = 'tailscale-msi-download'; bytes = (Get-Item -LiteralPath $out).Length }
          }

          # [F59 §2] the verification functions live in the SHIPPED module
          # payloads/f59-prebuilt-verify.ps1 (single source - dot-sourced here AND
          # inside the background job, which is a separate process).
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-prebuilt-verify.ps1')

          $binJob = Start-Job -ArgumentList $env:GITHUB_WORKSPACE -ScriptBlock {
              $ws = $args[0]
              $ErrorActionPreference = 'Stop'
              . (Join-Path $ws 'payloads/f59-prebuilt-verify.ps1')
              $pins = Get-Content -LiteralPath (Join-Path $ws 'payloads/f59-prebuilt-pins.json') -Raw | ConvertFrom-Json
              $tag = [string]$pins.release_tag
              $cacheDir = 'C:\ghrdp\prebuilt'
              $binDir = 'C:\ghrdp\bin'
              New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
              New-Item -ItemType Directory -Path $binDir -Force | Out-Null
              $tmp = Join-Path $env:RUNNER_TEMP 'f59-prebuilt-dl'
              if (Test-Path -LiteralPath $tmp) { Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue }
              New-Item -ItemType Directory -Path $tmp -Force | Out-Null
              $ck = Join-Path $tmp ([string]$pins.checksums_asset)
              $need = @()
              foreach ($p in @($pins.assets.PSObject.Properties)) {
                  $name = [string]$p.Value.name
                  if (-not (Test-Path -LiteralPath (Join-Path $cacheDir $name))) { $need += $name }
              }
              if ($need.Count -gt 0) {
                  $repo = $env:GITHUB_REPOSITORY
                  gh release download $tag -R $repo --pattern ([string]$pins.checksums_asset) --dir $tmp --clobber | Out-Null
                  foreach ($n in $need) { gh release download $tag -R $repo --pattern $n --dir $tmp --clobber | Out-Null }
                  if ($LASTEXITCODE -ne 0) { throw ('[F59 prebuilt] gh release download failed for ' + ($need -join ', ') + ' (release ' + $tag + ') - assets must be published by f59-prebuilt-binaries.yml') }
                  if (-not (Test-Path -LiteralPath $ck)) { throw ('[F59 prebuilt] release ' + $tag + ' did not deliver ' + [string]$pins.checksums_asset) }
                  foreach ($p in @($pins.assets.PSObject.Properties)) {
                      $name = [string]$p.Value.name
                      $src = Join-Path $tmp $name
                      if (-not (Test-Path -LiteralPath $src)) { continue }
                      $sha = Test-F59AssetSha256 -Path $src -Expected ([string]$p.Value.sha256) -Label $name
                      $null = Test-F59ChecksumsLine -ChecksumsPath $ck -AssetName $name -Expected $sha
                      Copy-Item -LiteralPath $src -Destination (Join-Path $cacheDir $name) -Force
                  }
              } else {
                  Write-Host '[F59 prebuilt] all assets restored from the F59 prebuilt cache'
              }
              # Stage the verified bytes: aria2c.exe -> C:\ghrdp\bin, the
              # qBittorrent zip -> C:\Program Files\qBittorrent (the resolver's root).
              $aria = [string]$pins.assets.aria2c.name
              Test-F59AssetSha256 -Path (Join-Path $cacheDir $aria) -Expected ([string]$pins.assets.aria2c.sha256) -Label $aria | Out-Null
              Copy-Item -LiteralPath (Join-Path $cacheDir $aria) -Destination (Join-Path $binDir 'aria2c.exe') -Force
              $qbt = [string]$pins.assets.qbittorrent.name
              Test-F59AssetSha256 -Path (Join-Path $cacheDir $qbt) -Expected ([string]$pins.assets.qbittorrent.sha256) -Label $qbt | Out-Null
              $qdir = Join-Path $env:ProgramFiles 'qBittorrent'
              New-Item -ItemType Directory -Path $qdir -Force | Out-Null
              Expand-Archive -LiteralPath (Join-Path $cacheDir $qbt) -DestinationPath $qdir -Force
              $qexe = Get-ChildItem -LiteralPath $qdir -Recurse -Include 'qbittorrent-nox.exe', 'qbittorrent.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $qexe) { throw '[F59 prebuilt] qBittorrent binary missing after extracting the verified zip' }
              Write-Host ('[F59 prebuilt] staged aria2c.exe + ' + $qexe.FullName + ' from verified release assets (cache ' + $cacheDir + ')')
              return @{ sw = 'prebuilt-binaries'; staged = @('aria2c.exe', $qexe.Name); cacheHit = ($need.Count -eq 0) }
          }

          $psJob = Start-Job -ArgumentList $env:GITHUB_WORKSPACE -ScriptBlock {
              $ws = $args[0]
              $files = @('payloads/ghrdp-lib.ps1', 'payloads/ghrdp-server.ps1', 'payloads/ghrdp-watcher.ps1', 'payloads/ghrdp-mirror.ps1', 'payloads/ghrdp-qbt.ps1', 'payloads/ghrdp-aria2.ps1')
              $errs = 0
              foreach ($f in $files) {
                  $p = Join-Path $ws $f
                  if (-not (Test-Path -LiteralPath $p)) { continue }
                  $tokens = $null
                  $parseErrs = $null
                  [System.Management.Automation.Language.Parser]::ParseFile($p, [ref]$tokens, [ref]$parseErrs) | Out-Null
                  if ($parseErrs) { $errs += @($parseErrs).Count; Write-Host ('[F59 prewarm] parse errors in ' + $f + ': ' + @($parseErrs).Count) }
              }
              Write-Host ('[F59 prewarm] PowerShell pre-parse warm complete (files=' + $files.Count + ' errors=' + $errs + ')')
              return @{ sw = 'ps-parse-prewarm'; parseErrors = $errs }
          }

          # Leg 4 [F59 §2]: RDP cert-bind pre-warm - the certificate workdir and
          # its ACLs, the MachineKeys container directory, and the
          # root/cimv2/TerminalServices CIM class are prepared concurrently with
          # the downloads so the cert step only has to fetch and bind.
          $certJob = Start-Job -ScriptBlock {
              $workDir = 'C:\ghrdp\tls'
              New-Item -ItemType Directory -Path $workDir -Force | Out-Null
              & icacls.exe $workDir /inheritance:r 2>&1 | Out-Null
              & icacls.exe $workDir /grant:r 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' 'NETWORK SERVICE:(OI)(CI)R' 2>&1 | Out-Null
              $keyDir = Join-Path $env:ProgramData 'Microsoft\Crypto\RSA\MachineKeys'
              if (-not (Test-Path -LiteralPath $keyDir)) { New-Item -ItemType Directory -Path $keyDir -Force | Out-Null }
              try { Get-CimInstance -Namespace 'root/cimv2/TerminalServices' -ClassName 'Win32_TSGeneralSetting' -ErrorAction SilentlyContinue | Out-Null } catch { }
              Write-Host '[F59 prewarm] RDP cert-bind pre-warm complete (tls dir + ACLs + MachineKeys + TerminalServices CIM)'
              return @{ sw = 'rdp-cert-prewarm' }
          }

          $all = @($msiJob, $binJob, $psJob, $certJob)
          $null = Wait-Job -Job $all -Timeout 900
          $fail = @()
          foreach ($j in $all) {
              $name = 'job-' + $j.Id
              $leg = $name
              $r = $null
              if ($j.State -eq 'Completed' -or $j.State -eq 'Failed') {
                  try {
                      $r = Receive-Job -Job $j -ErrorAction Stop
                      $rr = @($r) | Where-Object { $_ -and ($_ -is [hashtable]) -and $_.sw } | Select-Object -First 1
                      if ($rr) { $leg = 'prewarm-' + [string]$rr.sw }
                  } catch { $fail += ($name + ': ' + $_.Exception.Message) }
              } else {
                  $fail += ($name + ': state=' + $j.State + ' (bounded 900s Wait-Job timeout)')
              }
              $sec = 0.0
              try { $sec = ($j.PSEndTime - $j.PSBeginTime).TotalSeconds } catch { }
              Add-F59Timing -Step $leg -Seconds $sec
              Write-Host ('[F59 prewarm] ' + $name + ' ' + $leg + ' state=' + $j.State + ' ' + [math]::Round($sec, 1) + 's')
          }
          $all | Stop-Job -ErrorAction SilentlyContinue
          $all | Remove-Job -Force -ErrorAction SilentlyContinue
          if ($fail.Count -gt 0) { throw ('[F59 prewarm] parallel leg failed - ' + ($fail -join ' | ')) }
          Add-Content -Path $env:GITHUB_ENV -Value 'GHRDP_F59_PREWARM=ready'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\ghrdp\bin'
          Stop-F59Step -Step 'prewarm-total' -Sw $swAll | Out-Null
          exit 0

      # [F92 §2.2] User-session server ownership. Registered HERE, before the
      # Tailscale install/sign-in bootstrap: the GHRDP-Server task runs the
      # dashboard as runneradmin LogonType Interactive with an ONLOGON trigger,
      # so it starts IN the session that owns the desktop (Session 1). That is
      # what retires the session-0 browser graveyard - and we also kick it
      # once now, since AtLogOn has already fired before this step ever ran.
      - name: F92 register user-session server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = 'C:\ProgramData\ghrdp'
          try {
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'payloads/ghrdp-server.ps1') -Destination (Join-Path $dest 'ghrdp-server.ps1') -Force
              if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'payloads/ghrdp-lib.ps1')) { Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'payloads/ghrdp-lib.ps1') -Destination (Join-Path $dest 'ghrdp-lib.ps1') -Force -ErrorAction SilentlyContinue }
              Write-Host '[f92] staged payloads/ghrdp-server.ps1 ->' $dest
          } catch { Write-Host ('[f92] stage failed: ' + $_.Exception.Message) }
          $user = 'runneradmin'
          try { if (-not (Get-LocalUser -Name $user -ErrorAction Stop)) { $user = $env:USERNAME } } catch { $user = $env:USERNAME }
          & (Join-Path $env:GITHUB_WORKSPACE 'payloads/register-ghrdp-task.ps1') -ServerPath (Join-Path $dest 'ghrdp-server.ps1') -TaskUser $user
          if ($LASTEXITCODE -ne 0) { Write-Host '[f92] register step non-zero - continuing (the SYSTEM fallback below still owns the dashboard)' }
          try { Start-ScheduledTask -TaskName 'GHRDP-Server' -ErrorAction Stop; Write-Host '[f92] GHRDP-Server kicked in the user session' } catch { Write-Host ('[f92] first kick skipped: ' + $_.Exception.Message) }
        timeout-minutes: 3

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-timing.ps1')
          $f59sw = Start-F59Step
          Start-Process msiexec.exe -Wait -WindowStyle Hidden -ArgumentList '/i', 'tailscale-setup.msi', '/quiet', '/norestart'
          # [F11-6 §6] EVENT WAIT instead of a fixed sleep: poll until the
          # Tailscale service is registered (bounded 30s), then continue.
          $svcSeen = $false
          for ($sw = 1; $sw -le 30; $sw++) {
              try { if (Get-Service -Name Tailscale -ErrorAction Stop) { $svcSeen = $true; break } } catch { }
              Start-Sleep -Seconds 1
          }
          Write-Host ('[ts] Tailscale MSI install finished (service registered=' + $svcSeen + ')')
          Stop-F59Step -Step 'tailscale-msi-install' -Sw $f59sw | Out-Null

          # [F98 §2.5 / P5] SUPPRESS TAILSCALE WELCOME DIALOG.
          # The Tailscale GUI shows "Connect to your tailnet devices" on first
          # launch, which distracts first-time users on the RDP desktop. Writing
          # the HideWelcomeDialog registry key BEFORE any user session starts
          # ensures the popup never appears.
          try {
              $tsRegPaths = @(
                  'HKLM:\SOFTWARE\Tailscale IPN',
                  'HKCU:\Software\Tailscale\IPN',
                  'HKLM:\SOFTWARE\WOW6432Node\Tailscale IPN'
              )
              foreach ($rp in $tsRegPaths) {
                  try {
                      New-Item -Path $rp -Force -ErrorAction SilentlyContinue | Out-Null
                      Set-ItemProperty -Path $rp -Name 'Unattended' -Value '' -Type String -Force -ErrorAction SilentlyContinue
                  } catch { }
              }
              Write-Host '[F98] Tailscale welcome dialog suppression keys written'
          } catch {
              Write-Host ('[F98] Tailscale welcome suppression failed: ' + $_.Exception.Message)
          }

          exit 0

      # [F9k] Fail-closed secrets framework. TS_AUTHKEY is REQUIRED: a missing
      # or rejected key HALTS the run here with a clickable admin-keys link and
      # numbered fix steps (::error:: + step summary + config.json tsReason).
      # There is NO interactive sign-in fallback anymore - the old silent
      # 'no sign-in link' throw is replaced by a classified, actionable halt.
      # The raw key is never printed: every emitted line passes the redactor.
      - name: Tailscale up (TS_AUTHKEY fail-closed, halt-with-link)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $S = $env:GITHUB_STEP_SUMMARY
          $keysUrl = 'https://login.tailscale.com/admin/settings/keys'
          # [F34-2] A control-plane fault is not a bad key, so it must not be sent to
          # the keys page: every class carries its OWN remediation link.
          $statusUrl = 'https://status.tailscale.com'
          # [F9k] Redactor: strips the injected secret VALUE(s) plus any
          # tskey-*/ghp_*/github_pat_* token shape from every printed line.
          function ConvertTo-Redacted([string]$Text) {
              $t = [string]$Text
              foreach ($v in @($env:TS_AUTHKEY, $env:VNC_PASS)) {
                  if ($v -and $v.Length -ge 4) { $t = $t.Replace($v, '<redacted>') }
              }
              $t = [regex]::Replace($t, 'tskey-[A-Za-z0-9][A-Za-z0-9\-]*', 'tskey-<redacted>')
              $t = [regex]::Replace($t, '(ghp_[A-Za-z0-9]{8,}|github_pat_[A-Za-z0-9_]{8,})', '<redacted>')
              return $t
          }
          # [F9k] Generic halt helper (reusable for TS_AUTHKEY / VNC_PASS /
          # TS_API_TOKEN): writes '::error::', a step-summary card with a
          # CLICKABLE admin link + numbered fix steps (+ optional redacted log
          # tail), stamps config.json tsReason/tsAuthAdminUrl, then throws.
          function Emit-SecretHalt([string]$What, [string]$AdminUrl, [string]$Reason, [string[]]$Steps, [string]$Detail = '') {
              Write-Host (ConvertTo-Redacted ('::error::' + $What + ' - ' + $Reason + '. Fix: ' + $AdminUrl))
              $md = @('### ' + $What + ' - halted by design', '', '**[' + $AdminUrl + '](' + $AdminUrl + ')**', '')
              for ($si = 0; $si -lt $Steps.Count; $si++) { $md += ((($si + 1) -as [string]) + '. ' + $Steps[$si]) }
              if ($Detail) { $md += @('', '```text', $Detail, '```') }
              foreach ($line in $md) {
                  $line = ConvertTo-Redacted $line
                  Write-Host ('[halt] ' + $line)
                  if ($S) { $line | Add-Content -Path $S }
              }
              try {
                  $cfgPathH = 'C:\ghrdp\config.json'
                  $encH = New-Object System.Text.UTF8Encoding($false)
                  $cfgH = $null
                  if (Test-Path -LiteralPath $cfgPathH) {
                      $cfgH = [System.IO.File]::ReadAllText($cfgPathH) | ConvertFrom-Json
                  } else {
                      New-Item -ItemType Directory -Path 'C:\ghrdp' -Force | Out-Null
                      $cfgH = [pscustomobject]@{}
                  }
                  $cfgH | Add-Member -NotePropertyName tsReason -NotePropertyValue $Reason -Force
                  $cfgH | Add-Member -NotePropertyName tsAuthAdminUrl -NotePropertyValue $AdminUrl -Force
                  [System.IO.File]::WriteAllText($cfgPathH, ($cfgH | ConvertTo-Json -Depth 10), $encH)
              } catch { Write-Host ('[halt] config.json stamp failed: ' + $_.Exception.Message) }
              throw (ConvertTo-Redacted ($What + ' (' + $Reason + ') - halted by design. Open ' + $AdminUrl))
          }

          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json -ErrorAction Stop
                  if ($j -and $j.BackendState) { $daemonOk = $true; break }
              } catch { }
              if ($i -eq 3) { Start-Service Tailscale -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw 'tailscaled did not start; check the Tailscale install step.' }
          $hostname = 'ghrdp-' + ([guid]::NewGuid().ToString('N').Substring(0, 6))

          # One fixed, numbered regeneration procedure reused by every halt
          # below (missing / invalid / ratelimited / unknown).
          $authSteps = @(
              ('Open the Tailscale admin keys page (link above): ' + $keysUrl)
              'Click "Generate auth key" with Reusable = ON and Expiry = 90 days'
              'Copy the generated tskey-auth-... value'
              'Set repo secret TS_AUTHKEY to that value (GitHub repo -> Settings -> Secrets and variables -> Actions: https://github.com/dekarita/supreme-lamp/settings/secrets/actions)'
              'Re-dispatch this workflow (Actions -> Windows RDP -> Run workflow)'
          )

          # [F9k] Missing key = halt by design. No interactive fallback.
          if (-not $env:TS_AUTHKEY) {
              Emit-SecretHalt 'TS_AUTHKEY missing' $keysUrl 'ts-authkey-missing' $authSteps
          }

          Write-Host '[ts] TS_AUTHKEY secret found - attempting automatic login (key value is never printed)'
          $upLog = Join-Path $env:RUNNER_TEMP 'ts-up.log'
          $upErr = Join-Path $env:RUNNER_TEMP 'ts-up.err'
          $ok = $false
          $tsIp = ''
          $stateRunning = $false
          # [F25] anchored CGNAT validator, same pattern as the webdesk ladder.
          $cgnat = '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.(\d{1,3})\.(\d{1,3})$'
          for ($attempt = 1; $attempt -le 2 -and -not $ok; $attempt++) {
              Remove-Item $upLog, $upErr -Force -ErrorAction SilentlyContinue
              Start-Process -FilePath $ts -ArgumentList @('up', ('--authkey=' + $env:TS_AUTHKEY), '--accept-dns=true', ('--hostname=' + $hostname)) -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden | Out-Null
              $fatalHit = $false
              # [F34-1] Poll status --json for <= 90 s until BackendState is Running AND a
              # CGNAT tailnet IP is assigned. Every downstream consumer (stage config
              # writer, cert bind, webdesk) needs the address, so 'Running but address-less'
              # keeps polling instead of exiting green and failing two steps later. The
              # address is read from Self.TailscaleIPs in the SAME status JSON - this step
              # never calls `tailscale ip -4` (F9n/F25 proved that LocalAPI call 401s when
              # the node is SYSTEM-owned). Break EARLY on a fatal authkey rejection.
              for ($i = 0; $i -lt 45; $i++) {
                  try {
                      $j = (& $ts status --json 2>$null) | ConvertFrom-Json -ErrorAction Stop
                      if ($j -and ($j.BackendState -eq 'Running')) {
                          $stateRunning = $true
                          foreach ($a in @($j.Self.TailscaleIPs)) {
                              if (([string]$a).Trim() -match $cgnat) { $tsIp = ([string]$a).Trim(); break }
                          }
                          if ($tsIp) { $ok = $true; break }
                      }
                  } catch { }
                  $allNow = ''
                  try { if (Test-Path -LiteralPath $upErr) { $allNow += [System.IO.File]::ReadAllText($upErr) } } catch { }
                  try { if (Test-Path -LiteralPath $upLog) { $allNow += "`n" + [System.IO.File]::ReadAllText($upLog) } } catch { }
                  if ($allNow -match 'invalid|expired|revoked|not a valid|unauthorized|forbidden|already been used|consumed') { $fatalHit = $true; break }
                  Start-Sleep -Seconds 2
              }
              if ($ok -or $fatalHit) { break }
              # ONE retry, after 10 s, for transient control-plane errors only.
              $transientNow = ''
              try { if (Test-Path -LiteralPath $upErr) { $transientNow = [System.IO.File]::ReadAllText($upErr) } } catch { }
              if ($attempt -eq 1 -and $transientNow -match 'timeout|timed out|temporar|unavailable|connection (refused|reset)|EOF|50[0-9]|try again') {
                  Write-Host '[ts] transient control-plane error - retrying once after 10 s'
                  Start-Sleep -Seconds 10
              } else { break }
          }
          if ($ok) {
              Write-Host ('[ts] auto-login OK via TS_AUTHKEY (tailnet IP ' + $tsIp + ')')
              # [F34-1] hand the PROVEN address to the stage step, which halts on an
              # empty IP before the MagicDNS branch can misdiagnose it.
              if ($env:GITHUB_ENV) { Add-Content -Path $env:GITHUB_ENV -Value ('TS_TAILNET_IP=' + $tsIp) }
              if ($S) { '### Tailscale: auto-logged-in via TS_AUTHKEY (tailnet IP `' + $tsIp + '`)' | Add-Content -Path $S }
              exit 0
          }

          # Failure: read the last 25 lines of the PAIRED logs, redact, then
          # classify per F9k before halting with the same 5 fix steps.
          $tail = @()
          foreach ($f in @($upLog, $upErr)) {
              try { if (Test-Path -LiteralPath $f) { $tail += ([System.IO.File]::ReadAllText($f) -split "`r?`n") } } catch { }
          }
          $tail = @($tail | Where-Object { $_ } | Select-Object -Last 25 | ForEach-Object { ConvertTo-Redacted $_ })
          $tailText = ($tail -join "`n")
          Write-Host '[ts] tailscale up failed - last 25 log lines (redacted):'
          foreach ($l in $tail) { Write-Host ('[ts]   ' + $l) }
          # [F34-2] CLASSIFIER: reason + the link that actually fixes it. Ordered, first
          # match wins; the authkey classes are tested BEFORE control-plane because a
          # rejected key also prints dial/EOF noise and the generic pattern would swallow
          # it. Previously every class pointed at the keys page, so a Tailscale-side
          # outage read as 'your auth key is wrong'.
          $f34Classes = @(
              [pscustomobject]@{ Reason = 'ts-authkey-invalid'; Url = $keysUrl; Pattern = 'invalid|expired|revoked|not a valid|already been used|consumed' }
              [pscustomobject]@{ Reason = 'ts-authkey-ratelimited'; Url = $keysUrl; Pattern = 'rate.?limit|too many requests|\b429\b|limiter' }
              [pscustomobject]@{ Reason = 'ts-control-plane'; Url = $statusUrl; Pattern = 'timeout|timed out|temporar|unavailable|no such host|dial tcp|connection (refused|reset)|EOF|50[0-9]|try again' }
          )
          $reason = 'ts-authkey-unknown'
          $haltUrl = $keysUrl
          foreach ($cl in $f34Classes) {
              if ($tailText -match $cl.Pattern) { $reason = $cl.Reason; $haltUrl = $cl.Url; break }
          }
          # Running for the whole window with no address assigned is an ACL/capability
          # fault, not an unparseable key - say so instead of 'unknown'.
          if ($reason -eq 'ts-authkey-unknown' -and $stateRunning -and -not $tsIp) { $reason = 'ts-tailnet-ip-unavailable' }
          if ($reason -eq 'ts-authkey-unknown' -and -not $tailText) { Write-Host '[ts] note: tailscale up produced no log output; treating as unclassified failure.' }
          Write-Host ('[ts] classified as ' + $reason + ' (remediation: ' + $haltUrl + ')')
          Emit-SecretHalt 'TS_AUTHKEY login failed' $haltUrl $reason $authSteps $tailText

      - name: Wait for Tailscale connected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $authed = $false
          for ($i = 0; $i -lt 180; $i++) {
              try {
                  $j = (& $ts status --json 2>$null) | ConvertFrom-Json -ErrorAction Stop
                  if ($j -and ($j.BackendState -eq 'Running')) { $authed = $true; break }
              } catch { }
              Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw 'Tailscale sign-in timeout (15 min).' }
          # [F34-3] IP-FIRST BRANCHING. Ladder: the address the up-step PROVED
          # (TS_TAILNET_IP) | Self.TailscaleIPs of the status JSON already in hand |
          # `tailscale ip -4` as a last resort (kept: it works on a user-owned node).
          # An empty IP HALTS HERE, BEFORE the MagicDNS branch below, because 'MagicDNS
          # is OFF' is the wrong diagnosis when it is the tailnet address that is
          # missing - it sent users to toggle DNS for an auth-key/ACL fault while the
          # real cause stayed unreported.
          $cgnat = '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.(\d{1,3})\.(\d{1,3})$'
          $ip = ''
          $ipSource = 'none'
          if (([string]$env:TS_TAILNET_IP).Trim() -match $cgnat) { $ip = ([string]$env:TS_TAILNET_IP).Trim(); $ipSource = 'up-step' }
          if (-not $ip) {
              foreach ($a in @($j.Self.TailscaleIPs)) {
                  if (([string]$a).Trim() -match $cgnat) { $ip = ([string]$a).Trim(); $ipSource = 'status-json'; break }
              }
          }
          if (-not $ip) {
              $ipRaw = ([string](& $ts ip -4 2>$null | Select-Object -First 1)).Trim()
              $LASTEXITCODE = 0
              if ($ipRaw -match $cgnat) { $ip = $ipRaw; $ipSource = 'tailscale-ip' }
          }
          Write-Host ('[ts] connected. Tailscale IP = ' + $ip + ' (source: ' + $ipSource + ')')
          if (-not $ip) {
              $f34h = @(
                  '### Tailnet IP missing - workflow halted by design (this is NOT a MagicDNS problem)'
                  '[Tailscale admin keys + ACLs](https://login.tailscale.com/admin/settings/keys)'
                  '[Tailscale service status](https://status.tailscale.com)'
                  'BackendState reached Running but no 100.64.0.0/10 address was assigned. Check the auth key capabilities / tailnet ACLs, then re-dispatch. The MagicDNS gate is deliberately NOT reported: it was never evaluated.'
              )
              Write-Host '::error::[F34] tailnet IP empty after sign-in - halting BEFORE the MagicDNS branch (a DNS diagnosis here would be wrong)'
              foreach ($l in $f34h) { Write-Host ('[f34] ' + $l) }
              if ($env:GITHUB_STEP_SUMMARY) { $f34h | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              throw 'tailnet IP unavailable after sign-in (no CGNAT address) - halting before MagicDNS diagnostics'
          }
          $dnsName = ''
          try { $dnsName = ([string]$j.Self.DNSName).TrimEnd('.') } catch { }
          # [F9b] opt-in auto-enable: only when BOTH TS_API_TOKEN and
          # TS_TAILNET_NAME are set. The token travels in the Authorization
          # header only and is never printed. Secrets absent -> silent skip.
          if ($dnsName -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$' -and $env:TS_API_TOKEN -and $env:TS_TAILNET_NAME) {
              $null = & curl.exe -sS --fail -X POST ('https://api.tailscale.com/api/v2/tailnet/' + $env:TS_TAILNET_NAME + '/dns/preferences') -H ('Authorization: Bearer ' + $env:TS_API_TOKEN) -H 'Content-Type: application/json' -d '{"magicDNSEnabled":true}' --max-time 30 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host '[ts] F9b: opt-in MagicDNS auto-enable POST accepted' } else { Write-Host ('[ts] F9b: MagicDNS auto-enable API call failed (curl exit ' + $LASTEXITCODE + ') - check TS_API_TOKEN scope; token never printed') }
              $LASTEXITCODE = 0
              Start-Sleep -Seconds 5
              try { $j = (& $ts status --json 2>$null) | ConvertFrom-Json; $dnsName = ([string]$j.Self.DNSName).TrimEnd('.'); $LASTEXITCODE = 0 } catch { }
          }
          # [F9a] MagicDNS OFF = halt by design. Before throwing, the step
          # summary gets the clickable admin link, the log echoes the same
          # lines, and the thrown message repeats the URL. Never continues.
          if ($dnsName -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              $f9a = @(
                  '### MagicDNS is OFF - workflow halted by design'
                  '[Enable MagicDNS now (Tailscale admin -> DNS)](https://login.tailscale.com/admin/dns)'
                  'Toggle MagicDNS ON, Save, then re-run this workflow. Runs stay halted until enabled.'
              )
              Write-Host '[ts] FATAL: MagicDNS is OFF (Self.DNSName empty or not *.ts.net). One-click fix: https://login.tailscale.com/admin/dns -> toggle MagicDNS ON, Save, then re-run. Do not substitute the tailnet IP.'
              foreach ($l in $f9a) { Write-Host ('[f9a] ' + $l) }
              if ($env:GITHUB_STEP_SUMMARY) { $f9a | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
              throw 'enable MagicDNS in tailnet DNS settings (https://login.tailscale.com/admin/dns)'
          }
          Write-Host ('[ts] MagicDNS = ' + $dnsName)
          # [F12-2 §2] Hand the PROVEN FQDN to the cert-bind step. The cert step
          # refuses to run without it, which makes the required ordering (DNS
          # gate -> cert bind) explicit and enforced instead of implicit.
          if ($env:GITHUB_ENV) { Add-Content -Path $env:GITHUB_ENV -Value ('TS_MAGICDNS_FQDN=' + $dnsName) }
          Write-Host ('[ts] exported TS_MAGICDNS_FQDN=' + $dnsName + ' (cert bind runs only after this DNS gate)')
          exit 0

      # [F18 §1] Runner FQDN self-test: MagicDNS name MUST resolve on the
      # runner itself to a 100.64.0.0/10 address. Fail LOUD before cert-bind
      # or webdesk if the runner cannot resolve its own FQDN.
      - name: Runner FQDN self-test (F18)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dnsName = [string]$env:TS_MAGICDNS_FQDN
          if ($dnsName -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              Write-Host '::error::[F18] TS_MAGICDNS_FQDN missing/invalid - FQDN self-test cannot run'
              throw 'Runner cannot resolve own FQDN: (missing) -> FAILED. Check MagicDNS in Tailscale admin.'
          }
          $resolvedIP = 'FAILED'
          try {
              $hits = Resolve-DnsName -Name $dnsName -ErrorAction Stop | Where-Object { $_.IPAddress }
              $v4 = @($hits | Where-Object { $_.IPAddress -match '^\d+\.\d+\.\d+\.\d+$' } | Select-Object -ExpandProperty IPAddress)
              if ($v4.Count -gt 0) { $resolvedIP = [string]$v4[0] }
          } catch {
              $resolvedIP = 'FAILED'
          }
          if ($resolvedIP -notmatch '^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') {
              Write-Host ('::error::[F18] Runner cannot resolve own FQDN: ' + $dnsName + ' -> ' + $resolvedIP + '. Check MagicDNS in Tailscale admin.')
              throw ('Runner cannot resolve own FQDN: ' + $dnsName + ' -> ' + $resolvedIP + '. Check MagicDNS in Tailscale admin.')
          }
          Write-Host ('Runner FQDN resolves to ' + $resolvedIP)
          if ($env:GITHUB_ENV) { Add-Content -Path $env:GITHUB_ENV -Value ('RUNNER_RESOLVED_IP=' + $resolvedIP) }
          exit 0

      # [U5b / MIGRATION 1.3] Bind the tailnet Let's Encrypt cert to the
      # RDP-Tcp listener automatically at every run, so certBound reads YES
      # on /api/native-status without any manual step. NLA stays ON, no
      # AuthenticationLevelOverride, no client-side trust manipulation.
      # Logs the thumbprint only (never the private key). Idempotent: safe
      # to re-run when the LE cert renews (~90 days).
      - name: Bind tailnet LE cert to RDP-Tcp (U5b)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-timing.ps1')
          $f59sw = Start-F59Step
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $S = $env:GITHUB_STEP_SUMMARY
          $fqdn = ''
          try {
              $j = (& $ts status --json 2>$null) | ConvertFrom-Json
              $fqdn = ([string]$j.Self.DNSName).TrimEnd('.')
          } catch { }
          # [F12-2 §2] ORDERING PROOF + FQDN SOURCE. The "Wait for Tailscale
          # connected" step is the DNS gate: it verifies Self.DNSName is
          # *.ts.net and exports TS_MAGICDNS_FQDN. If that value is missing the
          # cert step ran before (or without) the gate - the ordering regression
          # behind run ghrdp-c40a94 - so we halt instead of certing a guess.
          $gateFqdn = [string]$env:TS_MAGICDNS_FQDN
          if ($gateFqdn -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              Write-Host '::error::[cert] TS_MAGICDNS_FQDN missing/invalid - cert bind must run AFTER the "Wait for Tailscale connected" DNS gate'
              if ($S) {
                  '### RDP cert bind FAILED - reason cert-not-bound' | Add-Content -Path $S
                  'Ordering: the MagicDNS/DNS gate step must run before cert bind (it exports TS_MAGICDNS_FQDN).' | Add-Content -Path $S
                  'Thumbprint: none - no certificate was requested for an unproven FQDN.' | Add-Content -Path $S
              }
              throw 'cert bind halted by design: DNS gate value TS_MAGICDNS_FQDN absent (reason cert-not-bound)'
          }
          $fqdn = $gateFqdn
          # [F9b] opt-in auto-enable: only when BOTH TS_API_TOKEN and
          # TS_TAILNET_NAME are set. The token travels in the Authorization
          # header only and is never printed. Secrets absent -> silent skip.
          if ($fqdn -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$' -and $env:TS_API_TOKEN -and $env:TS_TAILNET_NAME) {
              $null = & curl.exe -sS --fail -X POST ('https://api.tailscale.com/api/v2/tailnet/' + $env:TS_TAILNET_NAME + '/dns/preferences') -H ('Authorization: Bearer ' + $env:TS_API_TOKEN) -H 'Content-Type: application/json' -d '{"magicDNSEnabled":true}' --max-time 30 2>$null
              if ($LASTEXITCODE -eq 0) { Write-Host '[cert] F9b: opt-in MagicDNS auto-enable POST accepted' } else { Write-Host ('[cert] F9b: MagicDNS auto-enable API call failed (curl exit ' + $LASTEXITCODE + ') - check TS_API_TOKEN scope; token never printed') }
              $LASTEXITCODE = 0
              Start-Sleep -Seconds 5
              try { $j = (& $ts status --json 2>$null) | ConvertFrom-Json; $fqdn = ([string]$j.Self.DNSName).TrimEnd('.'); $LASTEXITCODE = 0 } catch { }
          }
          # [F9a] MagicDNS OFF = halt by design. Before throwing, the step
          # summary gets the clickable admin link, the log echoes the same
          # lines, and the thrown message repeats the URL. Never continues.
          if ($fqdn -notmatch '^[a-z0-9][a-z0-9\-]*(\.[a-z0-9\-]+)+\.ts\.net$') {
              $f9a = @(
                  '### MagicDNS is OFF - workflow halted by design'
                  '[Enable MagicDNS now (Tailscale admin -> DNS)](https://login.tailscale.com/admin/dns)'
                  'Toggle MagicDNS ON, Save, then re-run this workflow. Runs stay halted until enabled.'
              )
              Write-Host '[cert] FATAL: MagicDNS is OFF (Self.DNSName empty or not *.ts.net). One-click fix: https://login.tailscale.com/admin/dns -> toggle MagicDNS ON, Save, then re-run.'
              foreach ($l in $f9a) { Write-Host ('[f9a] ' + $l) }
              if ($S) { $f9a | Add-Content -Path $S }
              throw 'enable MagicDNS in tailnet DNS settings (https://login.tailscale.com/admin/dns)'
          }
          Write-Host ('[cert] FQDN = ' + $fqdn)
          $rdpKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          try { Set-ItemProperty -Path $rdpKey -Name 'UserAuthentication' -Value 1 -Type DWord -ErrorAction Stop; Write-Host '[cert] NLA reasserted (UserAuthentication=1)' } catch { Write-Host ('[cert] NLA reassert failed: ' + $_.Exception.Message) }
          $workDir = 'C:\ghrdp\tls'
          New-Item -ItemType Directory -Path $workDir -Force -ErrorAction SilentlyContinue | Out-Null
          $crtPath = Join-Path $workDir ($fqdn + '.crt')
          $keyPath = Join-Path $workDir ($fqdn + '.key')
          try { icacls.exe $workDir /inheritance:r 2>&1 | Out-Null; icacls.exe $workDir /grant:r 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' 'NETWORK SERVICE:(OI)(CI)R' 2>&1 | Out-Null; $LASTEXITCODE=0 } catch { }
          $certLog = Join-Path $env:RUNNER_TEMP 'ts-cert.log'
          $certErr = Join-Path $env:RUNNER_TEMP 'ts-cert.err'
          # [F12-2 §2] `tailscale cert` fetch: 3 attempts, 10s apart. The
          # regression run (F12 ground truth, ghrdp-c40a94) let ONE transient
          # fetch failure fall through the old `exit 0`, so the step looked green
          # while /api/native-status reported certBound = NO for the whole run.
          # Every attempt prints its own exit code + file presence; no key
          # material is ever printed.
          $certOk = $false
          $certErrText = ''
          $certCode = 'cert-not-bound'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
              Remove-Item -LiteralPath $crtPath -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
              $p = Start-Process -FilePath $ts -ArgumentList @('cert', '--cert-file', $crtPath, '--key-file', $keyPath, $fqdn) -RedirectStandardOutput $certLog -RedirectStandardError $certErr -WindowStyle Hidden -PassThru
              try { $p.WaitForExit(120000) | Out-Null } catch { }
              $certOk = ($p.HasExited -and $p.ExitCode -eq 0 -and (Test-Path -LiteralPath $crtPath) -and (Test-Path -LiteralPath $keyPath))

              $tail = ''
              try { if (Test-Path $certErr) { $tail = [System.IO.File]::ReadAllText($certErr) } } catch { }
              $certErrText = (($tail -replace "`r?`n", ' ')).Trim()
              if ($certErrText.Length -gt 300) { $certErrText = $certErrText.Substring(0, 300) }
              if (-not $certErrText) { $certErrText = 'no stderr captured (fetch produced no output)' }
              $certErrSafe = ($certErrText -replace 'tskey-[A-Za-z0-9\-]+', 'tskey-[redacted]' -replace 'ghp_[A-Za-z0-9]+', 'ghp_[redacted]')

              Write-Host ('[cert] attempt ' + $attempt + '/3: exit=' + $p.ExitCode + ' crt=' + (Test-Path -LiteralPath $crtPath) + ' key=' + (Test-Path -LiteralPath $keyPath) + ' ok=' + $certOk)
              if ($certOk) { $certCode = 'ok'; break }

              # [F12-2] Error Classification & Non-transient early exit
              $isTransient = $true
              if ($certErrText -match 'does not support getting TLS certs|HTTPS certificates disabled|account does not support') {
                  $certCode = 'cert-capability-unavailable'
                  $isTransient = $false
              } elseif ($certErrText -match 'access denied|unauthorized|forbidden|permission denied') {
                  $certCode = 'cert-auth-failed'
                  $isTransient = $false
              } elseif ($certErrText -match 'invalid hostname|not a valid domain') {
                  $certCode = 'cert-invalid-hostname'
                  $isTransient = $false
              } elseif ($certErrText -match 'rate limit|too many requests') {
                  $certCode = 'cert-rate-limit'
                  $isTransient = $false
              } elseif ($certErrText -match 'ACME|challenge failed|DNS TXT record') {
                  $certCode = 'cert-acme-failed'
                  $isTransient = $true
              } else {
                  $certCode = 'cert-transient-network'
                  $isTransient = $true
              }

              if (-not $isTransient) {
                  Write-Host ('[cert] deterministic non-transient error detected (' + $certCode + '); halting attempts immediately')
                  break
              }

              if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if (-not $certOk) {
              if (-not $certErrText) {
                  $tail = ''
                  try { if (Test-Path $certErr) { $tail = [System.IO.File]::ReadAllText($certErr) } } catch { }
                  $certErrText = (($tail -replace "`r?`n", ' ')).Trim()
                  if ($certErrText.Length -gt 300) { $certErrText = $certErrText.Substring(0, 300) }
                  if (-not $certErrText) { $certErrText = 'no stderr captured (fetch produced no output)' }
                  $certErrSafe = ($certErrText -replace 'tskey-[A-Za-z0-9\-]+', 'tskey-[redacted]' -replace 'ghp_[A-Za-z0-9]+', 'ghp_[redacted]')
              }
              # FAIL-CLOSED [F12-2]: never leave a run that reports certBound=NO.
              Write-Host ('::error::[cert] tailscale cert failed; code=' + $certCode + '; reason=cert-not-bound; error=' + $certErrSafe)
              Write-Host ('[cert] tailscale cert failed (' + $certCode + '); fix: Tailscale admin console -> DNS -> "Enable HTTPS...". err: ' + $certErrSafe)
              if ($S) {
                  '### RDP cert bind FAILED - reason cert-not-bound' | Add-Content -Path $S
                  ('Error Code: `' + $certCode + '`') | Add-Content -Path $S
                  ('Thumbprint: none - certificate fetch failed (code: ' + $certCode + ', error: ' + $certErrSafe + ')') | Add-Content -Path $S
                  'Fix: Tailscale admin console -> DNS -> "Enable HTTPS...". Then re-run this workflow. Halted by design: a green run with certBound=NO is a false-LIVE.' | Add-Content -Path $S
              }
              throw ('cert bind halted by design: tailscale cert fetch failed (' + $certCode + '; reason cert-not-bound)')
          }
          $thumb = ''
          try {
              $loaded = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPemFile($crtPath, $keyPath)
              if (-not $loaded.HasPrivateKey) { throw 'PEM has no private key' }
              $pfxBytes = $loaded.Export('Pfx', [string]::Empty)
              $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::MachineKeySet -bor
                       [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor
                       [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
              $imported = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, [string]::Empty, $flags)
              if (-not $imported.HasPrivateKey) { throw 're-imported certificate has no private key' }
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('My', 'LocalMachine')
              try {
                  $store.Open('ReadWrite')
                  $store.Add($imported)
              } finally { $store.Close() }
              $thumb = $imported.Thumbprint
              # [F31] Resolve the actual persisted container, not an assumed RSA\MachineKeys path.
              # Throws on missing file, failed write or missing readback ACE; never bind a broken key.
              $keyFile = & (Join-Path $env:GITHUB_WORKSPACE 'payloads/Grant-RdpKeyAccess.ps1') -Certificate $imported
              Write-Host ('[cert] NETWORK SERVICE Read + SYSTEM FullControl verified; container=' + $keyFile)
          } catch {
              # [F12-2] fail-closed: an import failure used to exit 0 and leave
              # certBound = NO on a green run.
              Write-Host ('::error::[cert] PFX import failed; reason=cert-not-bound; error=' + $_.Exception.Message)
              if ($S) { '### RDP cert bind FAILED - reason cert-not-bound' | Add-Content -Path $S; ('Thumbprint: none - PFX import into LocalMachine\My failed: ' + $_.Exception.Message) | Add-Content -Path $S }
              throw 'cert bind halted by design: PFX import failed (reason cert-not-bound)'
          }
          try {
              $tsSetting = Get-CimInstance -Namespace 'root/cimv2/TerminalServices' -ClassName 'Win32_TSGeneralSetting' -Filter "TerminalName='RDP-Tcp'" -ErrorAction Stop
              $bindResult = Invoke-CimMethod -InputObject $tsSetting -MethodName 'SetSSLCertificateSHA1Hash' -Arguments @{ SSLCertificateSHA1Hash = $thumb } -ErrorAction Stop
              if ($bindResult.ReturnValue -ne 0) {
                  Write-Host ('[cert] SetSSLCertificateSHA1Hash returned ' + $bindResult.ReturnValue + '; falling back to registry write')
                  $hashBytes = -split ($thumb -replace '(..)', '$1 ') | ForEach-Object { [byte]("0x$_") }
                  New-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -PropertyType Binary -Value $hashBytes -Force | Out-Null
              }
          } catch {
              Write-Host ('[cert] WMI bind failed (' + $_.Exception.Message + '); registry-only fallback')
              try {
                  $hashBytes = -split ($thumb -replace '(..)', '$1 ') | ForEach-Object { [byte]("0x$_") }
                  New-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -PropertyType Binary -Value $hashBytes -Force | Out-Null
              } catch {
                  Write-Host ('::error::[cert] registry fallback failed; reason=cert-not-bound; error=' + $_.Exception.Message)
                  if ($S) { '### RDP cert bind FAILED - reason cert-not-bound' | Add-Content -Path $S; ('Thumbprint: none - neither WMI nor the RDP-Tcp registry write succeeded: ' + $_.Exception.Message) | Add-Content -Path $S }
                  throw 'cert bind halted by design: RDP-Tcp SSLCertificateSHA1Hash write failed (reason cert-not-bound)'
              }
          }
          $boundHex = ''
          try { $bound = (Get-ItemProperty -Path $rdpKey -Name 'SSLCertificateSHA1Hash' -ErrorAction Stop).SSLCertificateSHA1Hash; $boundHex = ($bound | ForEach-Object { $_.ToString('X2') }) -join '' } catch { }
          if ($boundHex -ieq $thumb) {
              if ((Get-ItemProperty -Path $rdpKey -Name 'UserAuthentication' -ErrorAction Stop).UserAuthentication -ne 1) { throw 'NLA changed after cert binding' }
              Restart-Service TermService -Force -ErrorAction Stop
              if ((Get-Service TermService -ErrorAction Stop).Status -ne 'Running') { throw 'TermService failed to restart' }
              Write-Host ('[cert] OK: cert ' + $thumb + ' bound on RDP-Tcp; NLA=1; TermService restarted')
              if ($S) { '### RDP cert bind OK (ACL verified; handshake pending F17)' | Add-Content -Path $S; ('Thumbprint: `' + $thumb + '`') | Add-Content -Path $S }
          } else {
              # [F12-2] A verification mismatch is a FAILED bind, not a notice:
              # the old branch wrote a summary line and exited 0, which is how a
              # run reported "cert bind success" while certBound read NO.
              Write-Host ('::error::[cert] bind verification mismatch; reason=cert-not-bound; registry=' + $boundHex + ' expected=' + $thumb)
              if ($S) { '### RDP cert bind FAILED - reason cert-not-bound' | Add-Content -Path $S; ('Thumbprint: fetched `' + $thumb + '` but RDP-Tcp reports `' + $boundHex + '` after the write.') | Add-Content -Path $S; 'Halted by design so certBound can never read NO on a green run.' | Add-Content -Path $S }
              throw 'cert bind halted by design: RDP-Tcp thumbprint mismatch after write (reason cert-not-bound)'
          }
          Stop-F59Step -Step 'rdp-cert-bind' -Sw $f59sw | Out-Null
          exit 0

      # [F21 §1] CredSSP/NLA handshake verification (after cert bind, before
      # advertising the RDP host). Checks NLA setting, cert chain, CredSSP
      # server policy, and Schannel cipher suites. If ANY handshake determinant
      # fails, the step FAILS LOUD with the exact field + remediation text;
      # config.json gets rdpListener.credsspStatus = 'failed-<reason>'; the run
      # never proceeds to advertise a host that will reject the NLA handshake
      # (TcpStateFrontAuth -> TcpStateFailure class, verified 2026-09-25).
      # [F23] The cipher check is a 3-layer PROBE (cmdlet / registry / warn):
      # if the probe itself cannot enumerate suites, that is a probe failure,
      # NOT a weak config - status becomes 'ok-with-cipher-warn' and the run
      # proceeds with a ::warning:: (2026-09-26 false-halt postmortem). F19
      # gates enforce no credential-UI automation (password auto-type, keyboard
      # injection) anywhere in the repo.
      - name: CredSSP/NLA handshake verification (F21 - fail loud on mismatch)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $S = $env:GITHUB_STEP_SUMMARY
          $utf8F21 = New-Object System.Text.UTF8Encoding($false)
          $cfgPathF21 = 'C:\ghrdp\config.json'
          $rdpKeyF21 = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          $credsspKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
          function Write-CredsspStatus([string]$Status, [string]$Detail = '') {
              try {
                  if (-not (Test-Path -LiteralPath $cfgPathF21)) { return }
                  $cfgW = [System.IO.File]::ReadAllText($cfgPathF21) | ConvertFrom-Json
                  $rdpL = $null
                  if ($cfgW.PSObject.Properties['rdpListener']) { $rdpL = $cfgW.rdpListener } else { $rdpL = [pscustomobject]@{} }
                  $rdpL | Add-Member -NotePropertyName credsspStatus -NotePropertyValue $Status -Force
                  if ($Detail) { $rdpL | Add-Member -NotePropertyName credsspWhy -NotePropertyValue $Detail -Force }
                  $cfgW | Add-Member -NotePropertyName rdpListener -NotePropertyValue $rdpL -Force
                  [System.IO.File]::WriteAllText($cfgPathF21, ($cfgW | ConvertTo-Json -Depth 10), $utf8F21)
              } catch { Write-Host ('[F21] config stamp failed: ' + $_.Exception.Message) }
          }
          $failReasons = @()
          # (1) NLA: UserAuthentication must = 1
          $nlaOk = $false; $nlaVal = $null
          try { $nlaVal = (Get-ItemProperty -Path $rdpKeyF21 -Name 'UserAuthentication' -ErrorAction Stop).UserAuthentication; $nlaOk = ($nlaVal -eq 1) } catch { }
          if (-not $nlaOk) { $failReasons += ('nla-off (UserAuthentication=' + $nlaVal + '; remediation: set to 1 for NLA)') }
          else { Write-Host '[F21] NLA OK: UserAuthentication=1' }
          # (2) SSLCertificateSHA1Hash must match a cert in LocalMachine cert store; chain must verify
          $certChainOk = $false; $certIssuer = ''; $certSubject = ''; $certWhy = ''
          try {
              $sh = (Get-ItemProperty -Path $rdpKeyF21 -Name 'SSLCertificateSHA1Hash' -ErrorAction Stop).SSLCertificateSHA1Hash
              if ($sh -and $sh.Length -ge 20) {
                  $certThumb = ($sh | ForEach-Object { $_.ToString('X2') }) -join ''
                  # [F21 §1.2] check BOTH LocalMachine\My (U5b bind target) and
                  # LocalMachine\Remote Desktop per spec (verbatim from user cmd).
                  $boundF21 = $null
                  foreach ($storeName in @('My', 'Remote Desktop')) {
                      try {
                          $storeF21 = New-Object System.Security.Cryptography.X509Certificates.X509Store($storeName, 'LocalMachine')
                          $storeF21.Open('ReadOnly')
                          $found = $storeF21.Certificates | Where-Object { $_.Thumbprint -eq $certThumb } | Select-Object -First 1
                          $storeF21.Close()
                          if ($found) { $boundF21 = $found; break }
                      } catch { }
                  }
                  if ($boundF21) {
                      $certSubject = $boundF21.Subject
                      $certIssuer = $boundF21.Issuer
                      $chainF21 = New-Object System.Security.Cryptography.X509Certificates.X509Chain
                      try {
                          $chainF21.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::NoCheck
                          $certChainOk = [bool]$chainF21.Build($boundF21)
                          $chainStatus = (@($chainF21.ChainStatus | ForEach-Object { [string]$_.Status }) -join ',')
                      } finally { $chainF21.Dispose() }
                      # Issuer must reference Let's Encrypt or a trusted CA (not self-signed)
                      $issuerTrusted = ($certIssuer -match 'Let''s Encrypt|DigiCert|GlobalSign|Sectigo|Comodo|GeoTrust|RapidSSL|Amazon|Microsoft')
                      if (-not $certChainOk) { $certWhy = ('cert chain invalid: ' + $chainStatus) }
                      elseif (-not $issuerTrusted) { $certWhy = ('cert issuer not trusted (self-signed?): ' + $certIssuer) }
                      elseif ($boundF21.NotAfter.ToUniversalTime() -le [datetime]::UtcNow) { $certWhy = ('cert expired ' + $boundF21.NotAfter.ToUniversalTime().ToString('o')) }
                  } else { $certWhy = 'thumbprint not found in LocalMachine\My' }
              } else { $certWhy = 'no SSLCertificateSHA1Hash on RDP-Tcp' }
          } catch { $certWhy = 'cert probe failed: ' + $_.Exception.Message }
          if ($certChainOk -and -not $certWhy) { Write-Host ('[F21] Cert chain OK: subject=' + $certSubject + ' issuer=' + $certIssuer) }
          else { $failReasons += ('cert-untrusted (' + $certWhy + '; remediation: bind a Let''s Encrypt cert via U5b/F17)') }
          # (3) CredSSP server policy: AllowEncryptionOracle must be 0 (strict, CVE-2018-0886) if present
          $credsspOk = $true; $credsspVal = $null; $credsspWhy = ''
          try {
              $cp = Get-ItemProperty -Path $credsspKey -Name 'AllowEncryptionOracle' -ErrorAction SilentlyContinue
              if ($null -ne $cp) {
                  $credsspVal = $cp.AllowEncryptionOracle
                  if ($credsspVal -ne 0) { $credsspOk = $false; $credsspWhy = ('AllowEncryptionOracle=' + $credsspVal + ' (must be 0 for strict CVE-2018-0886 mode); remediation: set to 0') }
              } else { Write-Host '[F21] CredSSP AllowEncryptionOracle not set (default strict mode - OK)' }
          } catch { $credsspOk = $false; $credsspWhy = 'CredSSP Parameters key unreadable: ' + $_.Exception.Message }
          if ($credsspOk -and -not $credsspWhy) { Write-Host '[F21] CredSSP policy OK (strict mode)' }
          else { $failReasons += ('credssp-policy-mismatch (' + $credsspWhy + ')') }
          # (4) Schannel cipher suites: at least one AES-256-GCM or ChaCha20-Poly1305 must be present.
          # [F23 §1] 3-layer robust probe. Ground truth 2026-09-26: the old one-liner
          # (Get-TlsCipherSuite | Select-Object -ExpandProperty Name) threw "Property
          # 'Name' cannot be found" on pwsh7 (object-shape quirk) => $suites empty =>
          # FALSE schannel-cipher-weak => the whole run halted on a HEALTHY host (the
          # PROBE lied; Windows defaults include AES-256-GCM/ChaCha20). L1 = cmdlet,
          # per-object Name read (direct property / PSObject bag / Format-List parse);
          # L2 = registry Functions fallback; L3 = BOTH empty is a PROBE failure,
          # never a weak-config verdict. A REAL weak config (suites enumerated, zero
          # AES_256_GCM/CHACHA20_POLY1305) still halts, unchanged.
          $cipherOk = $false; $cipherDetail = ''; $cipherProbeFailed = $false
          $suites = @()
          try {
              foreach ($o in @(Get-TlsCipherSuite -ErrorAction Stop)) {
                  $nm = ''
                  try { if ($null -ne $o.Name) { $nm = [string]$o.Name } } catch { }
                  if (-not $nm) { try { $pF23 = $o.PSObject.Properties['Name']; if ($pF23 -and $null -ne $pF23.Value) { $nm = [string]$pF23.Value } } catch { } }
                  if (-not $nm) {
                      try {
                          foreach ($lnF23 in (($o | Format-List | Out-String) -split "`r?`n")) {
                              if ($lnF23 -match '^\s*Name\s*:\s*(\S.*?)\s*$') { $nm = $Matches[1]; break }
                          }
                      } catch { }
                  }
                  if ($nm) { $suites += $nm }
              }
          } catch { $cipherDetail = ('L1 cmdlet probe failed: ' + $_.Exception.Message) }
          # [F23 L2] registry fallback (Schannel cipher Functions order) when L1 enumerated nothing
          if ($suites.Count -eq 0) {
              foreach ($regPathF23 in @(
                  'HKLM:\SYSTEM\CurrentControlSet\Control\Cryptography\Configuration\Local\SSL\00010002',
                  'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002')) {
                  try {
                      $fnVal = (Get-ItemProperty -Path $regPathF23 -Name 'Functions' -ErrorAction Stop).Functions
                      $toks = @((@($fnVal) -join ',') -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                      if ($toks.Count -gt 0) { $suites = $toks; $cipherDetail = ('L2 registry fallback: ' + $regPathF23); break }
                  } catch { }
              }
          }
          if ($suites.Count -eq 0) {
              # [F23 L3 probe-failure begin] cmdlet AND registry BOTH empty => the
              # PROBE failed, not the config: warn, stamp, proceed (never halts).
              $cipherProbeFailed = $true
              if (-not $cipherDetail) { $cipherDetail = 'cmdlet enumerated no Name tokens and registry Functions was empty' }
              Write-Host ('::warning::[F21] cipher probe could not enumerate (cmdlet+registry failed); Windows defaults include AES-256-GCM; proceeding with warning (' + $cipherDetail + ')')
              Write-CredsspStatus -Status 'ok-with-cipher-warn' -Detail 'cipher-probe-failed'
              # [F23 L3 probe-failure end]
          } else {
              $strong = @($suites | Where-Object { $_ -match 'AES_256_GCM|CHACHA20_POLY1305' })
              if ($strong.Count -gt 0) { $cipherOk = $true; $cipherDetail = ($strong -join ', ') }
              else { $cipherDetail = ('available suites: ' + ($suites -join ', ')) }
          }
          if ($cipherOk) { Write-Host ('[F21] Schannel cipher OK: strong suites present (' + $cipherDetail + ')') }
          elseif ($cipherProbeFailed) { Write-Host ('[F21] Schannel cipher WARN: probe failure, not a config verdict; proceeding - ' + $cipherDetail) }
          else { $failReasons += ('schannel-cipher-weak (no AES-256-GCM/ChaCha20-Poly1305; ' + $cipherDetail + '; remediation: enable strong cipher suites at OS level - see MIGRATION.md)') }
          # NLA reassert (belt-and-suspenders): also set MinEncryptionLevel=3 + SecurityLayer=2
          try {
              Set-ItemProperty -Path $rdpKeyF21 -Name 'SecurityLayer' -Value 2 -Type DWord -ErrorAction SilentlyContinue
              Set-ItemProperty -Path $rdpKeyF21 -Name 'MinEncryptionLevel' -Value 3 -Type DWord -ErrorAction SilentlyContinue
              # AUTO-FIX A: if AllowEncryptionOracle exists and is wrong, correct it to 0 (strict)
              if ((-not $credsspOk) -and $credsspVal -and $credsspVal -ne 0) {
                  New-Item -Path $credsspKey -Force -ErrorAction SilentlyContinue | Out-Null
                  Set-ItemProperty -Path $credsspKey -Name 'AllowEncryptionOracle' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
                  Write-Host '[F21] AUTO-FIX A applied: AllowEncryptionOracle set to 0 (strict CVE-2018-0886)'
                  $credsspOk = $true; $failReasons = @($failReasons | Where-Object { $_ -notmatch '^credssp-policy-mismatch' })
              }
          } catch { Write-Host ('[F21] policy reassert failed: ' + $_.Exception.Message) }
          # Restart TermService to pick up any policy fixes
          if ($credsspOk -and $failReasons.Count -eq 0) {
              try { Restart-Service TermService -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 3; Write-Host '[F21] TermService restarted after policy verification' } catch { }
          }
          # Write credsspStatus BEFORE any loud fail (dashboard must see the field)
          if ($failReasons.Count -eq 0) {
              if ($cipherProbeFailed) {
                  # [F23] probe-failure path: re-stamp the warn status (never plain
                  # 'ok', never a throw) - determinants NLA/cert/CredSSP all verified.
                  Write-CredsspStatus -Status 'ok-with-cipher-warn' -Detail 'cipher-probe-failed'
                  Write-Host '[F21] CredSSP/NLA handshake verification PASS (cipher warn): NLA=1, cert=trusted, policy=strict, cipher=probe-failed (Windows defaults include AES-256-GCM)'
                  if ($S) { '### CredSSP/NLA verification PASS with cipher warning (F21/F23)' | Add-Content -Path $S; '- NLA=1, cert chain trusted, CredSSP strict mode; cipher probe could not enumerate (cmdlet+registry) - a PROBE failure, not a weak config; Windows defaults include AES-256-GCM; proceeding' | Add-Content -Path $S }
              } else {
                  Write-CredsspStatus -Status 'ok'
                  Write-Host '[F21] CredSSP/NLA handshake verification PASS: NLA=1, cert=trusted, policy=strict, cipher=strong'
                  if ($S) { '### CredSSP/NLA verification PASS (F21)' | Add-Content -Path $S; '- NLA=1, cert chain trusted, CredSSP strict mode, AES-256-GCM/ChaCha20 present' | Add-Content -Path $S }
              }
              exit 0
          }
          $failText = ($failReasons -join ' | ')
          Write-CredsspStatus -Status ('failed-' + ($failReasons[0] -replace '\s.*','')) -Detail $failText
          Write-Host ('::error::[F21] CredSSP/NLA handshake verification FAILED: ' + $failText)
          if ($S) {
              '### CredSSP/NLA verification FAILED (F21) - halted by design' | Add-Content -Path $S
              foreach ($fr in $failReasons) { ('- ❌ ' + $fr) | Add-Content -Path $S }
              'Halted by design so the run never advertises an RDP host that rejects the NLA handshake (TcpStateFrontAuth -> TcpStateFailure).' | Add-Content -Path $S
              'NO password auto-type / credential-UI automation is performed - cmdkey already supplies credentials; the fix is policy alignment.' | Add-Content -Path $S
          }
          throw ('F21 CredSSP/NLA loud-fail: ' + $failText)
          # [F21 §1 probe-end]

      # [F30 §1] SERVER-SIDE TLS/CIPHER NORMALIZATION. Ground truth 2026-09-26:
      # the client connection is dropped DURING the TLS handshake ("connection
      # forcibly closed by remote host") BEFORE any credential is sent, while
      # TCP 3389 / DNS / firewall all probe green - i.e. a pre-LSA Schannel
      # negotiation failure, not a logon failure (4624/4625 never fire, so no
      # logon-side evidence can ever explain it). This step exists so the server
      # never depends on OS defaults: (1) the modern AES-GCM + ChaCha20 suites
      # are enabled explicitly AND moved to the FRONT of the suite list (a CBC
      # suite offered first is what a client we drop at handshake can trip on);
      # (2) TLS 1.2 Client+Server stay Enabled=1 (never disabled - many clients
      # still default to 1.2) and TLS 1.3 is enabled; (3) RDP keeps
      # SecurityLayer=2 (TLS only) with MinEncryptionLevel=3; (4) TermService,
      # WinRM and the RDP session services are restarted so the listener
      # re-reads Schannel. NOTHING here weakens NLA, CredSSP or certificate
      # validation - no auth-level override, no cert bypass, no cipher downgrade.
      - name: TLS/cipher normalization (F30 - ordered GCM/ChaCha20 + TLS 1.2/1.3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $S = $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Path 'C:\ghrdp\tls' -Force -ErrorAction SilentlyContinue | Out-Null
          # [F30 §1 normalize-begin] Secret-free, extractable block: PURE helpers
          # (order/reorder decision) + one applier. The Windows lab lane extracts
          # THIS block verbatim and drives it with fixtures AND for real, so the
          # order proof never depends on a live Windows Server inside CI.
          $script:F30Suites = @(
              'TLS_AES_256_GCM_SHA384',
              'TLS_CHACHA20_POLY1305_SHA256',
              'TLS_AES_128_GCM_SHA256',
              'TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384',
              'TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256'
          )
          # Schannel cipher-suite priority list (REG_MULTI_SZ 'Functions').
          $script:F30FunctionsKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Cryptography\Configuration\Local\SSL\00010002'
          $script:F30SchannelRoot = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols'
          function Get-F30SuiteNames {
              # Names out of cmdlet objects / strings, tolerating both shapes
              # (the F23 L1 lesson: an object-shape quirk must not look like an
              # empty suite list).
              param([object[]]$Items)
              $names = @()
              foreach ($o in @($Items)) {
                  $nm = ''
                  if ($o -is [string]) { $nm = [string]$o }
                  else {
                      try { if ($null -ne $o.Name) { $nm = [string]$o.Name } } catch { }
                      if (-not $nm) { try { $p = $o.PSObject.Properties['Name']; if ($p -and $null -ne $p.Value) { $nm = [string]$p.Value } } catch { } }
                  }
                  $nm = $nm.Trim()
                  if ($nm) { $names += $nm }
              }
              return $names
          }
          function Test-F30SuiteIn {
              # Exact, trimmed membership: an object-shape / whitespace / casing
              # quirk in a cmdlet view must never masquerade as "suite missing"
              # (the F23 L1 lesson, applied to the cipher list).
              param([object[]]$Items, [string]$Suite)
              $want = ([string]$Suite).Trim()
              if (-not $want) { return $false }
              foreach ($i in @($Items)) { if (([string]$i).Trim() -eq $want) { return $true } }
              return $false
          }
          function Get-F30OrderedFunctions {
              # PURE: the $Suites list FIRST, in the declared order, then every
              # other suite in its existing relative order (deduplicated).
              param([string[]]$Current, [string[]]$Suites)
              $rest = @()
              foreach ($e in @($Current)) {
                  if ($null -eq $e) { continue }
                  $s = ([string]$e).Trim()
                  if (-not $s) { continue }
                  if ($Suites -contains $s) { continue }
                  if ($rest -contains $s) { continue }
                  $rest += $s
              }
              return @($Suites + $rest)
          }
          function Test-F30Order {
              # PURE verdict: every suite present AND no CBC/3DES/RC4/NULL suite
              # ahead of the last modern suite. This is the "GCM/ChaCha20 first"
              # invariant, not merely "present somewhere".
              param([string[]]$List, [string[]]$Suites)
              $items = @()
              foreach ($e in @($List)) { $s = ([string]$e).Trim(); if ($s) { $items += $s } }
              if ($items.Count -eq 0) { return $false }
              foreach ($s in $Suites) { if ($items -notcontains $s) { return $false } }
              $lastIdx = -1
              foreach ($s in $Suites) {
                  for ($i = 0; $i -lt $items.Count; $i++) { if ($items[$i] -eq $s -and $i -gt $lastIdx) { $lastIdx = $i } }
              }
              for ($i = 0; $i -lt $lastIdx; $i++) {
                  if ($Suites -contains $items[$i]) { continue }
                  if ($items[$i] -match '(?i)_(CBC|3DES|RC4|NULL)_') { return $false }
              }
              return $true
          }
          function Set-F30CipherOrder {
              # Writes the ordered list back to the Schannel Functions value,
              # after backing the original up once (idempotent re-run safe).
              param([string]$Key, [string[]]$Suites, [string]$BackupPath = '')
              $before = @()
              try {
                  $raw = (Get-ItemProperty -Path $Key -Name 'Functions' -ErrorAction Stop).Functions
                  $before = @(Get-F30SuiteNames -Items @($raw))
              } catch { $before = @() }
              if ($BackupPath -and $before.Count -gt 0 -and -not (Test-Path -LiteralPath $BackupPath)) {
                  try { [System.IO.File]::WriteAllLines($BackupPath, $before, (New-Object System.Text.UTF8Encoding($false))) } catch { }
              }
              $after = @(Get-F30OrderedFunctions -Current $before -Suites $Suites)
              try {
                  New-ItemProperty -Path $Key -Name 'Functions' -PropertyType MultiString -Value $after -Force -ErrorAction Stop | Out-Null
              } catch {
                  return [pscustomobject]@{ ok = $false; before = ($before -join ','); after = ($after -join ','); why = ('write-failed: ' + $_.Exception.Message) }
              }
              $reread = @()
              try { $reread = @(Get-F30SuiteNames -Items @((Get-ItemProperty -Path $Key -Name 'Functions' -ErrorAction Stop).Functions)) } catch { }
              $ok = (Test-F30Order -List $reread -Suites $Suites)
              return [pscustomobject]@{ ok = $ok; before = ($before -join ','); after = ($reread -join ','); why = $(if ($ok) { '' } else { 'order-not-verified-after-write' }) }
          }
          function Set-F30TlsProtocols {
              # TLS 1.2 stays enabled on BOTH sides (never disabled: some clients
              # still default to it); TLS 1.3 is enabled so a 1.3-capable client
              # negotiates instead of being downgraded.
              param([string]$SchannelRoot)
              $rows = @()
              foreach ($proto in @('TLS 1.2', 'TLS 1.3')) {
                  foreach ($side in @('Client', 'Server')) {
                      $p = Join-Path $SchannelRoot ($proto + '\' + $side)
                      $ok = $false; $why = ''
                      try {
                          if (-not (Test-Path -LiteralPath $p)) { New-Item -Path $p -Force -ErrorAction Stop | Out-Null }
                          # Set-ItemProperty THROWS on an absent value and a fresh
                          # (e.g. TLS 1.3) key has none: create-if-missing first,
                          # then the explicit DWord writes below.
                          if ($null -eq (Get-ItemProperty -Path $p -Name 'Enabled' -ErrorAction SilentlyContinue)) { New-ItemProperty -Path $p -Name 'Enabled' -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue | Out-Null }
                          if ($null -eq (Get-ItemProperty -Path $p -Name 'DisabledByDefault' -ErrorAction SilentlyContinue)) { New-ItemProperty -Path $p -Name 'DisabledByDefault' -PropertyType DWord -Value 0 -Force -ErrorAction SilentlyContinue | Out-Null }
                          Set-ItemProperty -Path $p -Name 'Enabled' -Value 1 -Type DWord -ErrorAction Stop
                          Set-ItemProperty -Path $p -Name 'DisabledByDefault' -Value 0 -Type DWord -ErrorAction Stop
                          $ok = ((Get-ItemProperty -Path $p -Name 'Enabled' -ErrorAction Stop).Enabled -eq 1)
                      } catch { $why = $_.Exception.Message }
                      $rows += [pscustomobject]@{ protocol = $proto; side = $side; enabled = $ok; why = $why }
                  }
              }
              return $rows
          }
          function Invoke-F30TlsNormalize {
              # The applier: enable suites, enforce order, protocols, RDP security
              # layer, restart the services that re-read Schannel, stamp state.
              param(
                  [string[]]$Suites,
                  [string]$FunctionsKey = $script:F30FunctionsKey,
                  [string]$SchannelRoot = $script:F30SchannelRoot,
                  [string]$StatePath = 'C:\ghrdp\tls-norm.json',
                  [string]$BackupPath = 'C:\ghrdp\tls\f30-cipher-functions-original.txt',
                  [switch]$SkipServiceRestart
              )
              $applied = @(); $failed = @()
              foreach ($s in $Suites) {
                  try { Enable-TlsCipherSuite -Name $s -ErrorAction Stop; $applied += $s }
                  catch { $failed += ($s + ': ' + $_.Exception.Message) }
              }
              $order = Set-F30CipherOrder -Key $FunctionsKey -Suites $Suites -BackupPath $BackupPath
              $protocols = @(Set-F30TlsProtocols -SchannelRoot $SchannelRoot)
              # RDP-Tcp security layer: keep TLS-only (2) + HIGH min encryption (3).
              $secLayer = $null; $minEnc = $null; $rdpWhy = ''
              try {
                  $rdpKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
                  if ($null -eq (Get-ItemProperty -Path $rdpKey -Name 'SecurityLayer' -ErrorAction SilentlyContinue)) { New-ItemProperty -Path $rdpKey -Name 'SecurityLayer' -PropertyType DWord -Value 2 -Force -ErrorAction SilentlyContinue | Out-Null }
                  if ($null -eq (Get-ItemProperty -Path $rdpKey -Name 'MinEncryptionLevel' -ErrorAction SilentlyContinue)) { New-ItemProperty -Path $rdpKey -Name 'MinEncryptionLevel' -PropertyType DWord -Value 3 -Force -ErrorAction SilentlyContinue | Out-Null }
                  Set-ItemProperty -Path $rdpKey -Name 'SecurityLayer' -Value 2 -Type DWord -ErrorAction Stop
                  Set-ItemProperty -Path $rdpKey -Name 'MinEncryptionLevel' -Value 3 -Type DWord -ErrorAction Stop
                  $secLayer = (Get-ItemProperty -Path $rdpKey -Name 'SecurityLayer' -ErrorAction Stop).SecurityLayer
                  $minEnc = (Get-ItemProperty -Path $rdpKey -Name 'MinEncryptionLevel' -ErrorAction Stop).MinEncryptionLevel
              } catch { $rdpWhy = $_.Exception.Message }
              $restarted = @()
              if (-not $SkipServiceRestart) {
                  foreach ($svc in @('TermService', 'WinRM')) {
                      try { Restart-Service -Name $svc -Force -ErrorAction Stop; $restarted += $svc } catch { $restarted += ($svc + ':' + $_.Exception.Message) }
                  }
                  # RDP session services re-read the listener config next start;
                  # Schannel itself is a kernel driver (no restartable service) -
                  # the TermService restart is what makes the listener re-read it.
                  foreach ($svc in @('SessionEnv', 'UmRdpService')) {
                      try { Restart-Service -Name $svc -Force -ErrorAction Stop; $restarted += $svc } catch { }
                  }
                  Start-Sleep -Seconds 5
              }
              $tls12 = @($protocols | Where-Object { $_.protocol -eq 'TLS 1.2' -and $_.enabled }).Count
              $tls13 = @($protocols | Where-Object { $_.protocol -eq 'TLS 1.3' -and $_.enabled }).Count
              $state = [ordered]@{
                  ts                 = (Get-Date).ToUniversalTime().ToString('o')
                  suites             = $Suites
                  suitesEnabled      = $applied
                  suitesFailed       = $failed
                  orderOk            = [bool]$order.ok
                  orderFunctions     = [string]$order.after
                  tls12Sides         = [int]$tls12
                  tls13Sides         = [int]$tls13
                  securityLayer      = $secLayer
                  minEncryptionLevel = $minEnc
                  rdpWhy             = $rdpWhy
                  restarted          = $restarted
              }
              try {
                  $dir = Split-Path -Parent $StatePath
                  if ($dir) { New-Item -ItemType Directory -Path $dir -Force -ErrorAction SilentlyContinue | Out-Null }
                  [System.IO.File]::WriteAllText($StatePath, ($state | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding($false)))
              } catch { }
              return [pscustomobject]@{
                  enabled    = $applied
                  failed     = $failed
                  order      = $order
                  protocols  = $protocols
                  securityLayer = $secLayer
                  minEncryptionLevel = $minEnc
                  rdpWhy     = $rdpWhy
                  restarted  = $restarted
                  tls12Sides = $tls12
                  tls13Sides = $tls13
                  state      = $state
              }
          }
          # [F30 §1 normalize-end]
          $f30 = Invoke-F30TlsNormalize -Suites $script:F30Suites
          # Guard the applier's contract LOUDLY before any live read (a throw here
          # is the same failure class the F30 step exists to prevent: a
          # half-normalized Schannel must never be advertised as ordered).
          if (-not $f30.order.ok) {
              Write-Host ('::error::[F30] Schannel cipher order not enforced; reason=' + $f30.order.why + '; after=' + $f30.order.after)
              throw 'F30 halted by design: the Schannel Functions list is not in the declared order (reason cipher-order-not-enforced)'
          }
          if ($null -eq $f30.securityLayer -or $null -eq $f30.minEncryptionLevel) {
              Write-Host ('::error::[F30] RDP-Tcp security layer unreadable; reason=' + $f30.rdpWhy)
              throw 'F30 halted by design: RDP-Tcp SecurityLayer/MinEncryptionLevel could not be written+read back (reason rdp-layer-not-enforced)'
          }
          if ([int]$f30.securityLayer -ne 2 -or [int]$f30.minEncryptionLevel -lt 3) {
              Write-Host ('::error::[F30] RDP-Tcp weakened: SecurityLayer=' + $f30.securityLayer + ' MinEncryptionLevel=' + $f30.minEncryptionLevel)
              throw 'F30 halted by design: SecurityLayer must stay 2 (TLS only) and MinEncryptionLevel >= 3 (reason rdp-layer-weakened)'
          }
          if ([int]$f30.tls12Sides -lt 2) {
              Write-Host '::error::[F30] TLS 1.2 is not Enabled on BOTH sides; reason tls12-not-enabled'
              throw 'F30 halted by design: TLS 1.2 must stay enabled on Client and Server (never disable it) (reason tls12-not-enabled)'
          }
          # Read the LIVE suite order back through the cmdlet as well (the registry
          # reread alone would not prove what Schannel actually offers).
          $f30Live = @()
          try { $f30Live = @(Get-F30SuiteNames -Items @(Get-TlsCipherSuite -ErrorAction Stop)) } catch { }
          $f30LiveHead = @($f30Live | Select-Object -First 8)
          # The cmdlet view is host-dependent: a build that does not expose a
          # suite (typically the TLS 1.3 set) omits it from Get-TlsCipherSuite
          # entirely, so "absent from the cmdlet" is NOT "not normalized" - the
          # Schannel Functions read-back is the definitive ordered list. A
          # suite the cmdlet DOES know must have been enabled, or the applier
          # promise is broken -> hard error below.
          $f30Known = @()
          $f30Unsupported = @()
          foreach ($s in $script:F30Suites) {
              if (Test-F30SuiteIn -Items $f30Live -Suite $s) { $f30Known += $s } else { $f30Unsupported += $s }
          }
          $f30KnownFailed = @($f30.failed | Where-Object { $n = ([string]$_ -split ':')[0]; $f30Known -contains $n })
          Write-Host ('[F30] suites enabled=' + $f30.enabled.Count + ' failed=' + $f30.failed.Count + ' orderOk=' + $f30.order.ok + ' tls12Sides=' + $f30.tls12Sides + ' tls13Sides=' + $f30.tls13Sides + ' securityLayer=' + $f30.securityLayer + ' minEncryption=' + $f30.minEncryptionLevel)
          Write-Host ('[F30] live suite head: ' + ($f30LiveHead -join ' | '))
          Write-Host ('[F30] ordered Functions head: ' + ((@($f30.order.after -split ',') | Select-Object -First 8) -join ' | '))
          Write-Host ('[F30] services: ' + ($f30.restarted -join ', '))
          if ($f30.failed.Count -gt 0) { Write-Host ('::warning::[F30] cipher suites not enabled by cmdlet (registry order still enforced): ' + ($f30.failed -join ' ; ') + ' | not exposed by Get-TlsCipherSuite on this build: ' + (@($f30Unsupported) -join ', ')) }
          if ($f30KnownFailed.Count -gt 0) {
              Write-Host ('::error::[F30] a suite this build DOES expose could not be enabled; reason cipher-enable-failed: ' + ($f30KnownFailed -join ' ; '))
              if ($S) { ('### F30 cipher enable FAILED - reason cipher-enable-failed: ' + ($f30KnownFailed -join ' ; ')) | Add-Content -Path $S }
              throw 'F30 halted by design: Enable-TlsCipherSuite failed for a suite the host exposes (reason cipher-enable-failed)'
          }
          # Stamp the honest cmdlet-vs-registry split so the dashboard reports
          # the order it can prove without pretending every suite is visible.
          try {
              $st = Get-Content -LiteralPath 'C:\ghrdp\tls-norm.json' -Raw | ConvertFrom-Json
              $st | Add-Member -NotePropertyName 'suitesUnsupportedByCmdlet' -NotePropertyValue @($f30Unsupported) -Force
              $st | Add-Member -NotePropertyName 'liveSuiteCount' -NotePropertyValue ([int]$f30Live.Count) -Force
              [System.IO.File]::WriteAllText('C:\ghrdp\tls-norm.json', ($st | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding($false)))
          } catch { }
          # Fail LOUD when the host cannot be normalized at all: an un-ordered /
          # un-enableable Schannel is exactly the state that drops the client at
          # handshake, and a green run must never advertise it as LIVE.
          if (-not $f30.order.ok -and $f30.enabled.Count -eq 0) {
              Write-Host ('::error::[F30] TLS normalization failed; reason cipher-normalization-failed; order=' + $f30.order.why + '; rdp=' + $f30.rdpWhy)
              if ($S) { '### F30 TLS/cipher normalization FAILED - reason cipher-normalization-failed' | Add-Content -Path $S; ('Suites enabled: ' + $f30.enabled.Count + '; order: ' + $f30.order.why + '; orderFunctions: ' + $f30.order.after) | Add-Content -Path $S }
              throw 'F30 halted by design: Schannel cipher order not enforced and no suite could be enabled (reason cipher-normalization-failed)'
          }
          if (-not $f30.order.ok) {
              # The cmdlet path worked but the priority list did not: the suites
              # are available (handshake can succeed) yet a CBC suite could still
              # be offered first - loud warning, order still reported to the UI.
              Write-Host ('::warning::[F30] cipher order NOT verified (' + $f30.order.why + '); suites are present - handshake can succeed, order is reported in the dashboard')
          }
          if ($f30.tls12Sides -lt 2) { Write-Host '::warning::[F30] TLS 1.2 registry writes are not both verified (Client+Server)' }
          if ($S) {
              '### F30 TLS/cipher normalization' | Add-Content -Path $S
              ('- ordered suites (first): ' + (($script:F30Suites | Select-Object -First 5) -join ', ')) | Add-Content -Path $S

              ('- RDP-Tcp SecurityLayer=' + $f30.securityLayer + ' MinEncryptionLevel=' + $f30.minEncryptionLevel + ' (TLS only, high encryption - NLA/CredSSP untouched)') | Add-Content -Path $S

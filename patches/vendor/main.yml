      - name: Install aria2c 1.36.0 (F59 prebuilt, SHA-256 verified) + loopback RPC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-timing.ps1')
          $f59sw = Start-F59Step
          # [F59 §2] PREBUILT BINARY (Chocolatey is no longer used anywhere on this
          # path): the F59 pre-warm step already downloaded aria2c 1.36.0 from the
          # prebuilt-binaries release and verified it against the committed pin AND
          # the release checksums.txt. Nothing is staged or executed before that
          # verification, and there is no warn-and-continue fallback: a missing or
          # unverified binary stops the step instead of silently degrading the lane.
          $ver = '1.36.0'
          $exe = 'C:\ghrdp\bin\aria2c.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw '[aria2c] prebuilt binary missing/verification failed in the F59 pre-warm step - refusing to continue (no Chocolatey fallback by design)' }
          try {
              $pins = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-prebuilt-pins.json') -Raw | ConvertFrom-Json
              . (Join-Path $env:GITHUB_WORKSPACE 'payloads/f59-prebuilt-verify.ps1')
              $null = Test-F59AssetSha256 -Path $exe -Expected ([string]$pins.assets.aria2c.sha256) -Label 'aria2c.exe (re-verify at use)'
          } catch {
              Write-Host ('::error::[aria2c] prebuilt re-verification failed: ' + $_.Exception.Message)
              throw
          }
          $hash = ''
          try { $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash } catch { $hash = '' }
          Write-Host ('[aria2c] version check: ' + $ver + ' exe=' + $exe + ' sha256=' + $hash)
          $verOut = ''
          try { $verOut = (& $exe --version 2>$null | Select-Object -First 1 | Out-String).Trim() } catch { }
          Write-Host ('[aria2c] ' + $verOut)
          if ($verOut -notmatch '1\.36\.0') { Write-Host ('::warning::[aria2c] version mismatch: expected 1.36.0 got ' + $verOut + ' - continuing advisory') }
          # RNG secret 32B alphanumeric -> GHRDP_ARIA2_RPC_SECRET env + persisted for service
          $chars = @(); $chars += (48..57); $chars += (65..90); $chars += (97..122)
          $secret = -join ((0..31) | ForEach-Object { [char]($chars | Get-Random) })
          Write-Host "::add-mask::$secret"
          $env:GHRDP_ARIA2_RPC_SECRET = $secret
          if ($env:GITHUB_ENV) { Add-Content -Path $env:GITHUB_ENV -Value ('GHRDP_ARIA2_RPC_SECRET=' + $secret) }
          $secDir = 'C:\ghrdp'
          $ariaDir = 'D:\ghrdp\aria2'
          New-Item -ItemType Directory -Path $secDir -Force | Out-Null
          New-Item -ItemType Directory -Path $ariaDir -Force | Out-Null
          $secFile = Join-Path $secDir 'aria2-secret.txt'
          try { [System.IO.File]::WriteAllText($secFile, $secret, (New-Object System.Text.UTF8Encoding($false))); Write-Host '[aria2c] secret persisted to C:\ghrdp\aria2-secret.txt (SYSTEM-only ACL)' } catch { Write-Host ('[aria2c] secret file write failed: ' + $_.Exception.Message) }
          try { icacls.exe $secFile /inheritance:r 2>&1 | Out-Null; icacls.exe $secFile /grant:r 'SYSTEM:(F)' 'Administrators:(F)' 2>&1 | Out-Null; $LASTEXITCODE=0 } catch { }
          # [F56-d §1] session path is the pinned C:\ghrdp\aria2\session.gz
          # (gzip-compressed session: aria2 reads and writes .gz transparently).
          $sessionFile = Join-Path $ariaDir 'session.gz'
          $ariaLog = Join-Path $ariaDir 'aria2.log'
          if (-not (Test-Path -LiteralPath $sessionFile)) { try { New-Item -ItemType File -Path $sessionFile -Force | Out-Null } catch { } }
          $fetchedDir = 'D:\RDP-Storage\Fetched'
          New-Item -ItemType Directory -Path $fetchedDir -Force | Out-Null
          # SYSTEM scheduled task GhrdpAria2 loopback 127.0.0.1:6800
          # [F56-d §1] CLI pins: max-conn-per-server=16, split=16, min-split-size=20M,
          # continue=true (large-artifact transport lane).
          $rpcArgs = '--enable-rpc --rpc-listen-all=false --rpc-listen-port=6800 --rpc-secret=' + $secret + ' --dir=' + $fetchedDir + ' --max-connection-per-server=16 --split=16 --min-split-size=20M --continue=true --follow-metalink=false --follow-torrent=false --check-integrity=true --save-session=' + $sessionFile + ' --input-file=' + $sessionFile + ' --save-session-interval=60 --log=' + $ariaLog + ' --log-level=notice'
          try { Unregister-ScheduledTask -TaskName 'GhrdpAria2' -Confirm:$false -ErrorAction SilentlyContinue } catch { }
          try {
              $action = New-ScheduledTaskAction -Execute $exe -Argument $rpcArgs
              $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(2)
              $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Hours 6)
              Register-ScheduledTask -TaskName 'GhrdpAria2' -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force -ErrorAction Stop | Out-Null
              Start-ScheduledTask -TaskName 'GhrdpAria2' -ErrorAction Stop
              Write-Host '[aria2c] GhrdpAria2 SYSTEM task registered + started (127.0.0.1:6800 loopback only)'
          } catch { Write-Host ('[aria2c] task registration failed: ' + $_.Exception.Message + ' - fallback background') }
          # [F56-d loop 5] Readiness is a real aria2.getVersion JSON-RPC round-trip
          # (the surface /api/fetch uses) - not just "is something bound to 6800".
          Start-Sleep -Seconds 3
          $listening = $false
          $rpcOk = $false
          $rpcVersion = ''
          $rpcReason = 'no-listener'
          for ($i=0; $i -lt 20; $i++) {
              try {
                  $c = Get-NetTCPConnection -LocalPort 6800 -State Listen -ErrorAction SilentlyContinue
                  if ($c) { $listening = $true }
              } catch { }
              $body = '{"jsonrpc":"2.0","id":"ghrdp","method":"aria2.getVersion","params":["token:' + $secret + '"]}'
              try {
                  $r = Invoke-RestMethod -Uri 'http://127.0.0.1:6800/jsonrpc' -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 5 -ErrorAction Stop
                  if ($r -and $r.result -and $r.result.version) { $rpcOk = $true; $rpcVersion = [string]$r.result.version; break }
                  $rpcReason = 'rpc-error-envelope'
              } catch { $rpcReason = $_.Exception.Message }
              Start-Sleep -Seconds 1
          }
          $listeners = @()
          try { $listeners = @((Get-NetTCPConnection -LocalPort 6800 -State Listen -ErrorAction SilentlyContinue) | ForEach-Object { [string]$_.LocalAddress }) } catch { }
          $nonLoop = @($listeners | Where-Object { $_ -ne '127.0.0.1' -and $_ -ne '::1' })
          Write-Host ('[aria2c] RPC getVersion ok=' + $rpcOk + ' version=' + $rpcVersion + ' listeners=[' + ($listeners -join ',') + '] (loopback only, follow-metalink=false, follow-torrent=false, max-conn=16 split=16 min-split=20M continue=true)')
          if ($nonLoop.Count -gt 0) {
              # A non-loopback listener is a hard stop: the RPC secret is the only
              # gate and the plan pins loopback.
              Write-Host ('::error::[aria2c] RPC bound to a non-loopback address: ' + ($nonLoop -join ','))
              try { Stop-ScheduledTask -TaskName 'GhrdpAria2' -ErrorAction SilentlyContinue } catch { }
              exit 1
          }
          if (-not $rpcOk) {
              Write-Host ('::warning::[aria2c] RPC getVersion failed (' + $rpcReason + ') - /api/fetch reports TRANSPORT_UNAVAILABLE until ready')
              if (Test-Path -LiteralPath $ariaLog) { Write-Host ('[aria2c] daemon log tail:'); try { Get-Content -LiteralPath $ariaLog -Tail 20 | ForEach-Object { Write-Host ('  ' + $_) } } catch { } }
          }
          Stop-F59Step -Step 'aria2c-install-rpc' -Sw $f59sw | Out-Null
          exit 0


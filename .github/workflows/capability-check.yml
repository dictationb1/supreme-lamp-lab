name: Capability Check Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'jules-**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  client-capability-check:
    name: Local Windows Client Capability Check
    runs-on: [self-hosted, Windows, X64, rdp-lab-client]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Initial Diagnostic Check
        shell: cmd
        run: |
          echo === PowerShell Execution Policy ^& Environment Diagnostics ===
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Get-ExecutionPolicy -List"
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Write-Host 'Effective Policy:' (Get-ExecutionPolicy); Write-Host 'PS Version:' $PSVersionTable.PSVersion; Write-Host 'Language Mode:' $ExecutionContext.SessionState.LanguageMode"
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Write-Host 'Runner Identity:' $env:COMPUTERNAME '\' $env:USERNAME; Write-Host 'Session ID:' (Get-Process -Id $PID).SessionId"
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Write-Host 'Git:' (Get-Command git -ErrorAction SilentlyContinue).Path; Write-Host 'Node:' (Get-Command node -ErrorAction SilentlyContinue).Path"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Per-Run Diagnostic Directory
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = if ($env:GITHUB_RUN_ID) { $env:GITHUB_RUN_ID } else { "local-run" }
          $runAttempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { "1" }
          $baseDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { ".." }
          $artDir = "$baseDir/artifacts/run-$runId-$runAttempt"
          New-Item -ItemType Directory -Force -Path $artDir | Out-Null

          $meta = @{
            runId = $runId
            runAttempt = $runAttempt
            event = $env:GITHUB_EVENT_NAME
            branch = $env:GITHUB_REF_NAME
            sha = $env:GITHUB_SHA
            runnerOS = $env:RUNNER_OS
            computerName = $env:COMPUTERNAME
            userName = $env:USERNAME
            sessionId = (Get-Process -Id $PID).SessionId
            startTime = (Get-Date).ToString('o')
          }
          $meta | ConvertTo-Json | Out-File -FilePath "$artDir/diagnostics.json" -Encoding UTF8
          Write-Host "Diagnostic directory initialized at $artDir"

      - name: Preflight Lab Process Cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "scripts/cleanup-lab.ps1"

      - name: Verify Windows OS, User and Interactive Session
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== Windows Client Environment Verification ==="
          Write-Host "Machine Name : $env:COMPUTERNAME"
          Write-Host "User Account : $env:USERNAME"
          Write-Host "OS Detail    : $((Get-CimInstance Win32_OperatingSystem).Caption)"
          $sessionId = (Get-Process -Id $PID).SessionId
          Write-Host "Session ID   : $sessionId"
          if ($sessionId -eq 0) {
            throw 'Desktop capability check requires an interactive Windows user session (Session ID > 0).'
          }
          Write-Host "OS, User, and Interactive Session check passed successfully."

      - name: Setup Node.js (ZIP Installer)
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = "20.18.1"
          $expectedSha256 = "56e5aacdeee7168871721b75819ccacf2367de8761b78eaceacdecd41e04ca03"
          $nodeZipName = "node-v$nodeVersion-win-x64.zip"
          $url = "https://nodejs.org/dist/v$nodeVersion/$nodeZipName"

          $tempDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $zipPath = Join-Path $tempDir $nodeZipName
          $extractDir = Join-Path $tempDir "node-v$nodeVersion-win-x64"

          if (-not (Test-Path "$extractDir/node.exe")) {
            Write-Host "Downloading Node.js v$nodeVersion from $url..."
            Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing

            Write-Host "Verifying SHA-256 checksum..."
            $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $expectedSha256.ToLower()) {
              throw "Node.js ZIP SHA-256 mismatch! Expected: $expectedSha256, Got: $actualHash"
            }
            Write-Host "Checksum verified successfully."

            Write-Host "Extracting Node.js archive..."
            Expand-Archive -Path $zipPath -DestinationPath $tempDir -Force
            Remove-Item -Path $zipPath -Force
          } else {
            Write-Host "Node.js v$nodeVersion already cached at $extractDir"
          }

          Write-Host "Adding Node.js to PATH..."
          Add-Content -Path $env:GITHUB_PATH -Value $extractDir
          $env:PATH = "$extractDir;$env:PATH"

          & "$extractDir/node.exe" -v
          & "$extractDir/npm.cmd" -v

      - name: Install Dependencies & Playwright
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with code $LASTEXITCODE" }
          npx.cmd playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright install failed with code $LASTEXITCODE" }

      - name: Run PowerShell & Regression Checks
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/run-regressions.js
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed with code $LASTEXITCODE" }

      - name: Launch Browser and Capture Screenshot & Video
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/browser-check.js
          if ($LASTEXITCODE -ne 0) { throw "Browser check failed with code $LASTEXITCODE" }

      - name: Provision & Verify Real Mission Control Application (supreme-lamp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Ensure git is available on PATH if installed in standard Windows locations
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            $gitCandidatePaths = @("C:\Program Files\Git\cmd", "C:\Program Files\Git\bin", "C:\Program Files (x86)\Git\cmd")
            foreach ($p in $gitCandidatePaths) {
              if (Test-Path "$p\git.exe") {
                Write-Host "Adding Git path to environment: $p"
                Add-Content -Path $env:GITHUB_PATH -Value $p
                $env:PATH = "$p;$env:PATH"
                break
              }
            }
          }

          $appDir = Join-Path $env:RUNNER_TEMP "supreme-lamp"
          if (Test-Path $appDir) { Remove-Item -Path $appDir -Recurse -Force }

          $appSha = ""
          if (Get-Command git -ErrorAction SilentlyContinue) {
            Write-Host "Cloning application repo dictationb1/supreme-lamp into $appDir via git..."
            & git clone --depth 1 https://github.com/dictationb1/supreme-lamp.git $appDir
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$appDir/payloads/ghrdp-server.ps1")) {
              $appSha = (& git -C $appDir rev-parse HEAD).Trim()
              Write-Host "Git clone successful. Application SHA: $appSha"
            }
          }

          if (-not (Test-Path "$appDir/payloads/ghrdp-server.ps1")) {
            Write-Host "Git clone unavailable or failed. Resolving exact main commit SHA via GitHub API..."
            $headers = @{}
            if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "token $env:GITHUB_TOKEN" }
            try {
              $commitInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/dictationb1/supreme-lamp/commits/main" -Headers $headers -UseBasicParsing
              $appSha = $commitInfo.sha
            } catch {
              Write-Host "API commit lookup failed: $_"
            }

            if (-not $appSha -or $appSha.Length -ne 40) {
              throw "Failed to resolve exact 40-character commit SHA for dictationb1/supreme-lamp."
            }

            Write-Host "Resolved exact application SHA: $appSha. Downloading source archive..."
            $zipUrl = "https://github.com/dictationb1/supreme-lamp/archive/$appSha.zip"
            $zipPath = Join-Path $env:RUNNER_TEMP "supreme-lamp-$appSha.zip"
            Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -Headers $headers -UseBasicParsing

            $extractTemp = Join-Path $env:RUNNER_TEMP "supreme-lamp-extract"
            if (Test-Path $extractTemp) { Remove-Item -Path $extractTemp -Recurse -Force }
            Expand-Archive -Path $zipPath -DestinationPath $extractTemp -Force
            Remove-Item -Path $zipPath -Force

            $extractedSubdir = Get-ChildItem -Path $extractTemp -Directory | Select-Object -First 1
            if (-not $extractedSubdir -or -not (Test-Path "$($extractedSubdir.FullName)/payloads/ghrdp-server.ps1")) {
              throw "Extracted archive does not contain payloads/ghrdp-server.ps1."
            }

            if (Test-Path $appDir) { Remove-Item -Path $appDir -Recurse -Force }
            Move-Item -Path $extractedSubdir.FullName -Destination $appDir
            Remove-Item -Path $extractTemp -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path "$appDir/payloads/ghrdp-server.ps1")) {
            throw "Failed to provision application source at $appDir."
          }

          Write-Host "Provisioned supreme-lamp revision: $appSha"

          $runId = if ($env:GITHUB_RUN_ID) { $env:GITHUB_RUN_ID } else { "local-run" }
          $runAttempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { "1" }
          $baseDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { ".." }
          $artDir = "$baseDir/artifacts/run-$runId-$runAttempt"

          $serverScript = Join-Path $appDir "payloads\ghrdp-server.ps1"
          $stdoutPath = Join-Path $artDir "backend-stdout.log"
          $stderrPath = Join-Path $artDir "backend-stderr.log"

          Write-Host "Starting real backend service ($serverScript)..."
          $proc = Start-Process -FilePath "powershell.exe" `
            -ArgumentList "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "`"$serverScript`"", "-Port", "7331" `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -PassThru -WindowStyle Hidden

          Write-Host "Started backend process PID: $($proc.Id)"

          # Register backend process in lab registry
          node -e "
            const registryUtils = require('./scripts/registry-utils');
            registryUtils.registerProcess({
              pid: $($proc.Id),
              processName: 'powershell-ghrdp-server',
              runId: '$runId',
              runAttempt: '$runAttempt'
            });
          "

          # Probe readiness with JSON semantic validation
          $url = "http://127.0.0.1:7331/api/readiness"
          Write-Host "Waiting for backend readiness at $url..."
          $ready = $false
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            try {
              $resp = Invoke-WebRequest -Uri $url -TimeoutSec 3 -UseBasicParsing
              if ($resp.StatusCode -eq 200) {
                $json = $resp.Content | ConvertFrom-Json
                if ($json.ok -eq $true -or $json.status -eq "ok" -or $json.status -eq "READY" -or $json.phase -eq "READY" -or $json.apiReadiness -eq "ok" -or $json.apiReadiness -eq $true) {
                  $ready = $true
                  Write-Host "Backend reported READY with valid JSON semantics: $($resp.Content)"
                  break
                } else {
                  Write-Host "Backend returned HTTP 200 but JSON semantics not ready yet: $($resp.Content)"
                }
              }
            } catch { }
            Start-Sleep -Seconds 1
          }

          if (-not $ready) {
            if (Test-Path $stdoutPath) { Write-Host "--- Backend stdout ---"; Get-Content $stdoutPath }
            if (Test-Path $stderrPath) { Write-Host "--- Backend stderr ---"; Get-Content $stderrPath }
            throw "Backend failed to become ready at $url with valid JSON semantics within 30 seconds."
          }

          Write-Host "Executing Mission Control check in same step..."
          $env:MISSION_CONTROL_URL = "http://127.0.0.1:7331"
          $env:RDP_TARGET = "127.0.0.1"
          $env:SUPREME_LAMP_SHA = $appSha
          $env:ALLOW_MOCK_MISSION_CONTROL = "false"

          & "node" "scripts/mission-control-check.js"
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $stdoutPath) { Write-Host "--- Backend stdout ---"; Get-Content $stdoutPath }
            if (Test-Path $stderrPath) { Write-Host "--- Backend stderr ---"; Get-Content $stderrPath }
            throw "Mission Control check failed with code $LASTEXITCODE"
          }

      - name: Postflight Lab Process Cleanup
        if: always()
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "scripts/cleanup-lab.ps1"

      - name: Validate Expected Artifacts
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = if ($env:GITHUB_RUN_ID) { $env:GITHUB_RUN_ID } else { "local-run" }
          $runAttempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { "1" }
          $baseDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { ".." }
          $artDir = "$baseDir/artifacts/run-$runId-$runAttempt"

          if (-not (Test-Path "$artDir/results.json")) {
            throw "Missing results.json in $artDir"
          }
          if (-not (Test-Path "$artDir/screenshot.png")) {
            throw "Missing screenshot.png in $artDir"
          }
          Write-Host "All required artifacts verified in $artDir"

      - name: Upload Private Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-browser-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/
          retention-days: 7

      - name: Record Artifact Evidence and Run URL
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = if ($env:GITHUB_RUN_ID) { $env:GITHUB_RUN_ID } else { "local-run" }
          $runAttempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { "1" }
          $baseDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { ".." }
          $artDir = "$baseDir/artifacts/run-$runId-$runAttempt"

          $runUrl = "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}/actions/runs/${env:GITHUB_RUN_ID}"
          $statusMsg = if (Test-Path "$artDir/results.json") { "Artifacts captured and uploaded successfully." } else { "Artifact capture incomplete." }

          $summary = @"
          ## Capability Check Evidence
          - **Run URL**: $runUrl
          - **Artifact Name**: `windows-client-browser-artifacts-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}`
          - **Status**: $statusMsg
          "@
          Write-Host $summary
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          }

  server-tailnet-check:
    name: Temporary Windows Server Tailnet Job
    runs-on: windows-latest
    needs: client-capability-check
    if: always()
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OIDC Federated Token Claims Diagnostic (Non-Secret)
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== OIDC Token Diagnostic Information ==="
          Write-Host "Issuer              : https://token.actions.githubusercontent.com"
          Write-Host "Repository          : $env:GITHUB_REPOSITORY"
          Write-Host "Ref                 : $env:GITHUB_REF"
          Write-Host "Event Name          : $env:GITHUB_EVENT_NAME"
          Write-Host "Workflow            : $env:GITHUB_WORKFLOW"
          Write-Host "SHA                 : $env:GITHUB_SHA"
          Write-Host "Actor               : $env:GITHUB_ACTOR"
          Write-Host "TS_OAUTH_CLIENT_ID  : $(if ($env:OAUTH_CLIENT_ID) { 'Present' } else { 'Missing/Empty' })"
          Write-Host "TS_AUDIENCE         : $(if ($env:AUDIENCE) { 'Present' } else { 'Missing/Empty' })"
        env:
          OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ secrets.TS_AUDIENCE }}

      - name: Check Auth Info Empty
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:OAUTH_CLIENT_ID) { throw "Missing TS_OAUTH_CLIENT_ID secret" }
          if (-not $env:AUDIENCE) { throw "Missing TS_AUDIENCE secret" }
        env:
          OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ secrets.TS_AUDIENCE }}

      - name: Connect Temporary Windows Server to Tailnet via OIDC
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: 1.90.1

      - name: Verify Client & Tailnet Connectivity
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Testing connectivity across Tailnet from temporary Windows server..."
          & "C:\Program Files\Tailscale\tailscale.exe" status
          if ($LASTEXITCODE -ne 0) { throw "Tailscale status failed with code $LASTEXITCODE" }

          $peerHost = $env:TAILSCALE_PEER_HOST
          if (-not $peerHost) {
            Write-Host "TAILSCALE_PEER_HOST not configured; skipping peer connectivity probe."
          } else {
            $peerPort = if ($env:TAILSCALE_PEER_PORT) { $env:TAILSCALE_PEER_PORT } else { "7331" }
            Write-Host "Performing bounded HTTP ping check to Tailscale peer $peerHost on port $peerPort..."
            $res = Invoke-WebRequest -Uri "http://${peerHost}:${peerPort}/api/readiness" -TimeoutSec 5 -ErrorAction SilentlyContinue
            if ($res.StatusCode -ne 200) {
              throw "Peer HTTP check failed with status code $($res.StatusCode)"
            }
            Write-Host "Peer connectivity check passed."
          }

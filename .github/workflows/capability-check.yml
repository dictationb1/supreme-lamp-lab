name: Capability Check Workflow

# Topology (see RUNBOOK.md):
#   static  (ubuntu)   lint/parse/regressions, resolves the app SHA, verifies the Node pin
#   server  (windows-latest, EPHEMERAL) stages the real supreme-lamp backend at the exact
#                      app SHA, supervises it, prepares the RDP target, joins the tailnet
#   client  (self-hosted interactive Windows) synthetic browser + native screenshot, then
#                      remote readiness / dashboard / RDP auto-login / Web Desktop over the tailnet
#   report  (ubuntu)   merges capability outputs; VERIFIED only if all 9 required PASS
# The self-hosted client never starts a backend and never changes machine-wide settings.
#
# PROVISIONING IDENTITY (a hard distinction, not cosmetics):
#   every job in THIS file is `standalone` lab provisioning - the lab starts its own
#   backend (`slab-srv-<run>-<attempt>`) and uses its own RDP account (`slabrdp` + the
#   lab's RDP_LAB_PASSWORD secret). Those credentials must NEVER be applied to an
#   application main run, which generates its own RDP account, password and dashboard
#   token per run. Attaching to an originating application run is a different code path:
#   .github/workflows/live-run.yml + `scripts/live-run.js live`, driven by the versioned
#   run descriptor and the trust anchor in scripts/lib/verify-origin.js.

run-name: >-
  capability ${{ github.event_name }}
  ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}
  ${{ inputs.mode && inputs.mode != 'full' && format('[{0}]', inputs.mode) || '' }}
  ${{ inputs.correlation_id && format('[{0}]', inputs.correlation_id) || '' }}

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'supreme-lamp commit (40-hex) or ref to verify; empty = config/app-source.json pin'
        required: false
        default: ''
        type: string
      correlation_id:
        description: 'Opaque id echoed in the run name (used by scripts/dispatch-verification.js)'
        required: false
        default: ''
        type: string
      mode:
        description: 'full = all capabilities (acceptance); consent-setup = bounded SETUP for the one-time RDP-file consent (no verdict); auth-diagnostic = OIDC/Tailscale join diagnosis only; live-origin = attach to an application run and is REJECTED here (that path is .github/workflows/live-run.yml); origin-selftest = exercise the live-origin code path against a lab-provisioned app backend'
        required: false
        default: full
        type: choice
        options: [full, consent-setup, auth-diagnostic, origin-selftest, live-origin]
      correlation_id_live:
        description: 'live-run queue correlation to serve (only meaningful with mode=origin-selftest; it never selects "the latest server")'
        required: false
        default: ''
        type: string
      setup_timeout_ms:
        description: 'consent-setup only: how long the SETUP window stays open (ms, max 900000). Bounded on purpose - no indefinite hosted jobs.'
        required: false
        default: '600000'
        type: string

concurrency:
  group: capability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  actions: read

env:
  BUNDLE_DIR: reports/mission-control/40051974454-1
  LAB_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      app_sha: ${{ steps.app.outputs.app_sha }}
      node_version: ${{ steps.nodepin.outputs.node_version }}
      node_win_sha256: ${{ steps.nodepin.outputs.node_win_sha256 }}
      caps_regressions: ${{ steps.regress.outputs.caps_regressions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'

      - name: Resolve app commit under test
        id: app
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-app-source.js

      - name: Verify Node pin against the GPG-signed SHASUMS256.txt
        id: nodepin
        run: |
          set -euo pipefail
          version=$(jq -r .version config/node-pin.json)
          keys=$(jq -r .releaseKeysCommit config/node-pin.json)
          pin=$(jq -r .winX64ZipSha256 config/node-pin.json)
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/keys.tgz" "https://codeload.github.com/nodejs/release-keys/tar.gz/$keys"
          tar -xzf "$work/keys.tgz" -C "$work"
          keyring="$work/release-keys-$keys/gpg-only-active-keys/pubring.kbx"
          curl -fsSL --retry 3 -o "$work/SHASUMS256.txt" "https://nodejs.org/dist/$version/SHASUMS256.txt"
          curl -fsSL --retry 3 -o "$work/SHASUMS256.txt.sig" "https://nodejs.org/dist/$version/SHASUMS256.txt.sig"
          gpgv --keyring "$keyring" "$work/SHASUMS256.txt.sig" "$work/SHASUMS256.txt"
          hash=$(awk -v f="node-$version-win-x64.zip" '$2 == f { print $1 }' "$work/SHASUMS256.txt")
          if ! [[ "$hash" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::node-$version-win-x64.zip not in signed SHASUMS"; exit 1; fi
          if [ -n "$pin" ] && [ "$pin" != "$hash" ]; then
            echo "::error title=Node pin mismatch::config/node-pin.json winX64ZipSha256=$pin but signed SHASUMS says $hash"; exit 1
          fi
          if [ -z "$pin" ]; then
            echo "::warning title=Node pin not yet recorded::signature-verified sha256 of node-$version-win-x64.zip is $hash - record it in config/node-pin.json"
          fi
          echo "::notice title=Node pin verified::node-$version-win-x64.zip sha256=$hash (gpgv OK, release-keys@$keys)"
          {
            echo "node_version=$version"
            echo "node_win_sha256=$hash"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          set -euo pipefail
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "node --check OK"

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Regression suite (Linux, browser e2e required)
        id: regress
        env:
          REQUIRE_BROWSER_TESTS: '1'
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: node scripts/run-regressions.js

      - name: PowerShell parse (scripts + workflow run blocks)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'wf-ps'
          python3 -c "import yaml" 2>$null
          if ($LASTEXITCODE -ne 0) { python3 -m pip install --quiet pyyaml }
          python3 scripts/test/extract-workflow-powershell.py $tmp
          if ($LASTEXITCODE -ne 0) { throw 'extraction failed' }
          ./scripts/test/Test-PowerShellSyntax.ps1 -Paths @('scripts', $tmp)

      - name: actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          v=1.7.12
          work=$(mktemp -d)
          base="https://github.com/rhysd/actionlint/releases/download/v$v"
          curl -fsSL --retry 3 -o "$work/al.tgz" "$base/actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$work/sums.txt" "$base/actionlint_${v}_checksums.txt"
          want=$(awk -v f="actionlint_${v}_linux_amd64.tar.gz" '$2 == f { print $1 }' "$work/sums.txt")
          echo "$want  $work/al.tgz" | sha256sum -c -
          tar -xzf "$work/al.tgz" -C "$work" actionlint
          "$work/actionlint" -color

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn

  auth-diagnostic:
    name: auth-diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'auth-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: OIDC claims (decoded, token never printed)
        env:
          OIDC_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: node scripts/oidc-claims-diagnostic.js
      - name: Tailscale join attempt (diagnostic)
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: slab-diag-${{ github.run_id }}-${{ github.run_attempt }}
          retry: 3
      - name: Classify the join failure (documented token-exchange probe)
        id: tailnet
        if: always()
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TAILSCALE_JOIN_OUTCOME: ${{ steps.tailscale.outcome }}
          TAILSCALE_HOSTNAME: slab-diag-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/tailnet-token-exchange-diagnostic.js
      - name: Diagnostic verdict
        env:
          OUTCOME: ${{ steps.tailscale.outcome }}
          CATEGORY: ${{ steps.tailnet.outputs.tailnet_category }}
          DETAIL: ${{ steps.tailnet.outputs.tailnet_detail }}
        run: |
          if [ "$OUTCOME" = "success" ]; then echo "::notice title=Tailscale join::OK"; else echo "::error title=Tailscale join::outcome=$OUTCOME category=$CATEGORY detail=$DETAIL"; exit 1; fi

  server:
    name: server
    needs: static
    if: >-
      !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'auth-diagnostic' || inputs.mode == 'live-origin')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APP_SHA: ${{ needs.static.outputs.app_sha }}
    outputs:
      caps_server_local: ${{ steps.supervise.outputs.caps_server_local }}
      backend_pid: ${{ steps.supervise.outputs.backend_pid }}
      supervisor_first_failure: ${{ steps.supervise.outputs.supervisor_first_failure }}
      tailscale_outcome: ${{ steps.tailscale.outcome }}
      ts_configured: ${{ steps.tscfg.outputs.configured }}
      oidc_sub: ${{ steps.oidc.outputs.oidc_sub }}
      audience_matches: ${{ steps.oidc.outputs.audience_matches }}
      tailnet_category: ${{ steps.tailnet.outputs.tailnet_category }}
      tailnet_detail: ${{ steps.tailnet.outputs.tailnet_detail }}
      tailnet_first_error: ${{ steps.tailnet.outputs.tailnet_first_error }}
      tailnet_failed_operation: ${{ steps.tailnet.outputs.tailnet_failed_operation }}
      tailnet_cli_version: ${{ steps.tailnet.outputs.tailnet_cli_version }}
      tailnet_service_state: ${{ steps.tailnet.outputs.tailnet_service_state }}
      backend_identity_state: ${{ steps.supervise.outputs.backend_identity_state }}
      supervisor_degraded_guards: ${{ steps.supervise.outputs.supervisor_degraded_guards }}
      rdp_configured: ${{ steps.rdp.outputs.rdp_configured }}
      rdp_reason: ${{ steps.rdp.outputs.rdp_reason }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Node (sha256 verified)
        run: ./scripts/ps/Install-PinnedNode.ps1 -Version '${{ needs.static.outputs.node_version }}' -ExpectedSha256 '${{ needs.static.outputs.node_win_sha256 }}'

      - name: Provisioning identity (standalone lab backend)
        run: |
          # Loud, on every run, so nobody mistakes a standalone verdict for an
          # application-run verdict: this backend is the lab's own.
          Write-Host "::notice title=Provisioning=standalone::backend=slab-srv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT account=slabrdp (lab secret) - NOT an application main run; for that use live-run.yml"

      - name: Preflight owned-process cleanup
        run: node scripts/cleanup-lab.js --mode preflight

      - name: Checkout supreme-lamp at the exact app SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dictationb1/supreme-lamp
          ref: ${{ needs.static.outputs.app_sha }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Install lab dependencies + Chromium
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'playwright install failed' }

      - name: Stage backend + commit-matched UI bundle (app's own staging functions)
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/server/Stage-App.ps1 -LabAppDir app -LabSha $env:APP_SHA -LabOut (Join-Path $env:RUNNER_TEMP 'stage-result.json')

      - name: Prepare ephemeral RDP target (tailnet-only firewall)
        id: rdp
        env:
          RDP_LAB_PASSWORD: ${{ secrets.RDP_LAB_PASSWORD }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'rdp-target.json'
          ./scripts/server/Prepare-RdpTarget.ps1 -Out $out
          $code = $LASTEXITCODE
          $st = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          "rdp_configured=$(([string]$st.rdpConfigured).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "rdp_reason=$($st.reason)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $code

      - name: OIDC claims diagnostic (decoded subject, token never printed)
        id: oidc
        if: always()
        env:
          OIDC_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: node scripts/oidc-claims-diagnostic.js

      - name: Tailscale configuration present?
        id: tscfg
        if: always()
        env:
          HAS_CLIENT: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_AUD: ${{ secrets.TS_AUDIENCE != '' }}
        run: |
          if ($env:HAS_CLIENT -eq 'true' -and $env:HAS_AUD -eq 'true') { 'configured=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          else { 'configured=false' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8; Write-Host '::error title=Tailscale BLOCKED::MISSING_CONFIG: TS_OAUTH_CLIENT_ID and/or TS_AUDIENCE secret not set' }

      - name: Join tailnet (workload identity)
        id: tailscale
        if: always() && steps.tscfg.outputs.configured == 'true'
        continue-on-error: true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: slab-srv-${{ github.run_id }}-${{ github.run_attempt }}
          retry: 4

      - name: Classify the join failure (documented token-exchange probe)
        id: tailnet
        if: always()
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TAILSCALE_JOIN_OUTCOME: ${{ steps.tailscale.outcome }}
          TAILSCALE_HOSTNAME: slab-srv-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/tailnet-token-exchange-diagnostic.js

      - name: Tailnet address
        if: always() && steps.tailscale.outcome == 'success'
        run: |
          $ip = (& tailscale ip -4 | Select-Object -First 1)
          Write-Host "::notice title=Server tailnet address::slab-srv-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT} = $ip"

      - name: Supervise backend (start, server-local checks, hold for client, stop)
        id: supervise
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          STAGE_ERROR: ${{ steps.stage.outputs.stage_error }}
        run: |
          if ($env:STAGE_OUTCOME -ne 'success') {
            node scripts/mission-control-check.js --scope server-local --fail-reason "STAGING_FAILED: outcome=$env:STAGE_OUTCOME; $env:STAGE_ERROR"
            exit 1
          }
          node scripts/backend-supervisor.js --root 'C:\ghrdp' --sha $env:APP_SHA --port 7331 --hold '${{ steps.tailscale.outcome == 'success' }}' --hold-max-ms 1200000 --client-job client
          exit $LASTEXITCODE

      - name: Collect bounded RDP evidence (server-side ground truth, read-only)
        if: always()
        run: ./scripts/server/Collect-RdpDiagnostics.ps1 -User slabrdp -SinceMinutes 30 -Out (Join-Path $env:RUNNER_TEMP 'rdp-diagnostics.json')

      - name: Postflight owned-process cleanup
        if: always()
        run: node scripts/cleanup-lab.js --mode postflight --out (Join-Path $env:RUNNER_TEMP 'artifacts\cleanup-postflight.json')

      - name: Publish sanitized server evidence to the exact PR branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flat = Join-Path $env:RUNNER_TEMP 'publish-server'
          New-Item -ItemType Directory -Force -Path $flat | Out-Null
          $art = Join-Path $env:RUNNER_TEMP 'artifacts'
          if (Test-Path $art) {
            Get-ChildItem -LiteralPath $art -Recurse -File -Filter '*.json' | ForEach-Object {
              $target = Join-Path $flat $_.Name
              if (Test-Path $target) { $target = Join-Path $flat ($_.Directory.Name + '-' + $_.Name) }
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          }
          foreach ($name in @('stage-result.json','rdp-target.json','rdp-diagnostics.json')) {
            $src = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $src) { Copy-Item -LiteralPath $src -Destination (Join-Path $flat $name) -Force }
          }
          node scripts/publish-evidence.js --dir $flat --dest ($env:BUNDLE_DIR + '/evidence/capability-' + $env:GITHUB_RUN_ID + '/server') --branch $env:HEAD_BRANCH --message "evidence: capability server $env:GITHUB_RUN_ID [skip ci]"
          exit $LASTEXITCODE

      - name: Upload server evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/artifacts/
            ${{ runner.temp }}/stage-result.json
            ${{ runner.temp }}/rdp-target.json
            ${{ runner.temp }}/rdp-diagnostics.json
          if-no-files-found: warn

      - name: Tailnet gate (explicit failure when the server could not join)
        if: always() && steps.tailscale.outcome != 'success'
        env:
          OUTCOME: ${{ steps.tailscale.outcome }}
          CATEGORY: ${{ steps.tailnet.outputs.tailnet_category }}
          DETAIL: ${{ steps.tailnet.outputs.tailnet_detail }}
          SUB: ${{ steps.oidc.outputs.oidc_sub }}
          AUD_MATCH: ${{ steps.oidc.outputs.audience_matches }}
        run: |
          # The category/detail come from the token-exchange probe (the observed
          # outcome). The OIDC subject is reported as a fact, never as the cause.
          Write-Host "::error title=tailnet_connectivity BLOCKED::tailscale step outcome=$env:OUTCOME; category=$env:CATEGORY; detail=$env:DETAIL"
          Write-Host "::notice title=tailnet facts::observed OIDC sub=$env:SUB audMatchesConfigured=$env:AUD_MATCH (facts recorded for comparison with the configured trust credential; not a diagnosis)"
          exit 1

  client:
    name: client
    needs: static
    if: >-
      !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'auth-diagnostic' || inputs.mode == 'live-origin')) &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.label.name == 'capability-run'))
    # ONE DESKTOP OWNER AT A TIME. The client VM has a single interactive
    # session; a pull_request event used to queue this 25-minute client job on
    # the same desktop every time any branch was pushed, so a live-run
    # verification (label `live-verify`) queued behind it. A pull request now has
    # to ask for this job explicitly with the `capability-run` label.
    runs-on: [self-hosted, Windows, X64, rdp-lab-client]
    timeout-minutes: 25
    env:
      APP_SHA: ${{ needs.static.outputs.app_sha }}
    outputs:
      caps_regressions: ${{ steps.regress.outputs.caps_regressions }}
      caps_client_local: ${{ steps.browser.outputs.caps_client_local }}
      caps_tailnet: ${{ steps.peer.outputs.caps_tailnet }}
      caps_remote: ${{ steps.remote.outputs.caps_remote }}
      backend_pid_remote: ${{ steps.remote.outputs.backend_pid_remote }}
      setup_state: ${{ steps.setup.outputs.setup_state }}
      setup_detail: ${{ steps.setup.outputs.setup_detail }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Runner identity
        run: |
          $s = (Get-Process -Id $PID).SessionId
          Write-Host "::notice title=Client runner::$env:RUNNER_NAME $env:COMPUTERNAME\$env:USERNAME session=$s PS=$($PSVersionTable.PSVersion)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Node (sha256 verified)
        run: ./scripts/ps/Install-PinnedNode.ps1 -Version '${{ needs.static.outputs.node_version }}' -ExpectedSha256 '${{ needs.static.outputs.node_win_sha256 }}'

      - name: Preflight owned-process cleanup (abandoned records only)
        run: |
          node scripts/cleanup-lab.js --mode preflight
          exit $LASTEXITCODE

      - name: Install lab dependencies + Chromium
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'playwright install failed' }

      - name: Regression suite (Windows, real processes)
        id: regress
        env:
          REQUIRE_BROWSER_TESTS: '1'
          ARTIFACT_DIR: ${{ runner.temp }}\artifacts\run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/run-regressions.js
          exit $LASTEXITCODE

      - name: Client-local capabilities (synthetic browser, native screenshot)
        id: browser
        if: always() && inputs.mode != 'consent-setup'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}\artifacts\run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/browser-check.js
          exit $LASTEXITCODE

      - name: Wait for this attempt's server on the tailnet
        id: peer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/wait-for-peer.js --hostname "slab-srv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --port 7331 --timeout-ms 900000 --server-job server
          exit $LASTEXITCODE

      - name: Remote capabilities (readiness, dashboard, RDP auto-login, Web Desktop)
        id: remote
        if: always() && inputs.mode != 'consent-setup'
        env:
          PEER_IP: ${{ steps.peer.outputs.peer_ip }}
          RDP_HOST: ${{ steps.peer.outputs.peer_ip }}
          CLIENT_TAILNET_IP: ${{ steps.peer.outputs.client_ip }}
          RDP_USER: slabrdp
          RDP_LAB_PASSWORD: ${{ secrets.RDP_LAB_PASSWORD }}
        run: |
          if (-not $env:PEER_IP) {
            node scripts/mission-control-check.js --scope remote --blocked-reason 'DEPENDS_ON_TAILNET: server peer not reachable (see tailnet_connectivity)'
          } else {
            node scripts/mission-control-check.js --scope remote --target "http://$($env:PEER_IP):7331" --expect-sha $env:APP_SHA --expect-port 7331 --ready-timeout-ms 180000
          }
          exit $LASTEXITCODE

      - name: SETUP ONLY - bounded RDP-file consent window (no verification verdict)
        id: setup
        if: always() && inputs.mode == 'consent-setup'
        timeout-minutes: 16
        env:
          PEER_IP: ${{ steps.peer.outputs.peer_ip }}
          SETUP_TIMEOUT_MS: ${{ inputs.setup_timeout_ms }}
          ARTIFACT_DIR: ${{ runner.temp }}\artifacts\run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # SETUP, not an acceptance run. The verification path detects the consent
          # dialog on its first poll and cleans up immediately (correct for an
          # unattended run, but it gives a human no time to act). This step opens the
          # production-shaped .rdp once and holds the desktop window open for a
          # bounded period so the operator can answer the one-time account consent.
          # It never clicks the dialog, never writes consent state and produces no
          # capability verdict.
          if (-not $env:PEER_IP) {
            Write-Host "::error title=SETUP blocked::no live server peer for this attempt; the target must be an address the current run printed"
            "setup_state=BLOCKED_NO_LIVE_TARGET" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          $ms = 600000
          if ($env:SETUP_TIMEOUT_MS) { [void][int]::TryParse($env:SETUP_TIMEOUT_MS, [ref]$ms) }
          if ($ms -gt 900000) { $ms = 900000 }
          node scripts/rdp-consent-setup.js --host $env:PEER_IP --user slabrdp --timeout-ms $ms --poll-ms 5000
          $code = $LASTEXITCODE
          $state = 'UNKNOWN'
          $detail = ''
          $json = Join-Path $env:ARTIFACT_DIR 'setup-consent.json'
          if (Test-Path $json) {
            try {
              $doc = Get-Content -Raw -Path $json | ConvertFrom-Json
              $state = [string]$doc.state
              $detail = ([string]$doc.message).Replace("`n", ' ').Replace("`r", ' ')
            } catch { $state = 'UNKNOWN_UNPARSEABLE_EVIDENCE' }
          }
          "setup_state=$state" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup_detail=$($detail.Substring(0, [Math]::Min(300, $detail.Length)))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "::notice title=SETUP result::$state - $detail"
          Write-Host "SETUP exit code $code (0 = answered/connected, 4 = a different dialog is blocking, 5 = no dialog seen, 7 = closed without evidence)"
          # Only a procedure/usage failure fails the job; an unanswered or blocked
          # SETUP window is a reported state, not a fake verification failure.
          if ($code -eq 64 -or $code -eq 69) { exit 1 }
          exit 0

      - name: Postflight owned-process cleanup (this run attempt only)
        if: always()
        run: |
          node scripts/cleanup-lab.js --mode postflight --out (Join-Path $env:RUNNER_TEMP "artifacts\run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT\cleanup-postflight.json")
          exit $LASTEXITCODE

      - name: Publish sanitized client evidence to the exact PR branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flat = Join-Path $env:RUNNER_TEMP 'publish-client'
          New-Item -ItemType Directory -Force -Path $flat | Out-Null
          $art = Join-Path $env:RUNNER_TEMP "artifacts\run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path $art) {
            Get-ChildItem -LiteralPath $art -Recurse -File -Filter '*.json' | ForEach-Object {
              $target = Join-Path $flat $_.Name
              if (Test-Path $target) { $target = Join-Path $flat ($_.Directory.Name + '-' + $_.Name) }
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
            # Browser-viewport images only. Native desktop/RDP captures, videos,
            # profiles and credential artifacts are deliberately not auto-published.
            foreach ($name in @('browser-synthetic.png','dashboard_client.png')) {
              $src = Join-Path $art $name
              if (Test-Path $src) { Copy-Item -LiteralPath $src -Destination (Join-Path $flat $name) -Force }
            }
          }
          node scripts/publish-evidence.js --dir $flat --dest ($env:BUNDLE_DIR + '/evidence/capability-' + $env:GITHUB_RUN_ID + '/client') --branch $env:HEAD_BRANCH --message "evidence: capability client $env:GITHUB_RUN_ID [skip ci]"
          exit $LASTEXITCODE

      - name: Upload client evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn

  # live-origin guard: a dispatch that asks THIS workflow to attach to an application
  # run must fail loudly, rather than quietly verifying the lab's own throwaway backend
  # and reporting that as the application's state.
  live-origin-guard:
    name: live-origin guard
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-origin'
    runs-on: ubuntu-latest
    steps:
      - name: refuse
        run: |
          echo "::error title=WRONG WORKFLOW FOR live-origin::mode=live-origin is served by .github/workflows/live-run.yml (claim -> verify origin -> client VM). This workflow can only attach to the lab's OWN standalone backend, so running it here would produce a verdict about the wrong server."
          echo 'Use: gh workflow run live-run.yml --repo dictationb1/supreme-lamp-lab -f correlation_id=<id>' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  report:
    name: report
    needs: [static, server, client]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: SETUP summary (no verdict - this run never verifies anything)
        if: inputs.mode == 'consent-setup'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ inputs.mode }}
          LAB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SETUP_STATE: ${{ needs.client.outputs.setup_state }}
          SETUP_DETAIL: ${{ needs.client.outputs.setup_detail }}
          SETUP_SUMMARY_PATH: ${{ runner.temp }}/setup-summary.json
        run: node scripts/setup-summary.js

      - name: Build verification report (VERIFIED only if all required capabilities PASS)
        if: inputs.mode != 'consent-setup'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          APP_SHA: ${{ needs.static.outputs.app_sha }}
          LAB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/verification-report.json
        run: node scripts/verification-report.js
      - name: Publish the sanitized verdict to the exact PR branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flat = Join-Path $env:RUNNER_TEMP 'publish-report'
          New-Item -ItemType Directory -Force -Path $flat | Out-Null
          foreach ($name in @('verification-report.json','setup-summary.json')) {
            $src = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $src) { Copy-Item -LiteralPath $src -Destination (Join-Path $flat $name) -Force }
          }
          node scripts/publish-evidence.js --dir $flat --dest ($env:BUNDLE_DIR + '/evidence/capability-' + $env:GITHUB_RUN_ID + '/report') --branch $env:HEAD_BRANCH --message "evidence: capability verdict $env:GITHUB_RUN_ID [skip ci]"
          exit $LASTEXITCODE

      - name: Upload verification report
        if: always() && inputs.mode != 'consent-setup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification-report.json
          if-no-files-found: error

      - name: Upload setup summary
        if: always() && inputs.mode == 'consent-setup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/setup-summary.json
          if-no-files-found: warn

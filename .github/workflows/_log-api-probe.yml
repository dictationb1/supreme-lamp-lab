# TEMPORARY end-to-end harness for the LIVE SIGNAL transport (not app evidence).
# keygen makes an ephemeral RSA pair; publisher writes a REAL MC-SIGNAL v1
# (key encrypted) into a public check-run output while it is still running;
# reader uses the production code path (scripts/lib/live-signal.js) to read,
# validate and decrypt it WHILE the publisher is alive.
name: _log-api-probe
on:
  push:
    paths: ['.github/workflows/_log-api-probe.yml']
permissions:
  contents: read
  checks: write
concurrency:
  group: log-api-probe
  cancel-in-progress: true
jobs:
  keygen:
    runs-on: ubuntu-latest
    outputs:
      pub: ${{ steps.k.outputs.pub }}
      priv: ${{ steps.k.outputs.priv }}
    steps:
      - id: k
        run: |
          node -e '
            const c=require("crypto");
            const {publicKey,privateKey}=c.generateKeyPairSync("rsa",{modulusLength:2048});
            const fs=require("fs");
            fs.writeFileSync(process.env.GITHUB_OUTPUT,
              "pub="+Buffer.from(publicKey.export({type:"spki",format:"pem"})).toString("base64")+"\n"+
              "priv="+Buffer.from(privateKey.export({type:"pkcs8",format:"pem"})).toString("base64")+"\n",{flag:"a"});
          '
  publisher:
    needs: keygen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: publish the encrypted live signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUB: ${{ needs.keygen.outputs.pub }}
        run: |
          set -euo pipefail
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name="mission-control-live-signal" -f head_sha="$GITHUB_SHA" -f status=in_progress -f started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -f 'output[title]=live' -f 'output[summary]=booting' --jq .id)
          echo "check-run=$id"
          node -e '
            const fs=require("fs"), s=require("./scripts/lib/live-signal");
            const pub=Buffer.from(process.env.PUB,"base64").toString("utf8");
            const text=s.buildSignal({
              repo:process.env.GITHUB_REPOSITORY, runId:process.env.GITHUB_RUN_ID, attempt:process.env.GITHUB_RUN_ATTEMPT,
              appSha:process.env.GITHUB_SHA, uiBuild:"harness",
              endpoint:"http://100.101.102.103:7331/", correlation:"harness-"+process.env.GITHUB_RUN_ID,
              expiresAt:new Date(Date.now()+3600e3).toISOString(), key:"HARNESS-KEY-"+process.env.GITHUB_RUN_ID
            }, pub);
            fs.writeFileSync("/tmp/signal.txt", text);
          '
          for i in $(seq 1 6); do
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" -f status=in_progress -f 'output[title]=live' -f "output[summary]=$(cat /tmp/signal.txt)" >/dev/null
            echo "tick $i published ($(wc -c </tmp/signal.txt) bytes)"
            sleep 25
          done
          rm -f /tmp/signal.txt
  reader:
    needs: keygen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: read + validate + decrypt the signal while the publisher is alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIV: ${{ needs.keygen.outputs.priv }}
        run: |
          set -o pipefail
          start=$(date +%s); ok=0; last=""
          for i in $(seq 0 20); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name=="mission-control-live-signal")]' 2>/dev/null || echo '[]')
            res=$(printf '%s' "$runs" | PRIV="$PRIV" node -e '
              let raw=""; process.stdin.on("data",d=>raw+=d).on("end",()=>{
                const s=require("./scripts/lib/live-signal");
                let rows=[]; try{rows=JSON.parse(raw)}catch(e){}
                const pick=s.pickCheckRun(rows);
                if(!pick){ console.log("NO_SIGNAL"); process.exit(0); }
                const r=s.resolveSignal(pick.output && pick.output.summary, {
                  repo:process.env.GITHUB_REPOSITORY, runId:process.env.GITHUB_RUN_ID,
                  attempt:process.env.GITHUB_RUN_ATTEMPT, appSha:process.env.GITHUB_SHA
                }, Buffer.from(process.env.PRIV,"base64").toString("utf8"));
                console.log(JSON.stringify({status:pick.status, ok:r.ok, code:r.code||null, key:r.ok?r.key:null, host:r.host||null, expires:r.expiresAt||null}));
              });')
            last="$res"; echo "attempt $i $res"
            if printf '%s' "$res" | grep -q '"ok":true'; then ok=1; echo "LATENCY_SECONDS=$(( $(date +%s) - start ))" | tee -a /tmp/lat; break; fi
            sleep 10
          done
          echo "::notice title=live-signal-read::$([ "$ok" = 1 ] && echo DECRYPTED_LIVE || echo NOT_VISIBLE) $(printf '%s' "$last" | head -c 260)"
          [ "$ok" = 1 ] && echo "::notice title=live-signal-latency::$(cat /tmp/lat 2>/dev/null)"
          grep -q "HARNESS-KEY" <<<"$last" && echo "::notice title=live-signal-key::decrypted key matched the publisher's value"

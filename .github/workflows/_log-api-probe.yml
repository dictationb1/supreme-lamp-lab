# TEMPORARY live-transport harness. Question: can an ORIGIN run publish a
# non-secret live signal that the lab can read WHILE the run is still alive?
# Job logs cannot (measured: blob 404 for queued/running jobs). A check-run
# output is updated by the app's own GITHUB_TOKEN and is publicly readable.
# This measures the transport only; the value is a sentinel, not a credential.
name: _log-api-probe
on:
  push:
    paths: ['.github/workflows/_log-api-probe.yml']
permissions:
  contents: read
  checks: write
concurrency:
  group: log-api-probe
  cancel-in-progress: true
jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: create the signal and keep updating it while "live"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="mission-control-live-signal" -f head_sha="$GITHUB_SHA" \
            -f status=in_progress -f started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f 'output[title]=live' -f 'output[summary]=booting' --jq .id)
          echo "check-run=$id"
          for i in $(seq 1 6); do
            sleep 30
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$id" \
              -f status=in_progress \
              -f 'output[title]=live' \
              -f "output[summary]=SENTINEL-${GITHUB_RUN_ID} tick ${i} endpoint=http://100.101.102.103:7331/ id=$(printf 'a%.0s' $(seq 1 48))" >/dev/null
            echo "tick $i published"
          done
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: read the signal while the publisher is still running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          start=$(date +%s)
          seq_found=0
          for i in $(seq 0 15); do
            body=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="mission-control-live-signal")][0] | {status: .status, summary: (.output.summary // ""), id: .id}' 2>&1) || body="ERR $body"
            echo "attempt $i $body"
            if printf '%s' "$body" | grep -q "SENTINEL-${GITHUB_RUN_ID}"; then
              seq_found=1
              echo "LATENCY_SECONDS=$(( $(date +%s) - start ))"
              break
            fi
            sleep 12
          done
          if [ "$seq_found" = 1 ]; then echo "::notice title=live-signal::READABLE_LIVE sentinel visible in check-run output (attempt $i)"; else echo "::notice title=live-signal::NOT_READABLE"; fi
          echo "::notice title=live-signal-status::$(printf '%s' "$body" | head -c 300)"
